<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marketplace — mockup · TheOffice.AI</title>
<style>
  :root {
    color-scheme: light;
    --cp-bg: #f4f5f7; --cp-bg-elevated: #fafbfc; --cp-surface: #ffffff; --cp-surface-soft: #eef0f3;
    --cp-border: #dee1e6; --cp-border-strong: #a8aeb8;
    --cp-text: #1b1f27; --cp-text-muted: #59616d; --cp-text-soft: #6e7682;
    --cp-accent: #2563eb; --cp-accent-soft: rgba(37,99,235,0.10);
    --cp-success: #16a34a; --cp-danger: #dc2626; --cp-warning: #f59e0b; --cp-link: #1f6fb1;
    --font-sans: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: Consolas, "Courier New", Courier, monospace;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #161922; --cp-bg-elevated: #1b1f29; --cp-surface: #21262f; --cp-surface-soft: #272d37;
    --cp-border: #343b47; --cp-border-strong: #4b5563;
    --cp-text: #e4e7ec; --cp-text-muted: #98a1ad; --cp-text-soft: #b4bcc6;
    --cp-accent: #60a5fa; --cp-accent-soft: rgba(96,165,250,0.16);
    --cp-success: #4ade80; --cp-danger: #f87171; --cp-warning: #fbbf24; --cp-link: #7cc0f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 26px 30px; }
  a { color: inherit; text-decoration: none; }
  .muted { color: var(--cp-text-muted); }
  .soft { color: var(--cp-text-soft); }
  .count { font-size: 12px; color: var(--cp-text-muted); font-variant-numeric: tabular-nums; }

  .mock-banner { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--cp-text-muted);
    background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 10px; padding: 8px 14px; margin-bottom: 16px; }
  .mock-banner strong { color: var(--cp-text); }
  .mock-banner .sp { flex: 1; }
  .theme-btn { border: 1px solid var(--cp-border); background: var(--cp-surface-soft); color: var(--cp-text-soft);
    border-radius: 8px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .theme-btn:hover { color: var(--cp-text); border-color: var(--cp-border-strong); }

  /* ---- studio: rail + stage, mirrors newsletter .nlx-studio ---- */
  .mk-studio { display: grid; grid-template-columns: 288px minmax(0,1fr); gap: 18px; align-items: start; }

  /* ---- rail ---- */
  .mk-rail { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
  .mk-card { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 12px; padding: 12px; }
  .mk-card .card-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--cp-text-soft);
    font-weight: 700; margin: 2px 4px 8px; }
  .mk-search { position: relative; margin-bottom: 10px; }
  .mk-search input { width: 100%; padding: 8px 10px 8px 30px; background: var(--cp-bg-elevated); color: var(--cp-text);
    border: 1px solid var(--cp-border); border-radius: 8px; font-size: 13px; }
  .mk-search input:focus { outline: none; border-color: var(--cp-border-strong); }
  .mk-search .mag { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--cp-text-soft); font-size: 13px; }

  /* primary type navigation — quiet text links, no pills */
  .nav-link { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; cursor: pointer;
    color: var(--cp-text-muted); border-left: 2px solid transparent; }
  .nav-link:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
  .nav-link.active { background: var(--cp-accent-soft); color: var(--cp-text); border-left-color: var(--cp-accent); font-weight: 600; }
  .nav-link .ico { width: 18px; text-align: center; font-size: 14px; }
  .nav-link .lbl { flex: 1; font-size: 13px; }

  .src-row { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; cursor: pointer;
    color: var(--cp-text-muted); border-left: 2px solid transparent; }
  .src-row:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
  .src-row.active { background: var(--cp-accent-soft); color: var(--cp-text); border-left-color: var(--cp-accent); }
  .src-row .ico { width: 18px; text-align: center; font-size: 13px; }
  .src-main { flex: 1; min-width: 0; }
  .src-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-path { font-size: 11px; color: var(--cp-text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add-src { display: flex; gap: 6px; margin-top: 8px; }
  .add-src button { flex: 1; padding: 6px 8px; font-size: 11.5px; border: 1px dashed var(--cp-border-strong);
    background: transparent; color: var(--cp-text-soft); border-radius: 8px; cursor: pointer; }
  .add-src button:hover { color: var(--cp-text); border-color: var(--cp-accent); background: var(--cp-accent-soft); }

  /* ---- stage: bordered pane, internal scroll, pinned bar (mirrors .nlx-stage) ---- */
  .mk-stage { background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 132px); min-height: 460px; }
  .mk-stage-bar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--cp-border);
    background: var(--cp-surface); flex: 0 0 auto; }
  .mk-stage-bar .title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .mk-stage-bar .title .n { font-size: 12px; color: var(--cp-text-soft); font-weight: 500; }
  .stage-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .stage-actions label { font-size: 12px; color: var(--cp-text-muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .stage-actions select { background: var(--cp-bg-elevated); color: var(--cp-text); border: 1px solid var(--cp-border);
    border-radius: 8px; padding: 5px 8px; font-size: 12px; }
  .backlink { border: 1px solid var(--cp-border); background: var(--cp-surface-soft); color: var(--cp-text-soft);
    border-radius: 8px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .backlink:hover { color: var(--cp-text); border-color: var(--cp-border-strong); }

  .mk-scroll { flex: 1; overflow: auto; padding: 4px 0 12px; }

  /* what's-new strip: calm, left-accent, inline text links (no pills) */
  .whatsnew { margin: 14px 16px 6px; padding: 11px 14px; border-radius: 10px; background: var(--cp-surface);
    border: 1px solid var(--cp-border); border-left: 3px solid var(--cp-accent); }
  .whatsnew .wh-h { font-size: 12px; font-weight: 700; color: var(--cp-text); margin-bottom: 5px; }
  .whatsnew .wh-links { display: flex; flex-wrap: wrap; gap: 4px 4px; align-items: baseline; font-size: 12.5px; color: var(--cp-text-muted); }
  .whatsnew .wh-links a { color: var(--cp-link); cursor: pointer; }
  .whatsnew .wh-links a:hover { text-decoration: underline; }
  .whatsnew .dot { color: var(--cp-text-soft); margin: 0 3px; }

  /* group heading — plain text with muted count, not a pill */
  .grp-h { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 4px; }
  .grp-h .g-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--cp-text-soft); }
  .grp-h .g-count { font-size: 12px; color: var(--cp-text-muted); }

  /* catalog rows: hairline dividers, no per-item frame */
  .mk-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid var(--cp-border); }
  .mk-item:hover { background: var(--cp-surface-soft); }
  .mk-item .it-ico { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 8px; background: var(--cp-surface-soft);
    display: flex; align-items: center; justify-content: center; font-size: 17px; border: 1px solid var(--cp-border); }
  .mk-item .it-body { flex: 1; min-width: 0; }
  .mk-item .it-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .mk-item .it-desc { font-size: 12.5px; color: var(--cp-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mk-item .it-meta { font-size: 11.5px; color: var(--cp-text-soft); margin-top: 1px; }
  .mk-item .it-act { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }

  /* small status badges on individual items are OK per convention */
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; }
  .badge.new { background: color-mix(in srgb, var(--cp-accent) 18%, transparent); color: var(--cp-accent); }
  .badge.installed { background: color-mix(in srgb, var(--cp-success) 20%, transparent); color: var(--cp-success); }
  .btn { border: 1px solid var(--cp-border-strong); background: var(--cp-surface); color: var(--cp-text);
    border-radius: 8px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: var(--cp-accent); color: var(--cp-accent); }
  .btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: #fff; }
  .btn.primary:hover { color: #fff; filter: brightness(1.06); }
  .btn.done { border-style: dashed; color: var(--cp-text-soft); cursor: default; }
  .btn.done:hover { border-color: var(--cp-border-strong); color: var(--cp-text-soft); }

  .mk-empty { text-align: center; color: var(--cp-text-soft); padding: 60px 20px; }
  .mk-empty .big { font-size: 32px; }

  /* ---- detail hero: fills the stage (mirrors .nlx-paper as the hero) ---- */
  .mk-detail { padding: 22px 26px 40px; max-width: 720px; }
  .mk-detail .d-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 6px; }
  .mk-detail .d-ico { width: 48px; height: 48px; border-radius: 11px; background: var(--cp-surface-soft);
    display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid var(--cp-border); flex: 0 0 auto; }
  .mk-detail h1 { font-size: 22px; margin: 2px 0 4px; letter-spacing: -.01em; }
  .mk-detail .d-sub { font-size: 12.5px; color: var(--cp-text-soft); display: flex; flex-wrap: wrap; gap: 4px 4px; align-items: baseline; }
  .mk-detail .d-sub .dot { color: var(--cp-text-soft); margin: 0 3px; }
  .mk-detail .d-actions { margin: 16px 0 22px; display: flex; gap: 10px; align-items: center; }
  .mk-detail .d-desc { font-size: 14px; color: var(--cp-text); line-height: 1.6; }
  .mk-detail .d-sec { margin-top: 22px; }
  .mk-detail .d-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--cp-text-soft);
    margin: 0 0 8px; font-weight: 700; }
  .mk-detail .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; }
  .mk-detail .kv .k { color: var(--cp-text-soft); }
  .mk-detail .kv code { font-family: var(--font-mono); font-size: 12px; background: var(--cp-surface-soft);
    padding: 1px 6px; border-radius: 5px; border: 1px solid var(--cp-border); }
  .mk-detail .tagline { display: flex; flex-wrap: wrap; gap: 5px 4px; font-size: 12.5px; color: var(--cp-text-muted); }
  .mk-detail .tagline a { color: var(--cp-link); cursor: pointer; }
  .mk-detail .tagline .dot { color: var(--cp-text-soft); margin: 0 2px; }

  @media (max-width: 860px) {
    .mk-studio { grid-template-columns: 1fr; }
    .mk-rail { position: static; }
    .mk-stage { height: auto; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mock-banner">
      <strong>Marketplace redesign — static mockup</strong>
      <span>Studio layout (rail + focused stage) modeled on the Newsletter page. No functionality is wired up.</span>
      <span class="sp"></span>
      <button class="theme-btn" onclick="toggleTheme()">◐ Theme</button>
    </div>

    <div class="mk-studio">
      <!-- LEFT RAIL: navigation + filters live here, out of the content's way -->
      <aside class="mk-rail">
        <div class="mk-card">
          <div class="mk-search">
            <span class="mag">🔎</span>
            <input id="q" type="text" placeholder="Search the marketplace…" oninput="render()" />
          </div>
          <div id="typeNav"></div>
        </div>

        <div class="mk-card">
          <div class="card-h">Sources</div>
          <div id="srcNav"></div>
          <div class="add-src">
            <button onclick="alert('mockup: connect an Azure DevOps repo')">＋ Azure DevOps</button>
            <button onclick="alert('mockup: connect a GitHub repo')">＋ GitHub</button>
          </div>
        </div>
      </aside>

      <!-- CENTER STAGE: one focused view at a time; internal scroll keeps the bar + rail pinned -->
      <main class="mk-stage">
        <div class="mk-stage-bar" id="stageBar"></div>
        <div class="mk-scroll" id="stage"></div>
      </main>
    </div>
  </div>

<script>
  // ---- sample catalog (realistic mix) ----
  const TYPES = {
    agent:  { label: 'Agents',      icon: '🤖', action: 'Install', noun: 'agent' },
    plugin: { label: 'Plugins',     icon: '🧩', action: 'Install', noun: 'plugin' },
    skill:  { label: 'Skills',      icon: '🛠️', action: 'Add',     noun: 'skill' },
    mcp:    { label: 'MCP servers', icon: '🔌', action: 'Add',     noun: 'MCP server' },
  };
  const SOURCES = {
    'local-1': { label: 'my-agents',       kind: 'local',  icon: '📁', path: 'C:\\repos\\my-agents' },
    'azdo-1':  { label: 'dnceng · helix',  kind: 'azdo',   icon: '🔷', path: 'dnceng/internal/helix-observer@main' },
    'gh-1':    { label: 'costahome/office',src:'', kind: 'github', icon: '🐙', path: 'costahome/office-agents@main' },
    'gh-2':    { label: 'contoso/skills',  kind: 'github', icon: '🐙', path: 'contoso/skill-lab@main' },
  };
  const ITEMS = [
    { id:'a1', type:'agent',  name:'Standup Facilitator',   src:'gh-1',    desc:'Runs async daily standups, nudges blockers and posts a digest to your channel.', installed:true,  isNew:false, ver:'1.4.0', tags:['standup','summarize','teams'] },
    { id:'a2', type:'agent',  name:'PR Steward',            src:'azdo-1',  desc:'Reviews pull requests, applies feedback, hardens and validates before merge.',   installed:false, isNew:true,  ver:'0.9.2', tags:['code-review','ci','git'] },
    { id:'a3', type:'agent',  name:'Release Notes Writer',  src:'gh-1',    desc:'Drafts crisp release notes from merged PRs and closed issues.',                  installed:false, isNew:true,  ver:'1.1.0', tags:['docs','changelog'] },
    { id:'a4', type:'agent',  name:'On-call Triage',        src:'azdo-1',  desc:'Triages alerts, correlates telemetry and proposes mitigations.',                 installed:false, isNew:false, ver:'2.0.1', tags:['sre','alerts'] },
    { id:'p1', type:'plugin', name:'Azure DevOps Suite',    src:'azdo-1',  desc:'Work items, pipelines, PRs and dashboards exposed as agent tools.',              installed:true,  isNew:false, ver:'3.2.0', tags:['azdo','pipelines'] },
    { id:'p2', type:'plugin', name:'Newsletter Studio',     src:'local-1', desc:'Compose, chart and email impact newsletters from your work.',                   installed:false, isNew:true,  ver:'0.6.0', tags:['email','charts'] },
    { id:'p3', type:'plugin', name:'Kusto Explorer',        src:'azdo-1',  desc:'Query and visualize Kusto / Eventhouse straight from chat.',                     installed:false, isNew:false, ver:'1.8.3', tags:['kusto','data'] },
    { id:'s1', type:'skill',  name:'Summarize Thread',      src:'gh-2',    desc:'Condense a long chat or email thread into decisions and action items.',          installed:false, isNew:false, ver:'1.0.0', tags:['summarize'] },
    { id:'s2', type:'skill',  name:'Chart from CSV',        src:'gh-2',    desc:'Turn tabular data into clean inline SVG charts.',                                installed:false, isNew:true,  ver:'1.2.0', tags:['charts','data'] },
    { id:'s3', type:'skill',  name:'Rewrite for Tone',      src:'local-1', desc:'Adjust copy for tone, length and audience.',                                    installed:true,  isNew:false, ver:'1.0.4', tags:['writing'] },
    { id:'s4', type:'skill',  name:'Extract Action Items',  src:'gh-2',    desc:'Pull owners and due dates out of meeting transcripts.',                          installed:false, isNew:false, ver:'1.1.0', tags:['meetings'] },
    { id:'m1', type:'mcp',    name:'Kusto MCP',             src:'azdo-1',  desc:'Read-only Kusto access over MCP.',                                               installed:false, isNew:true,  ver:'0.3.0', cmd:'npx', args:'@office/kusto-mcp --readonly', env:['KUSTO_CLUSTER'], tags:['kusto'] },
    { id:'m2', type:'mcp',    name:'GitHub MCP',            src:'gh-1',    desc:'Issues, PRs and repo files exposed as MCP tools.',                               installed:true,  isNew:false, ver:'1.0.0', cmd:'gh-mcp', args:'serve', env:['GITHUB_TOKEN'], tags:['github'] },
  ];

  let state = { type: 'all', src: 'all', groupBy: 'type', selected: null };

  const el = id => document.getElementById(id);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const countType = k => ITEMS.filter(i => i.type === k).length;
  const countSrc  = k => ITEMS.filter(i => i.src === k).length;

  function buildRail() {
    // Primary navigation: capability type. Quiet text links + muted counts, active gets a soft accent.
    const rows = [['all','🗂️','All capabilities', ITEMS.length]];
    Object.entries(TYPES).forEach(([k,t]) => rows.push([k, t.icon, t.label, countType(k)]));
    el('typeNav').innerHTML = rows.map(([k,ic,lbl,n]) =>
      `<div class="nav-link ${state.type===k?'active':''}" onclick="setType('${k}')">
         <span class="ico">${ic}</span><span class="lbl">${lbl}</span><span class="count">${n}</span>
       </div>`).join('');

    let s = `<div class="src-row ${state.src==='all'?'active':''}" onclick="setSrc('all')">
        <span class="ico">🗃️</span><div class="src-main"><div class="src-name">All sources</div></div>
        <span class="count">${ITEMS.length}</span></div>
      <div class="src-row ${state.src==='installed'?'active':''}" onclick="setSrc('installed')">
        <span class="ico">✓</span><div class="src-main"><div class="src-name">Installed only</div></div>
        <span class="count">${ITEMS.filter(i=>i.installed).length}</span></div>`;
    Object.entries(SOURCES).forEach(([id,src]) => {
      s += `<div class="src-row ${state.src===id?'active':''}" onclick="setSrc('${id}')">
          <span class="ico">${src.icon}</span>
          <div class="src-main"><div class="src-name">${esc(src.label)}</div><div class="src-path">${esc(src.path)}</div></div>
          <span class="count">${countSrc(id)}</span></div>`;
    });
    el('srcNav').innerHTML = s;
  }

  function setType(t){ state.type = t; state.selected = null; render(); }
  function setSrc(s){ state.src = s; state.selected = null; render(); }
  function open(id){ state.selected = id; render(); el('stage').scrollTop = 0; }
  function back(){ state.selected = null; render(); }

  function filtered() {
    const q = (el('q').value || '').toLowerCase().trim();
    return ITEMS.filter(i => {
      if (state.type !== 'all' && i.type !== state.type) return false;
      if (state.src === 'installed') { if (!i.installed) return false; }
      else if (state.src !== 'all' && i.src !== state.src) return false;
      if (q && !(i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q) || (i.tags||[]).some(t=>t.includes(q)))) return false;
      return true;
    });
  }

  function itemRow(i) {
    const t = TYPES[i.type];
    const src = SOURCES[i.src];
    const badge = i.installed ? `<span class="badge installed">Installed</span>`
               : i.isNew ? `<span class="badge new">New</span>` : '';
    const act = i.installed ? `<button class="btn done">Installed ✓</button>`
              : `<button class="btn ${i.type==='agent'||i.type==='plugin'?'primary':''}" onclick="event.stopPropagation();alert('mockup: ${t.action} ${esc(i.name)}')">${t.action}</button>`;
    return `<div class="mk-item" onclick="open('${i.id}')">
        <div class="it-ico">${t.icon}</div>
        <div class="it-body">
          <div class="it-name">${esc(i.name)} ${badge}</div>
          <div class="it-desc">${esc(i.desc)}</div>
          <div class="it-meta">${src.icon} ${esc(src.label)} · v${i.ver}</div>
        </div>
        <div class="it-act">${act}</div>
      </div>`;
  }

  function whatsNewStrip() {
    // Only on the "All" home view — a calm what's-new strip with inline text links (no pills)
    if (state.type !== 'all' || state.src !== 'all' || (el('q').value||'').trim()) return '';
    const news = ITEMS.filter(i => i.isNew);
    if (!news.length) return '';
    const links = news.map((i,idx) =>
      `${idx?'<span class="dot">·</span>':''}<a onclick="open('${i.id}')">${esc(i.name)}</a>`).join(' ');
    return `<div class="whatsnew">
        <div class="wh-h">🆕 What's new · ${news.length} added this week</div>
        <div class="wh-links">${links}</div>
      </div>`;
  }

  function renderList() {
    const items = filtered();
    let html = whatsNewStrip();
    if (!items.length) {
      html += `<div class="mk-empty"><div class="big">🔍</div><p>No matches. Try another source or clear the search.</p></div>`;
      el('stage').innerHTML = html; return;
    }
    // group by the chosen dimension; plain-text headings with muted counts (no pills)
    const groups = {};
    items.forEach(i => {
      const key = state.groupBy === 'source' ? i.src : (state.groupBy === 'status' ? (i.installed?'installed':'available') : i.type);
      (groups[key] = groups[key] || []).push(i);
    });
    const order = state.groupBy === 'type' ? Object.keys(TYPES)
                : state.groupBy === 'source' ? Object.keys(SOURCES)
                : ['available','installed'];
    const label = k => state.groupBy === 'source' ? (SOURCES[k]?.label || k)
                     : state.groupBy === 'status' ? (k==='installed'?'Installed':'Available')
                     : (TYPES[k]?.label || k);
    order.filter(k => groups[k]).forEach(k => {
      // when a single type is selected, don't repeat the redundant type heading
      if (!(state.type !== 'all' && state.groupBy === 'type')) {
        html += `<div class="grp-h"><span class="g-title">${esc(label(k))}</span><span class="g-count">${groups[k].length}</span></div>`;
      }
      html += groups[k].map(itemRow).join('');
    });
    el('stage').innerHTML = html;
  }

  function renderDetail(i) {
    const t = TYPES[i.type]; const src = SOURCES[i.src];
    const tags = (i.tags||[]).map((tg,idx)=>`${idx?'<span class="dot">·</span>':''}<a>#${esc(tg)}</a>`).join(' ');
    const act = i.installed
      ? `<button class="btn done">Installed ✓</button><button class="btn" onclick="alert('mockup: remove')">Remove</button>`
      : `<button class="btn primary" onclick="alert('mockup: ${t.action} ${esc(i.name)}')">${t.action} ${esc(t.noun)}</button>`;
    let extra = '';
    if (i.type === 'mcp') {
      extra = `<div class="d-sec"><h3>Connection</h3><div class="kv">
          <div class="k">Command</div><div><code>${esc(i.cmd)} ${esc(i.args)}</code></div>
          <div class="k">Env</div><div>${(i.env||[]).map(e=>`<code>${esc(e)}</code>`).join(' ')}</div>
        </div></div>`;
    }
    el('stage').innerHTML = `<div class="mk-detail">
        <div class="d-head">
          <div class="d-ico">${t.icon}</div>
          <div>
            <h1>${esc(i.name)}</h1>
            <div class="d-sub">
              ${t.label.replace(/s$/,'')} <span class="dot">·</span>
              ${src.icon} ${esc(src.label)} <span class="dot">·</span> v${i.ver}
              ${i.isNew?'<span class="dot">·</span><span class="badge new">New</span>':''}
              ${i.installed?'<span class="dot">·</span><span class="badge installed">Installed</span>':''}
            </div>
          </div>
        </div>
        <div class="d-actions">${act}</div>
        <p class="d-desc">${esc(i.desc)}</p>
        <div class="d-sec"><h3>Source</h3><div class="kv">
          <div class="k">Repository</div><div>${esc(src.path)}</div>
          <div class="k">Kind</div><div>${esc(src.kind)}</div>
        </div></div>
        ${extra}
        <div class="d-sec"><h3>Tags</h3><div class="tagline">${tags||'<span class="muted">none</span>'}</div></div>
      </div>`;
  }

  function renderBar() {
    if (state.selected) {
      const i = ITEMS.find(x => x.id === state.selected);
      el('stageBar').innerHTML =
        `<button class="backlink" onclick="back()">← Back</button>
         <div class="title" style="font-size:14px">${TYPES[i.type].icon} ${esc(i.name)}</div>`;
      return;
    }
    const t = state.type === 'all' ? { icon:'🗂️', label:'All capabilities' } : TYPES[state.type];
    const n = filtered().length;
    const srcLbl = state.src === 'all' ? '' : state.src === 'installed' ? ' · installed'
                 : ' · ' + (SOURCES[state.src]?.label || '');
    el('stageBar').innerHTML = `
      <div class="title">${t.icon} ${esc(t.label)} <span class="n">${n} item${n===1?'':'s'}${esc(srcLbl)}</span></div>
      <div class="stage-actions">
        <label>Group by
          <select onchange="state.groupBy=this.value;render()">
            <option value="type" ${state.groupBy==='type'?'selected':''}>Type</option>
            <option value="source" ${state.groupBy==='source'?'selected':''}>Source</option>
            <option value="status" ${state.groupBy==='status'?'selected':''}>Status</option>
          </select>
        </label>
      </div>`;
  }

  function render() {
    buildRail();
    renderBar();
    if (state.selected) renderDetail(ITEMS.find(x => x.id === state.selected));
    else renderList();
  }

  function toggleTheme() {
    const h = document.documentElement;
    h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  render();
</script>
</body>
</html>
