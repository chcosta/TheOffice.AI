      });
      $('buddy').addEventListener('pointercancel', event => {
        if (!buddyGesture || buddyGesture.id !== event.pointerId) return;
        const wasDragging = buddyGesture.dragging;
        buddyGesture = null;
        if (wasDragging) setTimeout(finishBuddyDrag, 1500);
      });
      $('buddy').addEventListener('click', event => {
        if (invoke()) {
          event.preventDefault();
          return;
        }
        togglePanel();
      });
      $('buddy').addEventListener('mouseenter', schedulePeek);
      $('buddy').addEventListener('focus', schedulePeek);
      $('stage').addEventListener('mouseenter', () => clearTimeout(closeTimer));
      $('stage').addEventListener('mouseleave', () => {
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => {
          if (peekOpen && !manipulatingWindow && !controlFocused &&
              Date.now() >= controlInteractionUntil) hidePeek();
        }, 450);
      });
      $('panel').addEventListener('focusin', event => {
        if (!event.target.closest('button, input, select')) return;
        controlFocused = true;
        controlInteractionUntil = Number.POSITIVE_INFINITY;
        clearTimeout(closeTimer);
      });
      $('panel').addEventListener('focusout', () => {
        setTimeout(() => {
          controlFocused = !!$('panel').contains(document.activeElement) &&
            !!document.activeElement.closest?.('button, input, select');
          if (!controlFocused) controlInteractionUntil = Date.now() + 1200;
        }, 0);
      });
      $('closePanel').addEventListener('click', () => {
        closePanel();
      });
      for (const button of document.querySelectorAll('[data-view-target]')) {
        button.addEventListener('click', () => setView(button.dataset.viewTarget));
      }
      $('panel').querySelector('.panel-head').addEventListener('pointerdown', event => {
        if (event.button !== 0 || event.target.closest('button, input, select')) return;
        event.preventDefault();
        beginWindowAction('start_dev_buddy_drag');
      });
      $('bubble').addEventListener('click', event => {
        if (!event.target.closest('#dismissBubble')) openPanel();
      });
      $('dismissBubble').addEventListener('click', async event => {
        event.stopPropagation();
        if (lastFingerprint) {
          const until = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
          try {
            await request('/api/dev-buddy/signals/dismiss', {
              method: 'POST',
              body: JSON.stringify({ fingerprint: lastFingerprint, until }),
            });
          } catch (_) {}
        }
        hideBubble();
      });

      $('composer').addEventListener('submit', async event => {
        event.preventDefault();
        const input = $('newItem');
        const message = input.value.trim();
        if (!message || chatBusy) return;
        const conversation = chatHistory.filter(entry => !entry.pending).map(entry => ({
          role: entry.role,
          content: entry.content,
        }));
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: 'Thinking with you…', pending: true });
        input.value = '';
        chatBusy = true;
        renderChat();
        try {
          const result = await request('/api/dev-buddy/chat', {
            method: 'POST',
            body: JSON.stringify({ message, history: conversation }),
          });
          chatHistory.pop();
          chatHistory.push({ role: 'assistant', content: result.reply || 'I’m not sure how to help with that yet.', action: result.action || null });
          saveChat();
          await load();
        } catch (error) {
          chatHistory.pop();
          chatHistory.push({ role: 'assistant', content: error.message || 'I could not complete that request.' });
          saveChat();
        } finally {
          chatBusy = false;
          renderChat();
          input.focus();
        }
      });

      $('pixelChat').addEventListener('click', async event => {
        const button = event.target.closest('[data-chat-action]');
        if (!button) return;
        const entry = chatHistory.slice(-8)[Number(button.dataset.chatAction)];
        const action = entry && entry.action;
        if (!action) return;
        button.disabled = true;
        try {
          if (action.type === 'open' && action.item) {
            await openItem(action.item);
          } else if (action.type === 'confirm-work-item') {
            const result = await request('/api/dev-buddy/actions/work-item', {
              method: 'POST',
              body: JSON.stringify({ title: action.title, description: action.description }),
            });
            const workItem = result.workItem || {};
            entry.action = workItem.url ? {
              type: 'open',
              label: `Open work item #${workItem.id || ''}`,
              item: { title: action.title, link: workItem.url },
            } : null;
            chatHistory.push({
              role: 'assistant',
              content: `Created ${workItem.id ? `work item #${workItem.id}` : 'the work item'}: ${action.title}`,
              action: entry.action,
            });
            saveChat();
            renderChat();
          }
        } catch (error) {
          chatHistory.push({ role: 'assistant', content: error.message || 'That action could not be completed.' });
          saveChat();
          renderChat();
        } finally {
          button.disabled = false;
        }
      });

      function findListItem(row) {
        return findItemById(row?.dataset.id);
      }

      function findItemById(id) {
        return (status?.list || [...(status?.signals || []), ...(status?.items || [])])
          .find(entry => entry.id === id);
      }

      function refreshProgressIndicators(progressOverride) {
        const progress = progressOverride || status?.progress || {};
        const total = Math.max(
          0,
          Number(progress.totalTrackedToday) ||
          Number(progress.open || 0) + Number(progress.addressedToday || 0)
        );
        const maximum = Math.max(1, total);
        const setBar = (id, value) => {
          $(id).style.height = value > 0 ? `${Math.max(5, Math.round(value / maximum * 100))}%` : '0';
        };
        setBar('openBar', progress.open || 0);
        setBar('deferredBar', progress.deferredToday || 0);
        setBar('addressedBar', progress.addressedToday || 0);
        const summary = `${progress.open || 0} open / ${total} tracked today · ${progress.addressedToday || 0} addressed · ${progress.deferredToday || 0} deferred or reprioritized`;
        $('workBars').title = summary;
        $('dailyProgress').innerHTML = `<strong>${escapeHtml(progress.open || 0)} open / ${escapeHtml(total)} tracked today</strong> · ${escapeHtml(progress.addressedToday || 0)} addressed · ${escapeHtml(progress.deferredToday || 0)} deferred or reprioritized`;
      }

      function removeListItemLocally(row, item, actionType = 'completed') {
        const previousStatus = status;
        loadSequence++;
        pendingHiddenIds.add(item.id);
        row?.remove();
        const remove = entries => (entries || []).filter(entry => entry.id !== item.id);
        const list = remove(status?.list);
        const progress = status?.progress || {};
        const counts = status?.counts || {};
        const alreadyCounted = (status?.recentActivity || []).some(entry =>
          entry.id === item.id && (entry.actions || []).includes(actionType));
        const addressedIncrement = ['completed', 'dismissed'].includes(actionType) && !alreadyCounted ? 1 : 0;
        const deferredIncrement = actionType === 'deferred' && !alreadyCounted ? 1 : 0;
        status = {
          ...status,
          list,
          signals: remove(status?.signals),
          items: remove(status?.items),
          counts: {
            ...counts,
            attention: Math.max(0, Number(counts.attention || 0) - (item.urgency?.score >= 2 ? 1 : 0)),
            tracking: Math.max(0, Number(counts.tracking || 0) - (['agent-run', 'build', 'session'].includes(item.kind) ? 1 : 0)),
            remembered: Math.max(0, Number(counts.remembered || 0) - (!item.fingerprint || item.completable ? 1 : 0)),
          },
          progress: {
            ...progress,
            open: Math.max(0, Number(progress.open || list.length + 1) - 1),
            addressedToday: Number(progress.addressedToday || 0) + addressedIncrement,
            deferredToday: Number(progress.deferredToday || 0) + deferredIncrement,
            completedToday: Number(progress.completedToday || 0) + addressedIncrement,
          },
        };
        $('bodyCount').textContent = list.length > 99 ? '99+' : String(list.length);
        refreshBuddyUrgency(list);
        refreshProgressIndicators();
        if (selectedItemId === item.id) selectedItemId = '';
        renderWorkItems(list);
        return () => {
          loadSequence++;
          pendingHiddenIds.delete(item.id);
          status = previousStatus;
          render();
        };
      }

      function lowerPriorityLocally(row, item, priority) {
        const previousStatus = status;
        const update = entries => (entries || []).map(entry =>
          entry.id === item.id ? { ...entry, priority } : entry);
        const progress = status?.progress || {};
        const alreadyCounted = (status?.recentActivity || []).some(entry =>
          entry.id === item.id && (entry.actions || []).includes('reprioritized'));
        status = {
          ...status,
          list: update(status?.list),
          signals: update(status?.signals),
          items: update(status?.items),
          progress: {
            ...progress,
            deferredToday: Number(progress.deferredToday || 0) + (alreadyCounted ? 0 : 1),
          },
        };
        refreshBuddyUrgency(status.list);
        refreshProgressIndicators();
        renderWorkItems(status.list);
        return () => {
          status = previousStatus;
          render();
        };
      }

      function toggleStarLocally(item, starred) {
        const previousStatus = status;
        loadSequence++;
        pendingStarStates.set(item.id, starred);
        const update = entries => (entries || []).map(entry =>
          entry.id === item.id ? { ...entry, starred } : entry);
        status = {
          ...status,
          list: update(status?.list),
          signals: update(status?.signals),
          items: update(status?.items),
        };
        renderWorkItems(status.list);
        return () => {
          if (pendingStarStates.get(item.id) === starred) pendingStarStates.delete(item.id);
          loadSequence++;
          status = previousStatus;
          renderWorkItems(status?.list || []);
        };
      }

      async function updateListItem(item, body, reload = true) {
        if (item.completable) {
          await request('/api/dev-buddy/commitments/' + encodeURIComponent(item.id), {
            method: 'PUT',
            body: JSON.stringify(body),
          });
        } else if (item.fingerprint) {
          const signalKey = Object.prototype.hasOwnProperty.call(body, 'starred') || body.snoozedUntil
            ? (item.reminderKey || item.fingerprint)
            : item.fingerprint;
          await request('/api/dev-buddy/signals/' + encodeURIComponent(signalKey), {
            method: 'PUT',
            body: JSON.stringify({ ...body, title: item.title, source: item.source }),
          });
        } else {
          await request('/api/dev-buddy/items/' + encodeURIComponent(item.id), {
            method: 'PUT',
            body: JSON.stringify(body),
          });
        }
        if (body.snoozedUntil) scheduleSnoozeWake(body.snoozedUntil);
        if (reload) await load();
      }

      async function remindIn(select, item, row) {
        if (!select?.value || !item) return;
        const minutes = Number(select.value);
        if (!Number.isFinite(minutes) || minutes <= 0) return;
        select.disabled = true;
        const snoozedUntil = new Date(Date.now() + minutes * 60 * 1000).toISOString();
        const restore = removeListItemLocally(row, item, 'deferred');
        try {
          await updateListItem(item, { snoozedUntil }, false);
          void load();
        } catch (error) {
          restore();
        } finally {
          select.disabled = false;
        }
      }

      async function handleWorkAction(action, item, row, scope) {
        if (!action || !item) return;
        if (action === 'open') return openItem(item);
        if (action === 'star') {
          const starred = item.starred !== true;
          const restore = toggleStarLocally(item, starred);
          try {
            await updateListItem(item, { starred }, false);
            void load();
          } catch (error) {
            restore();
          }
          return;
        }
        if (action === 'remind-at') {
          const input = scope.querySelector('[data-reminder-at]');
          const reminderAt = new Date(input.value).getTime();
          if (!Number.isFinite(reminderAt) || reminderAt <= Date.now()) {
            input.setCustomValidity('Choose a future reminder time.');
            input.reportValidity();
            return;
          }
          input.setCustomValidity('');
          const restore = removeListItemLocally(row, item, 'deferred');
          try {
            await updateListItem(item, { snoozedUntil: new Date(reminderAt).toISOString() }, false);
            void load();
          } catch (error) {
            restore();
          }
          return;
        }
        const priorities = ['low', 'normal', 'high'];
        const currentPriority = Math.max(0, priorities.indexOf(item.priority || 'normal'));
        const body = action === 'done'
          ? { status: 'done' }
          : { priority: priorities[Math.max(0, currentPriority - 1)] };
        if (action === 'done') {
          const restore = removeListItemLocally(row, item, 'completed');
          celebrate(item.title);
          try {
            await updateListItem(item, body, false);
            void load();
          } catch (error) {
            restore();
            throw error;
          }
          return;
        }
        const nextPriority = body.priority;
        const restore = lowerPriorityLocally(row, item, nextPriority);
        try {
          await updateListItem(item, body, false);
          void load();
        } catch (error) {
          restore();
        }
      }

      function changeWorkSort(value) {
        workSort = ['urgency', 'arrival', 'manual'].includes(value)
          ? value
          : 'urgency';
        localStorage.setItem('dev-buddy-work-sort', workSort);
        renderWorkItems(status?.list || []);
      }

      $('workSort').addEventListener('change', event => changeWorkSort(event.target.value));
      $('previewSort').addEventListener('change', event => changeWorkSort(event.target.value));

      $('itemList').addEventListener('click', async event => {
        const row = event.target.closest('.item');
        if (!row) return;
        const item = findListItem(row);
        if (!item) return;
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (action) return handleWorkAction(action, item, row, row);
        if (event.target.closest('.drag-handle') || Date.now() < suppressItemOpenUntil) return;
        selectedItemId = item.id;
        localStorage.setItem('dev-buddy-selected-item', selectedItemId);
        renderWorkItems(status?.list || []);
      });
      $('itemList').addEventListener('keydown', event => {
        if (!['Enter', ' '].includes(event.key) || event.target !== event.target.closest('.item')) return;
        const row = event.target.closest('.item');
        const item = row && findListItem(row);
        if (!item) return;
        event.preventDefault();
        selectedItemId = item.id;
        localStorage.setItem('dev-buddy-selected-item', selectedItemId);
        renderWorkItems(status?.list || []);
      });

      $('itemDetail').addEventListener('change', event => {
        const select = event.target.closest('[data-reminder-in]');
        const item = findItemById(event.target.closest('[data-detail-id]')?.dataset.detailId);
        if (select) remindIn(select, item, $('itemList').querySelector(`[data-id="${CSS.escape(item?.id || '')}"]`));
      });
      $('itemDetail').addEventListener('click', event => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        const scope = event.target.closest('[data-detail-id]');
        const item = findItemById(scope?.dataset.detailId);
        if (action && item) {
          const row = $('itemList').querySelector(`[data-id="${CSS.escape(item.id)}"]`);
          handleWorkAction(action, item, row, scope);
        }
      });

      $('previewList').addEventListener('click', async event => {
        const row = event.target.closest('[data-preview-id]');
        const action = event.target.closest('[data-preview-action]')?.dataset.previewAction;
        const item = findItemById(row?.dataset.previewId);
        if (!item || !action) return;
        if (action === 'read') {
          selectedItemId = item.id;
          localStorage.setItem('dev-buddy-selected-item', selectedItemId);
          currentView = 'work';
          await openPanel();
          renderWorkItems(status?.list || []);
          return;
        }
        if (action === 'done' || action === 'star') {
          const listRow = $('itemList').querySelector(`[data-id="${CSS.escape(item.id)}"]`);
          await handleWorkAction(action, item, listRow, row);
        }
      });

      $('recentList').addEventListener('click', async event => {
        const button = event.target.closest('[data-recent-action]');
        if (!button) return;
        const label = button.textContent;
        button.disabled = true;
        button.textContent = 'Restoring…';
        try {
          loadSequence++;
          pendingHiddenIds.delete(button.dataset.recentId);
          await request('/api/dev-buddy/activity/' + encodeURIComponent(button.dataset.recentId) + '/restore', {
            method: 'POST',
            body: JSON.stringify({ action: button.dataset.recentAction }),
          });
          await load();
        } catch (error) {
          button.disabled = false;
          button.textContent = label;
        }
      });

      async function persistWorkItemOrder() {
        const ids = [...$('itemList').querySelectorAll('.item')].map(row => row.dataset.id);
        loadSequence++;
        showOperationStatus('Saving the work-list order…');
        try {
          await request('/api/dev-buddy/order', {
            method: 'PUT',
            body: JSON.stringify({ ids }),
          });
          await load();
          showOperationStatus('I saved the new work-list order.', 'done', 1400);
        } catch (_) {
          showOperationStatus('I couldn’t save that work-list order.', 'error', 3500);
          await load();
        }
      }

      function clearItemDrag() {
        draggedId = '';
        suppressItemOpenUntil = Date.now() + 350;
        for (const item of $('itemList').querySelectorAll('.dragging, .drag-target')) {
          item.classList.remove('dragging', 'drag-target');
        }
      }

      $('itemList').addEventListener('pointerdown', event => {
        const handle = event.target.closest('.drag-handle');
        const row = handle?.closest('.item');
        if (!handle || !row || event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        draggedId = row.dataset.id;
        suppressItemOpenUntil = Date.now() + 10000;
        dragPointer = {
          id: event.pointerId,
          handle,
          row,
          startX: event.clientX,
          startY: event.clientY,
          moved: false,
        };
        try { handle.setPointerCapture(event.pointerId); } catch (_) {}
      });

      $('itemList').addEventListener('pointermove', event => {
        const drag = dragPointer;
        if (!drag || drag.id !== event.pointerId) return;
        if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5) return;
        drag.moved = true;
        drag.row.classList.add('dragging');
        const listBounds = $('itemList').getBoundingClientRect();
        if (event.clientY < listBounds.top + 36) $('itemList').scrollTop -= 14;
        else if (event.clientY > listBounds.bottom - 36) $('itemList').scrollTop += 14;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.item');
        if (!target || target === drag.row || target.parentNode !== $('itemList')) return;
        for (const item of $('itemList').querySelectorAll('.drag-target')) {
          item.classList.remove('drag-target');
        }
        target.classList.add('drag-target');
        const after = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
        target.parentNode.insertBefore(drag.row, after ? target.nextSibling : target);
      });

      $('itemList').addEventListener('pointerup', async event => {
        const drag = dragPointer;
        if (!drag || drag.id !== event.pointerId) return;
        dragPointer = null;
        try { drag.handle.releasePointerCapture(event.pointerId); } catch (_) {}
        const moved = drag.moved;
        clearItemDrag();
        if (moved) await persistWorkItemOrder();
      });

      $('itemList').addEventListener('pointercancel', () => {
        if (!dragPointer) return;
        dragPointer = null;
        clearItemDrag();
        render();
      });

      $('itemList').addEventListener('keydown', async event => {
        const handle = event.target.closest('.drag-handle');
        if (!handle || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
        const row = handle.closest('.item');
        const sibling = event.key === 'ArrowUp'
          ? row.previousElementSibling
          : row.nextElementSibling;
        if (!sibling?.classList.contains('item')) return;
        event.preventDefault();
        if (event.key === 'ArrowUp') row.parentNode.insertBefore(row, sibling);
        else row.parentNode.insertBefore(sibling, row);
        handle.focus();
        await persistWorkItemOrder();
      });

      $('mapWrap').addEventListener('click', event => {
        if (mapMoved) return;
        const id = event.target.closest('[data-item-id]')?.dataset.itemId;
        const item = (status?.list || []).find(entry => entry.id === id);
        if (item) openItem(item);
      });
      $('mapWrap').addEventListener('wheel', event => {
        event.preventDefault();
        zoomMap(event.deltaY < 0 ? 1.12 : .89, event.clientX, event.clientY);
      }, { passive: false });
      $('mapWrap').addEventListener('pointerdown', event => {
        if (event.button !== 0 || event.target.closest('.map-controls')) return;
        $('mapWrap').setPointerCapture(event.pointerId);
        if (event.pointerType === 'touch') {
          mapPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (mapPointers.size === 2) {
            const [first, second] = [...mapPointers.values()];
            mapPinch = {
              distance: Math.hypot(second.x - first.x, second.y - first.y),
              midpoint: { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 },
              transform: { ...mapTransform },
            };
            mapPointer = null;
          } else {
            mapPointer = {
              id: event.pointerId,
              x: event.clientX,
              y: event.clientY,
              originX: mapTransform.x,
              originY: mapTransform.y,
            };
          }
        } else {
          mapPointer = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            originX: mapTransform.x,
            originY: mapTransform.y,
          };
        }
        mapMoved = false;
        $('mapWrap').classList.add('dragging');
      });
      $('mapWrap').addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' && mapPointers.has(event.pointerId)) {
          mapPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (mapPinch && mapPointers.size >= 2) {
            const [first, second] = [...mapPointers.values()];
            const distance = Math.max(1, Math.hypot(second.x - first.x, second.y - first.y));
            const midpoint = { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 };
            const rect = $('mapWrap').getBoundingClientRect();
            const anchorX = mapPinch.midpoint.x - rect.left;
            const anchorY = mapPinch.midpoint.y - rect.top;
            const nextScale = Math.max(.35, Math.min(2.5,
              mapPinch.transform.scale * distance / Math.max(1, mapPinch.distance)
            ));
            mapTransform.scale = nextScale;
            mapTransform.x = midpoint.x - rect.left -
              (anchorX - mapPinch.transform.x) * (nextScale / mapPinch.transform.scale);
            mapTransform.y = midpoint.y - rect.top -
              (anchorY - mapPinch.transform.y) * (nextScale / mapPinch.transform.scale);
            mapMoved = true;
            applyMapTransform();
            return;
          }
        }
        if (!mapPointer || mapPointer.id !== event.pointerId) return;
        const dx = event.clientX - mapPointer.x;
        const dy = event.clientY - mapPointer.y;
        if (Math.abs(dx) + Math.abs(dy) > 5) mapMoved = true;
        mapTransform.x = mapPointer.originX + dx;
        mapTransform.y = mapPointer.originY + dy;
        applyMapTransform();
      });
      const endMapPointer = event => {
        mapPointers.delete(event.pointerId);
        if (mapPointers.size < 2) mapPinch = null;
        if (mapPointer && mapPointer.id === event.pointerId) mapPointer = null;
        $('mapWrap').classList.remove('dragging');
        setTimeout(() => { mapMoved = false; }, 0);
      };
      $('mapWrap').addEventListener('pointerup', endMapPointer);
      $('mapWrap').addEventListener('pointercancel', endMapPointer);
      $('mapWrap').addEventListener('click', event => {
        const action = event.target.closest('[data-map-action]')?.dataset.mapAction;
        if (action === 'zoom-in') zoomMap(1.2);
        else if (action === 'zoom-out') zoomMap(.8);
        else if (action === 'fit') fitMap();
      });
      $('mapGrouping').addEventListener('change', event => loadMapGrouping(event.target.value));

      $('memoryComposer').addEventListener('submit', async event => {
        event.preventDefault();
        const text = $('newMemory').value.trim();
        if (!text) return;
        await request('/api/dev-buddy/memories', {
          method: 'POST',
          body: JSON.stringify({ text }),
        });
        $('newMemory').value = '';
        await load();
      });

      $('memoryList').addEventListener('click', async event => {
        const action = event.target.closest('[data-memory-action]')?.dataset.memoryAction;
        const row = event.target.closest('[data-memory-id]');
        if (!action || !row) return;
        const url = '/api/dev-buddy/memories/' + encodeURIComponent(row.dataset.memoryId);
        if (action === 'forget') await request(url, { method: 'DELETE' });
        else {
          const text = row.querySelector('input').value.trim();
          if (!text) return;
          await request(url, { method: 'PUT', body: JSON.stringify({ text }) });
        }
        await load();
      });

      const events = new EventSource('/api/events');
      events.addEventListener('dev-buddy-changed', () => load());
      ['agent-status', 'agent-completed', 'boards-changed'].forEach(name => {
        events.addEventListener(name, () => setTimeout(() => load(), 1200));
      });

      load(true).then(() => {
        const item = status?.suggestedReminder || {
          title: `${status?.settings?.name || 'Pixel'} is keeping watch`,
          detail: 'I’ll quietly track open work and only pop up when something deserves your attention.',
          priority: 'normal',
          fingerprint: 'welcome',
        };
        setTimeout(() => showBubble(item, true), 1800);
      });
      setInterval(() => load(), 60000);
    })();
  </script>
</body>
</html>
