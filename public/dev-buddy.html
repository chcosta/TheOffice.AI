        const date = new Intl.DateTimeFormat(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
        }).format(new Date(timestamp));
        const age = item?.trackedFor || formatRelative(value);
        const ageLabel = age === 'just now' ? age : (String(age).endsWith('ago') ? age : `${age} old`);
        return `Tracked ${date} · ${ageLabel}`;
      }

      function localDateTimeValue(value) {
        const date = new Date(value);
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function minimumReminderAt() {
        return localDateTimeValue(Date.now() + 60 * 1000);
      }

      function defaultReminderAt() {
        const date = new Date(Date.now() + 60 * 60 * 1000);
        date.setMinutes(0, 0, 0);
        if (date.getTime() < Date.now() + 60 * 60 * 1000) date.setHours(date.getHours() + 1);
        return localDateTimeValue(date);
      }

      function renderMap(relationships) {
        const nodes = relationships?.nodes || [];
        const edges = relationships?.edges || [];
        if (!nodes.length) {
          $('mapCanvas').innerHTML = '<text x="24" y="42" class="map-empty">Relationships will appear as Pixel learns about your work.</text>';
          return;
        }
        const center = nodes.find(node => node.id === 'pixel');
        const groups = nodes.filter(node => node.kind === 'repository' || node.kind === 'source');
        const positions = new Map();
        const byGroup = new Map();
        for (const edge of edges) {
          if (edge.from === 'pixel') continue;
          if (!byGroup.has(edge.from)) byGroup.set(edge.from, []);
          byGroup.get(edge.from).push(edge.to);
        }
        let cursorY = 34;
        for (const group of groups) {
          const children = byGroup.get(group.id) || [];
          const firstY = cursorY;
          children.forEach((id, index) => {
            positions.set(id, { x: 570, y: cursorY + index * 62, w: 360, h: 46 });
          });
          const height = Math.max(46, children.length * 62 - 16);
          positions.set(group.id, { x: 285, y: firstY + (height - 46) / 2, w: 220, h: 46 });
          cursorY += height + 34;
        }
        const contentHeight = Math.max(560, cursorY + 20);
        if (center) positions.set(center.id, { x: 34, y: contentHeight / 2 - 23, w: 150, h: 46 });
        mapExtent = { width: 970, height: contentHeight };
        const lines = edges.map(edge => {
          const from = positions.get(edge.from);
          const to = positions.get(edge.to);
          return from && to ? `<line class="map-edge" x1="${from.x + from.w}" y1="${from.y + from.h / 2}" x2="${to.x}" y2="${to.y + to.h / 2}"></line>` : '';
        }).join('');
        const boxes = nodes.map(node => {
          const pos = positions.get(node.id);
          if (!pos) return '';
          const maxLength = node.itemId ? 49 : 29;
          const label = String(node.label || '').length > maxLength ? String(node.label).slice(0, maxLength - 1) + '…' : node.label;
          return `<g class="map-node" data-kind="${escapeHtml(node.kind)}" ${node.itemId ? `data-item-id="${escapeHtml(node.itemId)}"` : ''}>
            <title>${escapeHtml(node.label)}</title>
            <rect x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}"></rect>
            <text x="${pos.x + 11}" y="${pos.y + 28}">${escapeHtml(label)}</text>
          </g>`;
        }).join('');
        $('mapSvg').setAttribute('viewBox', `0 0 ${Math.max(600, $('mapWrap').clientWidth)} ${Math.max(400, $('mapWrap').clientHeight)}`);
        $('mapCanvas').innerHTML = lines + boxes;
        applyMapTransform();
      }

      function applyMapTransform() {
        $('mapCanvas').setAttribute('transform', `translate(${mapTransform.x} ${mapTransform.y}) scale(${mapTransform.scale})`);
      }

      function fitMap() {
        const width = Math.max(320, $('mapWrap').clientWidth);
        const height = Math.max(280, $('mapWrap').clientHeight);
        mapTransform.scale = Math.max(.35, Math.min(1.25, (width - 48) / mapExtent.width, (height - 48) / mapExtent.height));
        mapTransform.x = Math.max(24, (width - mapExtent.width * mapTransform.scale) / 2);
        mapTransform.y = Math.max(24, (height - mapExtent.height * mapTransform.scale) / 2);
        applyMapTransform();
      }

      function zoomMap(factor, clientX, clientY) {
        const rect = $('mapWrap').getBoundingClientRect();
        const pointX = (clientX ?? rect.left + rect.width / 2) - rect.left;
        const pointY = (clientY ?? rect.top + rect.height / 2) - rect.top;
        const previous = mapTransform.scale;
        const next = Math.max(.35, Math.min(2.5, previous * factor));
        mapTransform.x = pointX - (pointX - mapTransform.x) * (next / previous);
        mapTransform.y = pointY - (pointY - mapTransform.y) * (next / previous);
        mapTransform.scale = next;
        applyMapTransform();
      }

      function renderMemories(memories) {
        $('memoryList').innerHTML = memories.length ? memories.map(memory => `
          <div class="memory-row" data-memory-id="${escapeHtml(memory.id)}">
            <input value="${escapeHtml(memory.text)}" maxlength="400" aria-label="Learned memory">
            <button class="text-action" type="button" data-memory-action="save">Save</button>
            <button class="text-action" type="button" data-memory-action="forget">Forget</button>
          </div>`).join('') : '<div class="empty">Pixel has no learned preferences yet.</div>';
      }

      function saveChat() {
        try { localStorage.setItem('dev-buddy-chat', JSON.stringify(chatHistory.slice(-12))); } catch {}
      }

      function renderChat() {
        const entries = chatHistory.slice(-8);
        $('pixelChat').innerHTML = entries.length ? entries.map((entry, index) => `
          <div class="chat-message ${entry.pending ? 'chat-thinking' : ''}" data-role="${escapeHtml(entry.role)}">
            <span class="chat-role">${entry.role === 'user' ? 'You' : 'Pixel'}</span>
            ${escapeHtml(entry.content)}
            ${entry.action && ['open', 'confirm-work-item'].includes(entry.action.type) ? `<button class="chat-action" type="button" data-chat-action="${index}">${escapeHtml(entry.action.label || 'Continue')}</button>` : ''}
          </div>`).join('') : '<div class="chat-empty">Ask me to find and open a PR or build, help prioritize, draft an email, create a work item, or remember something for you.</div>';
        $('pixelChat').scrollTop = $('pixelChat').scrollHeight;
        $('chatSend').disabled = chatBusy;
        $('chatSend').textContent = chatBusy ? 'Thinking…' : 'Ask';
      }

      async function loadMapGrouping(mode) {
        mapMode = ['context', 'urgency', 'source', 'ai-workstream', 'ai-effort'].includes(mode) ? mode : 'context';
        localStorage.setItem('dev-buddy-map-mode', mapMode);
        $('mapGrouping').value = mapMode;
        if (mapMode === 'context') {
          mapRelationships = null;
          renderMap(status?.relationships);
          setTimeout(fitMap, 30);
          return;
        }
        if (mapGroupingBusy) return;
        mapGroupingBusy = true;
        $('mapGrouping').disabled = true;
        $('mapCanvas').innerHTML = `<text x="24" y="42" class="map-empty">${mapMode.startsWith('ai-') ? 'Pixel is organizing this work…' : 'Reorganizing map…'}</text>`;
        try {
          const result = await request('/api/dev-buddy/map-groupings', {
            method: 'POST',
            body: JSON.stringify({ mode: mapMode }),
          });
          mapRelationships = result.relationships;
          mapRelationshipSignature = (status?.list || []).map(item => `${item.id}:${item.urgency?.level || ''}`).join('|');
          renderMap(mapRelationships);
          setTimeout(fitMap, 30);
        } catch (error) {
          $('mapCanvas').innerHTML = `<text x="24" y="42" class="map-empty">${escapeHtml(error.message || 'Pixel could not organize the map.')}</text>`;
        } finally {
          mapGroupingBusy = false;
          $('mapGrouping').disabled = false;
        }
      }

      async function setView(view, resize = true) {
        currentView = ['work', 'map', 'memory'].includes(view) ? view : 'work';
        localStorage.setItem('dev-buddy-view', currentView);
        $('workView').hidden = currentView !== 'work';
        $('mapView').hidden = currentView !== 'map';
        $('memoryView').hidden = currentView !== 'memory';
        for (const button of document.querySelectorAll('[data-view-target]')) {
          button.classList.toggle('active', button.dataset.viewTarget === currentView);
        }
        if (resize && panelOpen) {
          await setMode('workspace');
          if (currentView === 'map') {
            if (mapMode !== 'context' && !mapRelationships) loadMapGrouping(mapMode);
            else setTimeout(fitMap, 80);
          }
        }
      }

      async function load(refresh = false) {
        const sequence = ++loadSequence;
        try {
          let nextStatus = await request('/api/dev-buddy/status' + (refresh ? '?refresh=1' : ''));
          if (sequence !== loadSequence) return;
          const returnedIds = new Set((nextStatus.list || []).map(item => item.id));
          for (const id of pendingHiddenIds) {
            if (!returnedIds.has(id)) pendingHiddenIds.delete(id);
          }
          const hidePending = entries => (entries || []).filter(item => !pendingHiddenIds.has(item.id));
          const returnedItems = [
            ...(nextStatus.list || []),
            ...(nextStatus.signals || []),
            ...(nextStatus.items || []),
          ];
          for (const [id, starred] of pendingStarStates) {
            const returned = returnedItems.find(item => item.id === id);
            if (returned && returned.starred === starred) pendingStarStates.delete(id);
          }
          const preservePendingStars = entries => (entries || []).map(item =>
            pendingStarStates.has(item.id)
              ? { ...item, starred: pendingStarStates.get(item.id) }
              : item);
          nextStatus = {
            ...nextStatus,
            list: preservePendingStars(hidePending(nextStatus.list)),
            signals: preservePendingStars(hidePending(nextStatus.signals)),
            items: preservePendingStars(hidePending(nextStatus.items)),
          };
          status = nextStatus;
          for (const item of (status.items || [])) {
            if (item.snoozedUntil) scheduleSnoozeWake(item.snoozedUntil);
          }
          const shouldHide = status.settings &&
            (status.settings.enabled === false || (startupLaunch && status.settings.launchAtStartup === false));
          startupLaunch = false;
          if (shouldHide) {
            const fn = invoke();
            if (fn) await fn('hide_dev_buddy');
            return;
          }
          const nextIds = new Set((status.list || []).map(item => item.id));
          const added = knownItemIds
            ? (status.list || []).filter(item => !knownItemIds.has(item.id))
            : [];
          knownItemIds = nextIds;
          render();
          if (panelOpen && currentView === 'map' && mapMode !== 'context' && !mapRelationships) {
            loadMapGrouping(mapMode);
          }
          if (added.length) flashNewWork(added[0]);
          scheduleReminder();
        } catch (error) {
          if (sequence !== loadSequence) return;
          $('panelSub').textContent = 'Reconnecting to TheOffice.AI…';
        }
      }

      function hideBubble() {
        clearTimeout(bubbleTimer);
        $('buddy').classList.remove('commenting');
        $('bubble').classList.remove('show');
        if (!panelOpen && !peekOpen) {
          setTimeout(() => {
            if (!panelOpen && !peekOpen) setMode('idle');
          }, 350);
        }
      }

      async function showBubble(item, force = false) {
        if (!item || panelOpen || peekOpen || (!force && !status?.settings?.remindersEnabled)) return;
        lastFingerprint = item.fingerprint || item.id || '';
        $('bubble').dataset.kind = item.kind || 'memory';
        $('bubbleKicker').textContent = item.priority === 'high' ? 'Needs your attention' : 'Quick heads-up';
        $('bubbleTitle').textContent = item.title || 'A small reminder';
        $('bubbleDetail').textContent = item.semanticComment || item.attentionBlurb || item.detail || '';
        $('buddy').classList.add('commenting');
        await new Promise(resolve => setTimeout(resolve, 500));
        if (panelOpen) {
          $('buddy').classList.remove('commenting');
          return;
        }
        await setMode('bubble');
        $('bubble').classList.add('show');
        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(hideBubble, 9000);
      }

      function scheduleReminder() {
        clearTimeout(reminderTimer);
        if (!status?.settings?.remindersEnabled) return;
        const minutes = Math.max(5, Number(status.settings.reminderIntervalMinutes) || 30);
        reminderTimer = setTimeout(() => {
          showBubble(status?.suggestedReminder);
          scheduleReminder();
        }, minutes * 60 * 1000);
      }

      function scheduleSnoozeWake(value) {
        const wakeAt = Date.parse(value || '');
        if (!Number.isFinite(wakeAt) || wakeAt <= Date.now()) return;
        if (snoozeWakeAt && snoozeWakeAt <= wakeAt) return;
        clearTimeout(snoozeWakeTimer);
        snoozeWakeAt = wakeAt;
        snoozeWakeTimer = setTimeout(() => {
          snoozeWakeAt = 0;
          load();
        }, Math.min(2147483647, wakeAt - Date.now() + 250));
      }

      async function openPanel(focusComposer = false) {
        clearTimeout(closeTimer);
        panelOpen = true;
        peekOpen = false;
        $('hoverPreview').classList.remove('show');
        hideBubble();
        await setMode('workspace');
        $('panel').classList.add('open');
        $('stage').classList.add('panel-open');
        if (currentView === 'map') setTimeout(fitMap, 80);
        if (focusComposer) setTimeout(() => $('newItem').focus(), 80);
      }

      async function closePanel() {
        clearTimeout(closeTimer);
        panelOpen = false;
        $('panel').classList.remove('open');
        $('stage').classList.remove('panel-open');
        await setMode('idle');
      }

      async function showPeek() {
        if (panelOpen || manipulatingWindow || buddyGesture) return;
        clearTimeout(peekTimer);
        hideBubble();
        peekOpen = true;
        renderPreview(status?.list || []);
        await setMode('peek');
        if (peekOpen && !panelOpen) $('hoverPreview').classList.add('show');
      }

      function schedulePeek() {
        if (panelOpen || manipulatingWindow) return;
        clearTimeout(closeTimer);
        clearTimeout(peekTimer);
        peekTimer = setTimeout(showPeek, 260);
      }

      async function hidePeek() {
        clearTimeout(peekTimer);
        if (!peekOpen) return;
        peekOpen = false;
        $('hoverPreview').classList.remove('show');
        if (!panelOpen) await setMode('idle');
      }

      async function beginWindowAction(command) {
        const fn = invoke();
        if (!fn) return;
        clearTimeout(closeTimer);
        manipulatingWindow = true;
        try {
          await fn(command, {
            buddyLeft: windowPlacement.buddyLeft,
            buddyTop: windowPlacement.buddyTop,
          });
        } catch (_) {}
        setTimeout(() => { manipulatingWindow = false; }, 500);
      }

      function flashNewWork(item) {
        clearTimeout(newWorkTimer);
        $('buddy').classList.add('new-work');
        newWorkTimer = setTimeout(() => $('buddy').classList.remove('new-work'), 30000);
        showBubble({
          ...item,
          detail: item.detail || 'A new item was added to your work list.',
        }, true);
      }

      function celebrate(title) {
        $('reward').textContent = title ? `Nice work — ${title} is done.` : 'Nice work — one less loose end.';
        $('stage').classList.remove('celebrating');
        void $('stage').offsetWidth;
        $('stage').classList.add('celebrating');
        setTimeout(() => $('stage').classList.remove('celebrating'), 3000);
      }

      function openItemMessages(item) {
        const type = `${item?.kind || ''} ${item?.source || ''}`.toLowerCase();
        if (type.includes('email')) {
          return {
            opening: 'Opening the source email in Outlook…',
            done: 'I sent the email to Outlook.',
            error: 'I couldn’t open that email.',
          };
        }
        if (type.includes('teams')) {
          return {
            opening: 'Opening the source message in Teams…',
            done: 'I sent the message to Teams.',
            error: 'I couldn’t open that Teams message.',
          };
        }
        if (item?.kind === 'pull-request' || /\b(?:pull request|pr)\b/.test(type)) {
          return {
            opening: 'Opening the pull request…',
            done: 'I opened the pull request.',
            error: 'I couldn’t open that pull request.',
          };
        }
        if (item?.route) {
          return {
            opening: 'Opening this in TheOffice.AI…',
            done: 'I opened it in TheOffice.AI.',
            error: 'I couldn’t open that view.',
          };
        }
        return {
          opening: 'Opening the source…',
          done: 'I opened the source.',
          error: 'I couldn’t open that source.',
        };
      }

      function showOperationStatus(message, state = 'working', duration = 0) {
        clearTimeout(operationStatusTimer);
        const element = $('operationStatus');
        element.textContent = message;
        element.dataset.state = state;
        element.hidden = false;
        $('buddy').classList.toggle('working', state === 'working');
        if (duration > 0) {
          operationStatusTimer = setTimeout(() => {
            element.hidden = true;
            $('buddy').classList.remove('working');
          }, duration);
        }
      }

      async function openItem(item) {
        const operation = ++operationSequence;
        const messages = openItemMessages(item);
        const startedAt = Date.now();
        showOperationStatus(messages.opening);
        try {
          if (item.link) {
            await request('/api/open-external', { method: 'POST', body: JSON.stringify({ url: item.link }) });
          } else {
            const fn = invoke();
            if (!fn || !item.route) throw new Error('No navigation target is available.');
            await fn('open_main_window', { target: item.route });
          }
          const remaining = 400 - (Date.now() - startedAt);
          if (remaining > 0) await new Promise(resolve => setTimeout(resolve, remaining));
          if (operation === operationSequence) showOperationStatus(messages.done, 'done', 1800);
        } catch (_) {
          if (operation === operationSequence) showOperationStatus(messages.error, 'error', 3500);
        }
      }

      function togglePanel() {
        if (panelOpen) {
          closePanel();
        } else {
          openPanel();
        }
      }
      function finishBuddyDrag() {
        clearTimeout(buddyDragSafety);
        $('buddy').classList.remove('dragging');
        setTimeout(() => { manipulatingWindow = false; }, 180);
      }
      $('buddy').addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        const fn = invoke();
        if (!fn) return;
        event.preventDefault();
        clearTimeout(peekTimer);
        clearTimeout(closeTimer);
        buddyGesture = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          dragging: false,
        };
        try { $('buddy').setPointerCapture(event.pointerId); } catch (_) {}
      });
      $('buddy').addEventListener('pointermove', event => {
        const gesture = buddyGesture;
        if (!gesture || gesture.id !== event.pointerId || gesture.dragging) return;
        if (Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) < 6) return;
        gesture.dragging = true;
        manipulatingWindow = true;
        $('buddy').classList.add('dragging');
        clearTimeout(buddyDragSafety);
        buddyDragSafety = setTimeout(finishBuddyDrag, 10000);
        const fn = invoke();
        if (!fn) return finishBuddyDrag();
        fn('start_dev_buddy_drag', {
            buddyLeft: windowPlacement.buddyLeft,
            buddyTop: windowPlacement.buddyTop,
          })
          .catch(finishBuddyDrag);
      });
      $('buddy').addEventListener('pointerup', event => {
        const gesture = buddyGesture;
        if (!gesture || gesture.id !== event.pointerId) return;
        buddyGesture = null;
        try { $('buddy').releasePointerCapture(event.pointerId); } catch (_) {}
        if (gesture.dragging) {
          setTimeout(finishBuddyDrag, 180);
        } else {
          togglePanel();
        }
      });
      $('buddy').addEventListener('pointercancel', event => {
        if (!buddyGesture || buddyGesture.id !== event.pointerId) return;
        const wasDragging = buddyGesture.dragging;
        buddyGesture = null;
        if (wasDragging) setTimeout(finishBuddyDrag, 1500);
      });
      $('buddy').addEventListener('click', event => {
        if (invoke()) {
          event.preventDefault();
          return;
        }
        togglePanel();
      });
      $('buddy').addEventListener('mouseenter', schedulePeek);
      $('buddy').addEventListener('focus', schedulePeek);
      $('stage').addEventListener('mouseenter', () => clearTimeout(closeTimer));
      $('stage').addEventListener('mouseleave', () => {
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => {
          if (peekOpen && !manipulatingWindow && !controlFocused &&
              Date.now() >= controlInteractionUntil) hidePeek();
        }, 450);
      });
      $('panel').addEventListener('focusin', event => {
        if (!event.target.closest('button, input, select')) return;
        controlFocused = true;
        controlInteractionUntil = Number.POSITIVE_INFINITY;
        clearTimeout(closeTimer);
      });
      $('panel').addEventListener('focusout', () => {
        setTimeout(() => {
          controlFocused = !!$('panel').contains(document.activeElement) &&
            !!document.activeElement.closest?.('button, input, select');
          if (!controlFocused) controlInteractionUntil = Date.now() + 1200;
        }, 0);
      });
      $('closePanel').addEventListener('click', () => {
        closePanel();
      });
      for (const button of document.querySelectorAll('[data-view-target]')) {
        button.addEventListener('click', () => setView(button.dataset.viewTarget));
      }
      $('panel').querySelector('.panel-head').addEventListener('pointerdown', event => {
        if (event.button !== 0 || event.target.closest('button, input, select')) return;
        event.preventDefault();
        beginWindowAction('start_dev_buddy_drag');
      });
      $('bubble').addEventListener('click', event => {
        if (!event.target.closest('#dismissBubble')) openPanel();
      });
      $('dismissBubble').addEventListener('click', async event => {
        event.stopPropagation();
        if (lastFingerprint) {
          const until = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
          try {
            await request('/api/dev-buddy/signals/dismiss', {
              method: 'POST',
              body: JSON.stringify({ fingerprint: lastFingerprint, until }),
            });
          } catch (_) {}
        }
        hideBubble();
      });

      $('composer').addEventListener('submit', async event => {
        event.preventDefault();
        const input = $('newItem');
        const message = input.value.trim();
        if (!message || chatBusy) return;
        const conversation = chatHistory.filter(entry => !entry.pending).map(entry => ({
          role: entry.role,
          content: entry.content,
        }));
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: 'Thinking with you…', pending: true });
        input.value = '';
        chatBusy = true;
        renderChat();
        try {
          const result = await request('/api/dev-buddy/chat', {
            method: 'POST',
            body: JSON.stringify({ message, history: conversation }),
          });
          chatHistory.pop();
          chatHistory.push({ role: 'assistant', content: result.reply || 'I’m not sure how to help with that yet.', action: result.action || null });
          saveChat();
          await load();
        } catch (error) {
          chatHistory.pop();
          chatHistory.push({ role: 'assistant', content: error.message || 'I could not complete that request.' });
          saveChat();
        } finally {
          chatBusy = false;
          renderChat();
          input.focus();
        }
      });

      $('pixelChat').addEventListener('click', async event => {
        const button = event.target.closest('[data-chat-action]');
        if (!button) return;
        const entry = chatHistory.slice(-8)[Number(button.dataset.chatAction)];
        const action = entry && entry.action;
        if (!action) return;
        button.disabled = true;
        try {
          if (action.type === 'open' && action.item) {
            await openItem(action.item);
          } else if (action.type === 'confirm-work-item') {
            const result = await request('/api/dev-buddy/actions/work-item', {
              method: 'POST',
              body: JSON.stringify({ title: action.title, description: action.description }),
            });
            const workItem = result.workItem || {};
            entry.action = workItem.url ? {
              type: 'open',
              label: `Open work item #${workItem.id || ''}`,
              item: { title: action.title, link: workItem.url },
            } : null;
            chatHistory.push({
              role: 'assistant',
              content: `Created ${workItem.id ? `work item #${workItem.id}` : 'the work item'}: ${action.title}`,
              action: entry.action,
            });
            saveChat();
            renderChat();
          }
        } catch (error) {
          chatHistory.push({ role: 'assistant', content: error.message || 'That action could not be completed.' });
          saveChat();
          renderChat();
        } finally {
          button.disabled = false;
        }
      });

      function findListItem(row) {
        return findItemById(row?.dataset.id);
      }

      function findItemById(id) {
        return (status?.list || [...(status?.signals || []), ...(status?.items || [])])
          .find(entry => entry.id === id);
      }

      function refreshProgressIndicators(progressOverride) {
        const progress = progressOverride || status?.progress || {};
        const total = Math.max(
          0,
          Number(progress.totalTrackedToday) ||
          Number(progress.open || 0) + Number(progress.addressedToday || 0)
        );
        const maximum = Math.max(1, total);
        const setBar = (id, value) => {
          $(id).style.height = value > 0 ? `${Math.max(5, Math.round(value / maximum * 100))}%` : '0';
        };
        setBar('openBar', progress.open || 0);
        setBar('deferredBar', progress.deferredToday || 0);
        setBar('addressedBar', progress.addressedToday || 0);
        const summary = `${progress.open || 0} open / ${total} tracked today · ${progress.addressedToday || 0} addressed · ${progress.deferredToday || 0} deferred or reprioritized`;
        $('workBars').title = summary;
        $('dailyProgress').innerHTML = `<strong>${escapeHtml(progress.open || 0)} open / ${escapeHtml(total)} tracked today</strong> · ${escapeHtml(progress.addressedToday || 0)} addressed · ${escapeHtml(progress.deferredToday || 0)} deferred or reprioritized`;
      }

      function removeListItemLocally(row, item, actionType = 'completed') {
        const previousStatus = status;
        loadSequence++;
        pendingHiddenIds.add(item.id);
        row?.remove();
        const remove = entries => (entries || []).filter(entry => entry.id !== item.id);
        const list = remove(status?.list);
        const progress = status?.progress || {};
        const counts = status?.counts || {};
        const alreadyCounted = (status?.recentActivity || []).some(entry =>
          entry.id === item.id && (entry.actions || []).includes(actionType));
        const addressedIncrement = ['completed', 'dismissed'].includes(actionType) && !alreadyCounted ? 1 : 0;
        const deferredIncrement = actionType === 'deferred' && !alreadyCounted ? 1 : 0;
        status = {
          ...status,
          list,
          signals: remove(status?.signals),
          items: remove(status?.items),
          counts: {
            ...counts,
            attention: Math.max(0, Number(counts.attention || 0) - (item.urgency?.score >= 2 ? 1 : 0)),
            tracking: Math.max(0, Number(counts.tracking || 0) - (['agent-run', 'build', 'session'].includes(item.kind) ? 1 : 0)),
            remembered: Math.max(0, Number(counts.remembered || 0) - (!item.fingerprint || item.completable ? 1 : 0)),
          },
          progress: {
            ...progress,
            open: Math.max(0, Number(progress.open || list.length + 1) - 1),
            addressedToday: Number(progress.addressedToday || 0) + addressedIncrement,
            deferredToday: Number(progress.deferredToday || 0) + deferredIncrement,
            completedToday: Number(progress.completedToday || 0) + addressedIncrement,
          },
        };
        $('bodyCount').textContent = list.length > 99 ? '99+' : String(list.length);
        refreshBuddyUrgency(list);
        refreshProgressIndicators();
        if (selectedItemId === item.id) selectedItemId = '';
        renderWorkItems(list);
        return () => {
          loadSequence++;
          pendingHiddenIds.delete(item.id);
          status = previousStatus;
          render();
        };
      }

      function lowerPriorityLocally(row, item, priority) {
        const previousStatus = status;
        const update = entries => (entries || []).map(entry =>
          entry.id === item.id ? { ...entry, priority } : entry);
        const progress = status?.progress || {};
        const alreadyCounted = (status?.recentActivity || []).some(entry =>
          entry.id === item.id && (entry.actions || []).includes('reprioritized'));
        status = {
          ...status,
          list: update(status?.list),
          signals: update(status?.signals),
          items: update(status?.items),
          progress: {
            ...progress,
            deferredToday: Number(progress.deferredToday || 0) + (alreadyCounted ? 0 : 1),
          },
        };
        refreshBuddyUrgency(status.list);
        refreshProgressIndicators();
        renderWorkItems(status.list);
        return () => {
          status = previousStatus;
          render();
        };
      }

      function toggleStarLocally(item, starred) {
        const previousStatus = status;
        loadSequence++;
        pendingStarStates.set(item.id, starred);
        const update = entries => (entries || []).map(entry =>
          entry.id === item.id ? { ...entry, starred } : entry);
        status = {
          ...status,
          list: update(status?.list),
          signals: update(status?.signals),
          items: update(status?.items),
        };
        renderWorkItems(status.list);
        return () => {
          if (pendingStarStates.get(item.id) === starred) pendingStarStates.delete(item.id);
          loadSequence++;
          status = previousStatus;
          renderWorkItems(status?.list || []);
        };
      }

      async function updateListItem(item, body, reload = true) {
        if (item.completable) {
          await request('/api/dev-buddy/commitments/' + encodeURIComponent(item.id), {
            method: 'PUT',
            body: JSON.stringify(body),
          });
        } else if (item.fingerprint) {
          const signalKey = Object.prototype.hasOwnProperty.call(body, 'starred') || body.snoozedUntil
            ? (item.reminderKey || item.fingerprint)
            : item.fingerprint;
          await request('/api/dev-buddy/signals/' + encodeURIComponent(signalKey), {
            method: 'PUT',
            body: JSON.stringify({ ...body, title: item.title, source: item.source }),
          });
        } else {
          await request('/api/dev-buddy/items/' + encodeURIComponent(item.id), {
            method: 'PUT',
            body: JSON.stringify(body),
          });
        }
        if (body.snoozedUntil) scheduleSnoozeWake(body.snoozedUntil);
        if (reload) await load();
      }

      async function loadItemInsight(item) {
        if (!item) return;
        const token = ++detailInsightSequence;
        const signature = detailInsightSignature(item);
        detailInsights.set(item.id, { state: 'loading', token, signature });
        renderWorkDetail(sortedWorkItems(status?.list || []));
        try {
          const result = await request('/api/dev-buddy/insight', {
            method: 'POST',
            body: JSON.stringify({ id: item.id }),
          });
          if (detailInsights.get(item.id)?.token !== token) return;
          detailInsights.set(item.id, { state: 'ready', insight: result.insight || {}, signature });
        } catch (error) {
          if (detailInsights.get(item.id)?.token !== token) return;
          detailInsights.set(item.id, {
            state: 'error',
            error: error.message || 'Pixel could not complete the deeper analysis.',
            signature,
          });
        }
        if (selectedItemId === item.id) renderWorkDetail(sortedWorkItems(status?.list || []));
      }

      async function remindIn(select, item, row) {
        if (!select?.value || !item) return;
        const minutes = Number(select.value);
        if (!Number.isFinite(minutes) || minutes <= 0) return;
        select.disabled = true;
        const snoozedUntil = new Date(Date.now() + minutes * 60 * 1000).toISOString();
        const restore = removeListItemLocally(row, item, 'deferred');
        try {
          await updateListItem(item, { snoozedUntil }, false);
          void load();
        } catch (error) {
          restore();
        } finally {
          select.disabled = false;
        }
      }

      async function handleWorkAction(action, item, row, scope) {
        if (!action || !item) return;
        if (action === 'ai-plan') return loadItemInsight(item);
        if (action === 'open') return openItem(item);
        if (action === 'star') {
          const starred = item.starred !== true;
          const restore = toggleStarLocally(item, starred);
          try {
            await updateListItem(item, { starred }, false);
            void load();
          } catch (error) {
            restore();
          }
          return;
        }
        if (action === 'remind-at') {
          const input = scope.querySelector('[data-reminder-at]');
          const reminderAt = new Date(input.value).getTime();
          if (!Number.isFinite(reminderAt) || reminderAt <= Date.now()) {
            input.setCustomValidity('Choose a future reminder time.');
            input.reportValidity();
            return;
          }
          input.setCustomValidity('');
          const restore = removeListItemLocally(row, item, 'deferred');
          try {
            await updateListItem(item, { snoozedUntil: new Date(reminderAt).toISOString() }, false);
            void load();
          } catch (error) {
            restore();
          }
          return;
        }
        const priorities = ['low', 'normal', 'high'];
        const currentPriority = Math.max(0, priorities.indexOf(item.priority || 'normal'));
        const body = action === 'done'
          ? { status: 'done' }
          : { priority: priorities[Math.max(0, currentPriority - 1)] };
        if (action === 'done') {
          const restore = removeListItemLocally(row, item, 'completed');
          celebrate(item.title);
          try {
            await updateListItem(item, body, false);
            void load();
          } catch (error) {
            restore();
            throw error;
          }
          return;
        }
        const nextPriority = body.priority;
        const restore = lowerPriorityLocally(row, item, nextPriority);
        try {
          await updateListItem(item, body, false);
          void load();
        } catch (error) {
          restore();
        }
      }

      function changeWorkSort(value) {
        workSort = ['urgency', 'arrival', 'manual'].includes(value)
          ? value
          : 'urgency';
        localStorage.setItem('dev-buddy-work-sort', workSort);
        renderWorkItems(status?.list || []);
      }

      $('workSort').addEventListener('change', event => changeWorkSort(event.target.value));
      $('previewSort').addEventListener('change', event => changeWorkSort(event.target.value));

      $('itemList').addEventListener('click', async event => {
        const row = event.target.closest('.item');
        if (!row) return;
        const item = findListItem(row);
        if (!item) return;
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (action) return handleWorkAction(action, item, row, row);
        if (event.target.closest('.drag-handle') || Date.now() < suppressItemOpenUntil) return;
        selectedItemId = item.id;
        localStorage.setItem('dev-buddy-selected-item', selectedItemId);
        renderWorkItems(status?.list || []);
      });
      $('itemList').addEventListener('keydown', event => {
        if (!['Enter', ' '].includes(event.key) || event.target !== event.target.closest('.item')) return;
        const row = event.target.closest('.item');
        const item = row && findListItem(row);
        if (!item) return;
        event.preventDefault();
        selectedItemId = item.id;
        localStorage.setItem('dev-buddy-selected-item', selectedItemId);
        renderWorkItems(status?.list || []);
      });

      $('itemDetail').addEventListener('change', event => {
        const select = event.target.closest('[data-reminder-in]');
        const item = findItemById(event.target.closest('[data-detail-id]')?.dataset.detailId);
        if (select) remindIn(select, item, $('itemList').querySelector(`[data-id="${CSS.escape(item?.id || '')}"]`));
      });
      $('itemDetail').addEventListener('click', event => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        const scope = event.target.closest('[data-detail-id]');
        const item = findItemById(scope?.dataset.detailId);
        if (action && item) {
          const row = $('itemList').querySelector(`[data-id="${CSS.escape(item.id)}"]`);
          handleWorkAction(action, item, row, scope);
        }
      });

      $('previewList').addEventListener('click', async event => {
        const row = event.target.closest('[data-preview-id]');
        const action = event.target.closest('[data-preview-action]')?.dataset.previewAction;
        const item = findItemById(row?.dataset.previewId);
        if (!item || !action) return;
        if (action === 'read') {
          selectedItemId = item.id;
          localStorage.setItem('dev-buddy-selected-item', selectedItemId);
          currentView = 'work';
          await openPanel();
          renderWorkItems(status?.list || []);
          return;
        }
        if (action === 'done' || action === 'star') {
          const listRow = $('itemList').querySelector(`[data-id="${CSS.escape(item.id)}"]`);
          await handleWorkAction(action, item, listRow, row);
        }
      });

      $('recentList').addEventListener('click', async event => {
        const button = event.target.closest('[data-recent-action]');
        if (!button) return;
        const label = button.textContent;
        button.disabled = true;
        button.textContent = 'Restoring…';
        try {
          loadSequence++;
          pendingHiddenIds.delete(button.dataset.recentId);
          await request('/api/dev-buddy/activity/' + encodeURIComponent(button.dataset.recentId) + '/restore', {
            method: 'POST',
            body: JSON.stringify({ action: button.dataset.recentAction }),
          });
          await load();
        } catch (error) {
          button.disabled = false;
          button.textContent = label;
        }
      });

      async function persistWorkItemOrder() {
        const ids = [...$('itemList').querySelectorAll('.item')].map(row => row.dataset.id);
        loadSequence++;
        showOperationStatus('Saving the work-list order…');
        try {
          await request('/api/dev-buddy/order', {
            method: 'PUT',
            body: JSON.stringify({ ids }),
          });
          await load();
          showOperationStatus('I saved the new work-list order.', 'done', 1400);
        } catch (_) {
          showOperationStatus('I couldn’t save that work-list order.', 'error', 3500);
          await load();
        }
      }

      function clearItemDrag() {
        draggedId = '';
        suppressItemOpenUntil = Date.now() + 350;
        for (const item of $('itemList').querySelectorAll('.dragging, .drag-target')) {
          item.classList.remove('dragging', 'drag-target');
        }
      }

      $('itemList').addEventListener('pointerdown', event => {
        const handle = event.target.closest('.drag-handle');
        const row = handle?.closest('.item');
        if (!handle || !row || event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        draggedId = row.dataset.id;
        suppressItemOpenUntil = Date.now() + 10000;
        dragPointer = {
          id: event.pointerId,
          handle,
          row,
          startX: event.clientX,
          startY: event.clientY,
          moved: false,
        };
        try { handle.setPointerCapture(event.pointerId); } catch (_) {}
      });

      $('itemList').addEventListener('pointermove', event => {
        const drag = dragPointer;
        if (!drag || drag.id !== event.pointerId) return;
        if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5) return;
        drag.moved = true;
        drag.row.classList.add('dragging');
        const listBounds = $('itemList').getBoundingClientRect();
        if (event.clientY < listBounds.top + 36) $('itemList').scrollTop -= 14;
        else if (event.clientY > listBounds.bottom - 36) $('itemList').scrollTop += 14;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.item');
        if (!target || target === drag.row || target.parentNode !== $('itemList')) return;
        for (const item of $('itemList').querySelectorAll('.drag-target')) {
          item.classList.remove('drag-target');
        }
        target.classList.add('drag-target');
        const after = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
        target.parentNode.insertBefore(drag.row, after ? target.nextSibling : target);
      });

      $('itemList').addEventListener('pointerup', async event => {
        const drag = dragPointer;
        if (!drag || drag.id !== event.pointerId) return;
        dragPointer = null;
        try { drag.handle.releasePointerCapture(event.pointerId); } catch (_) {}
        const moved = drag.moved;
        clearItemDrag();
        if (moved) await persistWorkItemOrder();
      });

      $('itemList').addEventListener('pointercancel', () => {
        if (!dragPointer) return;
        dragPointer = null;
        clearItemDrag();
        render();
      });

      $('itemList').addEventListener('keydown', async event => {
        const handle = event.target.closest('.drag-handle');
        if (!handle || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
        const row = handle.closest('.item');
        const sibling = event.key === 'ArrowUp'
          ? row.previousElementSibling
          : row.nextElementSibling;
        if (!sibling?.classList.contains('item')) return;
        event.preventDefault();
        if (event.key === 'ArrowUp') row.parentNode.insertBefore(row, sibling);
        else row.parentNode.insertBefore(sibling, row);
        handle.focus();
        await persistWorkItemOrder();
      });

      $('mapWrap').addEventListener('click', event => {
        if (mapMoved) return;
        const id = event.target.closest('[data-item-id]')?.dataset.itemId;
        const item = (status?.list || []).find(entry => entry.id === id);
        if (item) openItem(item);
      });
      $('mapWrap').addEventListener('wheel', event => {
        event.preventDefault();
        zoomMap(event.deltaY < 0 ? 1.12 : .89, event.clientX, event.clientY);
      }, { passive: false });
      $('mapWrap').addEventListener('pointerdown', event => {
        if (event.button !== 0 || event.target.closest('.map-controls')) return;
        $('mapWrap').setPointerCapture(event.pointerId);
        if (event.pointerType === 'touch') {
          mapPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (mapPointers.size === 2) {
            const [first, second] = [...mapPointers.values()];
            mapPinch = {
              distance: Math.hypot(second.x - first.x, second.y - first.y),
              midpoint: { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 },
              transform: { ...mapTransform },
            };
            mapPointer = null;
          } else {
            mapPointer = {
              id: event.pointerId,
              x: event.clientX,
              y: event.clientY,
              originX: mapTransform.x,
              originY: mapTransform.y,
            };
          }
        } else {
          mapPointer = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            originX: mapTransform.x,
            originY: mapTransform.y,
          };
        }
        mapMoved = false;
        $('mapWrap').classList.add('dragging');
      });
      $('mapWrap').addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' && mapPointers.has(event.pointerId)) {
          mapPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (mapPinch && mapPointers.size >= 2) {
            const [first, second] = [...mapPointers.values()];
            const distance = Math.max(1, Math.hypot(second.x - first.x, second.y - first.y));
            const midpoint = { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 };
            const rect = $('mapWrap').getBoundingClientRect();
            const anchorX = mapPinch.midpoint.x - rect.left;
            const anchorY = mapPinch.midpoint.y - rect.top;
            const nextScale = Math.max(.35, Math.min(2.5,
              mapPinch.transform.scale * distance / Math.max(1, mapPinch.distance)
            ));
            mapTransform.scale = nextScale;
            mapTransform.x = midpoint.x - rect.left -
              (anchorX - mapPinch.transform.x) * (nextScale / mapPinch.transform.scale);
            mapTransform.y = midpoint.y - rect.top -
              (anchorY - mapPinch.transform.y) * (nextScale / mapPinch.transform.scale);
            mapMoved = true;
            applyMapTransform();
            return;
          }
        }
        if (!mapPointer || mapPointer.id !== event.pointerId) return;
        const dx = event.clientX - mapPointer.x;
        const dy = event.clientY - mapPointer.y;
        if (Math.abs(dx) + Math.abs(dy) > 5) mapMoved = true;
        mapTransform.x = mapPointer.originX + dx;
        mapTransform.y = mapPointer.originY + dy;
        applyMapTransform();
      });
      const endMapPointer = event => {
        mapPointers.delete(event.pointerId);
        if (mapPointers.size < 2) mapPinch = null;
        if (mapPointer && mapPointer.id === event.pointerId) mapPointer = null;
        $('mapWrap').classList.remove('dragging');
        setTimeout(() => { mapMoved = false; }, 0);
      };
      $('mapWrap').addEventListener('pointerup', endMapPointer);
      $('mapWrap').addEventListener('pointercancel', endMapPointer);
      $('mapWrap').addEventListener('click', event => {
        const action = event.target.closest('[data-map-action]')?.dataset.mapAction;
        if (action === 'zoom-in') zoomMap(1.2);
        else if (action === 'zoom-out') zoomMap(.8);
        else if (action === 'fit') fitMap();
      });
      $('mapGrouping').addEventListener('change', event => loadMapGrouping(event.target.value));

      $('memoryComposer').addEventListener('submit', async event => {
        event.preventDefault();
        const text = $('newMemory').value.trim();
        if (!text) return;
        await request('/api/dev-buddy/memories', {
          method: 'POST',
          body: JSON.stringify({ text }),
        });
        $('newMemory').value = '';
        await load();
      });

      $('memoryList').addEventListener('click', async event => {
        const action = event.target.closest('[data-memory-action]')?.dataset.memoryAction;
        const row = event.target.closest('[data-memory-id]');
        if (!action || !row) return;
        const url = '/api/dev-buddy/memories/' + encodeURIComponent(row.dataset.memoryId);
        if (action === 'forget') await request(url, { method: 'DELETE' });
        else {
          const text = row.querySelector('input').value.trim();
          if (!text) return;
          await request(url, { method: 'PUT', body: JSON.stringify({ text }) });
        }
        await load();
      });

      const events = new EventSource('/api/events');
      events.addEventListener('dev-buddy-changed', () => load());
      ['agent-status', 'agent-completed', 'boards-changed'].forEach(name => {
        events.addEventListener(name, () => setTimeout(() => load(), 1200));
      });

      load(true).then(() => {
        const item = status?.suggestedReminder || {
          title: `${status?.settings?.name || 'Pixel'} is keeping watch`,
          detail: 'I’ll quietly track open work and only pop up when something deserves your attention.',
          priority: 'normal',
          fingerprint: 'welcome',
        };
        setTimeout(() => showBubble(item, true), 1800);
      });
      setInterval(() => load(), 60000);
    })();
  </script>
</body>
</html>
