<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Buddy</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
      --cp-notification: #ffffff;
      --cp-clear: transparent;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
      --cp-notification: #ffffff;
      --cp-clear: transparent;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--cp-clear);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .stage {
      --buddy-left: 14px;
      --buddy-top: 8px;
      position: relative;
      width: 100%;
      height: 100%;
    }
    .buddy {
      position: absolute;
      left: var(--buddy-left);
      top: var(--buddy-top);
      width: 132px;
      height: 152px;
      border: 0;
      padding: 0;
      background: var(--cp-clear);
      cursor: pointer;
      filter: drop-shadow(0 10px 14px var(--cp-border-strong));
      animation: buddy-float 3.2s ease-in-out infinite;
      z-index: 4;
    }
    .buddy:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 2px; border-radius: 16px; }
    .antenna {
      position: absolute;
      width: 4px;
      height: 28px;
      left: 64px;
      top: 7px;
      background: var(--cp-border-strong);
      transform: rotate(-8deg);
      transform-origin: bottom;
      border-radius: 4px;
    }
    .antenna::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: -4px;
      top: -7px;
      border-radius: 50%;
      background: var(--cp-accent);
      box-shadow: 0 0 0 5px var(--cp-accent-soft);
    }
    .head {
      position: absolute;
      left: 23px;
      top: 31px;
      width: 88px;
      height: 76px;
      border: 3px solid var(--cp-border-strong);
      border-radius: 28px 28px 24px 24px;
      background: var(--cp-panel-strong);
      box-shadow: inset 0 10px 0 var(--cp-sheen);
    }
    .screen {
      position: absolute;
      inset: 14px 12px 15px;
      border: 2px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface-soft);
    }
    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 15px;
      height: 2px;
      border-radius: 2px;
      background: var(--cp-text);
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
    }
    .screen::before { left: 12px; }
    .screen::after { right: 12px; }
    .eye {
      position: absolute;
      top: 18px;
      width: 8px;
      height: 13px;
      border-radius: 50%;
      background: var(--cp-text);
      animation: blink 5.5s infinite;
    }
    .eye.left { left: 17px; }
    .eye.right { right: 17px; }
    .buddy[data-mood="focused"] .eye { height: 9px; top: 20px; }
    .buddy[data-mood="happy"] {
      animation: buddy-happy 1.5s ease-in-out infinite;
    }
    .buddy[data-mood="happy"] .antenna::before { background: var(--cp-success); }
    .buddy[data-mood="concerned"] .screen::before,
    .buddy[data-mood="concerned"] .screen::after,
    .buddy[data-mood="overloaded"] .screen::before,
    .buddy[data-mood="overloaded"] .screen::after { opacity: 1; }
    .buddy[data-mood="concerned"] .screen::before,
    .buddy[data-mood="overloaded"] .screen::before { transform: rotate(14deg); }
    .buddy[data-mood="concerned"] .screen::after,
    .buddy[data-mood="overloaded"] .screen::after { transform: rotate(-14deg); }
    .buddy[data-mood="overloaded"] {
      animation: buddy-hustle 1.2s ease-in-out infinite;
    }
    .buddy[data-mood="overloaded"] .eye { height: 15px; top: 16px; }
    .buddy[data-mood="overloaded"] .attention-dot { background: var(--cp-danger); }
    .body {
      --tummy-urgency: var(--cp-accent);
      position: absolute;
      left: 35px;
      top: 101px;
      width: 66px;
      height: 42px;
      border: 3px solid var(--cp-border-strong);
      border-radius: 16px 16px 20px 20px;
      background: var(--cp-bg-elevated);
    }
    .buddy[data-work-urgency="critical"] .body { --tummy-urgency: var(--cp-danger); }
    .buddy[data-work-urgency="high"] .body { --tummy-urgency: var(--cp-warning); }
    .buddy[data-work-urgency="medium"] .body { --tummy-urgency: var(--cp-link); }
    .buddy[data-work-urgency="low"] .body { --tummy-urgency: var(--cp-success); }
    .body-count {
      position: absolute;
      left: 19px;
      top: 8px;
      width: 22px;
      min-height: 18px;
      padding: 1px 2px;
      border-radius: 5px;
      background: var(--tummy-urgency);
      color: var(--cp-accent-fg);
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
      transition: background-color .25s ease;
    }
    .work-bars {
      position: absolute;
      left: 112px;
      top: 45px;
      width: 18px;
      height: 96px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      pointer-events: none;
    }
    .work-bar {
      display: block;
      width: 4px;
      min-height: 0;
      border-radius: 3px 3px 1px 1px;
      transition: height .35s ease;
    }
    .work-bar.open { background: var(--cp-danger); }
    .work-bar.deferred { background: var(--cp-warning); }
    .work-bar.addressed { background: var(--cp-success); }
    .buddy[data-progress="good"] .antenna::before { background: var(--cp-success); }
    .buddy[data-progress="mixed"] .antenna::before { background: var(--cp-warning); }
    .buddy[data-progress="behind"] .antenna::before { background: var(--cp-danger); }
    .stage.celebrating .antenna::before {
      animation: antenna-alert .55s ease-in-out 4;
    }
    .buddy.critical-work .antenna::before {
      background: var(--cp-danger);
      animation: antenna-critical .9s ease-in-out infinite;
    }
    .buddy.dragging {
      cursor: grabbing;
      animation: buddy-drag .48s ease-in-out infinite;
      filter: drop-shadow(0 16px 18px var(--cp-border-strong));
    }
    .arm {
      position: absolute;
      top: 108px;
      width: 31px;
      height: 10px;
      border: 3px solid var(--cp-border-strong);
      border-radius: 8px;
      background: var(--cp-bg-elevated);
    }
    .arm.left { left: 12px; transform: rotate(-22deg); }
    .arm.right { right: 10px; transform: rotate(24deg); }
    .buddy.dragging .arm.left { transform: rotate(-38deg) translateY(-2px); }
    .buddy.dragging .arm.right { transform: rotate(40deg) translateY(-2px); }
    .attention-dot {
      position: absolute;
      left: 8px;
      top: 25px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid var(--cp-surface);
      background: var(--cp-warning);
      display: none;
    }
    .attention-dot.on { display: block; animation: pulse 1.8s ease-in-out infinite; }
    .buddy.new-work .attention-dot {
      display: block;
      background: var(--cp-link);
      filter: drop-shadow(0 0 7px var(--cp-link));
      animation: antenna-new-item 1.2s ease-in-out infinite;
    }
    .buddy.commenting .attention-dot {
      display: block;
      border-color: var(--cp-border-strong);
      background: var(--cp-notification);
      filter: drop-shadow(0 0 8px var(--cp-notification));
      animation: antenna-comment .62s ease-in-out infinite;
    }
    .bubble {
      --category-color: var(--cp-border-strong);
      position: absolute;
      left: calc(var(--buddy-left) + 112px);
      top: calc(var(--buddy-top) + 48px);
      width: 245px;
      padding: 14px 16px;
      border: 1px solid var(--cp-border);
      border-left: 4px solid var(--category-color);
      border-radius: 16px;
      background: var(--cp-panel-strong);
      box-shadow: var(--cp-shadow);
      opacity: 0;
      transform: translateY(8px) scale(.98);
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
      z-index: 6;
    }
    .stage[data-anchor-x="right"] .bubble {
      right: calc(100% - var(--buddy-left) - 34px);
      left: auto;
    }
    .stage[data-anchor-y="bottom"] .bubble {
      top: auto;
      bottom: calc(100% - var(--buddy-top) - 152px);
    }
    .bubble[data-kind="pull-request"] { --category-color: var(--cp-link); }
    .bubble[data-kind="agent-run"] { --category-color: var(--cp-success); }
    .bubble[data-kind="agenda"] { --category-color: var(--cp-warning); }
    .bubble[data-kind="memory"] { --category-color: var(--cp-accent); }
    .bubble::after {
      content: "";
      position: absolute;
      right: -9px;
      bottom: 28px;
      width: 16px;
      height: 16px;
      border-right: 1px solid var(--cp-border);
      border-top: 1px solid var(--cp-border);
      background: var(--cp-panel-strong);
      transform: rotate(45deg);
    }
    .bubble.show { opacity: 1; transform: none; pointer-events: auto; }
    .bubble-kicker { color: var(--category-color); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .bubble-title { margin-top: 4px; font-size: 14px; font-weight: 650; line-height: 1.3; }
    .bubble-detail { margin-top: 4px; color: var(--cp-text-muted); font-size: 12px; line-height: 1.4; }
    .bubble-dismiss {
      position: absolute;
      right: 6px;
      top: 5px;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      background: var(--cp-clear);
      color: var(--cp-text-muted);
      cursor: pointer;
    }
    .panel {
      position: absolute;
      right: 12px;
      left: 12px;
      top: 12px;
      bottom: 16px;
      display: none;
      flex-direction: column;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-panel-strong);
      box-shadow: var(--cp-shadow);
      overflow: hidden;
      opacity: 1;
      z-index: 8;
    }
    .panel.open { display: flex; animation: panel-in .18s ease-out; }
    .stage.panel-open .buddy { display: none; }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--cp-border);
      cursor: move;
    }
    .panel-title { font-weight: 700; }
    .panel-sub { color: var(--cp-text-muted); font-size: 12px; }
    .operation-status {
      margin: 0 18px 10px;
      padding: 8px 10px;
      border-left: 3px solid var(--cp-link);
      background: var(--cp-surface-soft);
      color: var(--cp-text);
      font-size: 12px;
      line-height: 1.35;
    }
    .operation-status[hidden] { display: none; }
    .operation-status[data-state="done"] { border-left-color: var(--cp-success); }
    .operation-status[data-state="error"] { border-left-color: var(--cp-danger); }
    .buddy.working .attention-dot {
      display: block;
      background: var(--cp-link);
      filter: drop-shadow(0 0 7px var(--cp-link));
      animation: antenna-new-item 1.2s ease-in-out infinite;
    }
    .view-nav {
      display: flex;
      gap: 18px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--cp-border);
      background: var(--cp-surface);
    }
    .view-link {
      padding: 0 0 7px;
      border: 0;
      border-bottom: 2px solid var(--cp-clear);
      background: var(--cp-clear);
      color: var(--cp-text-muted);
      cursor: pointer;
      font-size: 11px;
    }
    .view-link.active {
      border-bottom-color: var(--cp-accent);
      color: var(--cp-text);
      font-weight: 700;
    }
    .view-count { margin-left: 3px; color: var(--cp-text-muted); font-weight: 400; }
    .panel-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel-view[hidden] { display: none; }
    .panel-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .panel-pin,
    .panel-size,
    .panel-close {
      width: 30px;
      height: 30px;
      border: 1px solid var(--cp-border);
      border-radius: 8px;
      background: var(--cp-surface);
      cursor: pointer;
    }
    .panel-pin,
    .panel-size {
      width: auto;
      padding: 0 8px;
      color: var(--cp-link);
      font-size: 11px;
    }
    select.panel-size {
      outline: 0;
      background: var(--cp-surface);
    }
    .work-toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
    }
    .work-toolbar .daily-progress {
      flex: 1;
      margin: 0;
    }
    .sort-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--cp-text-muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .sort-control select {
      min-height: 30px;
      padding: 3px 26px 3px 8px;
      border: 1px solid var(--cp-border);
      border-radius: 6px;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
    }
    .work-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 34%) minmax(0, 1fr);
    }
    .work-navigation {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--cp-border);
      background: var(--cp-surface);
    }
    .work-detail {
      min-width: 0;
      overflow-y: auto;
      padding: 22px 26px;
      background: var(--cp-bg-elevated);
    }
    .detail-kicker {
      color: var(--cp-text-muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .detail-title {
      margin: 5px 0 7px;
      font-size: 22px;
      font-weight: 650;
      line-height: 1.25;
      user-select: text;
    }
    .detail-meta {
      color: var(--cp-text-muted);
      font-size: 12px;
    }
    .detail-summary {
      max-width: 850px;
      margin-top: 22px;
      color: var(--cp-text);
      font-size: 14px;
      line-height: 1.55;
      user-select: text;
    }
    .detail-description {
      max-width: 850px;
      margin-top: 10px;
      color: var(--cp-text-muted);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      user-select: text;
    }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin-top: 24px;
    }
    .detail-primary {
      min-height: 32px;
      padding: 5px 12px;
      border: 1px solid var(--cp-accent);
      border-radius: 7px;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--cp-border);
      border-bottom: 1px solid var(--cp-border);
    }
    .metric { padding: 10px 12px; background: var(--cp-surface); }
    .metric strong { display: block; font-size: 18px; }
    .metric span { color: var(--cp-text-muted); font-size: 11px; }
    .daily-progress {
      margin: 0 18px 10px;
      color: var(--cp-text-muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .daily-progress strong { color: var(--cp-text); }
    .legend {
      display: flex;
      gap: 14px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
      color: var(--cp-text-muted);
      font-size: 10px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .legend-item::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--category-color);
    }
    .legend-pr { --category-color: var(--cp-link); }
    .legend-agent { --category-color: var(--cp-success); }
    .legend-agenda { --category-color: var(--cp-warning); }
    .legend-memory { --category-color: var(--cp-accent); }
    .list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0;
    }
    .empty { padding: 22px 4px; color: var(--cp-text-muted); font-size: 13px; text-align: center; }
    .item {
      --category-color: var(--cp-border-strong);
      position: relative;
      margin: 0;
      padding: 9px 9px 9px 12px;
      border-bottom: 1px solid var(--cp-border);
      border-left: 3px solid var(--cp-clear);
    }
    .item { cursor: pointer; }
    .item:hover,
    .item:focus-visible,
    .item.selected {
      background: var(--cp-accent-soft);
      outline: none;
    }
    .item.selected { border-left-color: var(--category-color); }
    .item.starred {
      background: var(--cp-highlight);
      border-left-color: var(--cp-warning);
    }
    .item.dragging { opacity: .38; }
    .item.drag-target { border-top: 2px solid var(--cp-accent); }
    .item[data-kind="pull-request"] { --category-color: var(--cp-link); }
    .item[data-kind="agent-run"] { --category-color: var(--cp-success); }
    .item[data-kind="build"] { --category-color: var(--cp-success); }
    .item[data-kind="session"] { --category-color: var(--cp-text-soft); }
    .item[data-kind="agenda"] { --category-color: var(--cp-warning); }
    .item[data-kind="email"] { --category-color: var(--cp-accent); }
    .item[data-kind="teams"] { --category-color: var(--cp-link); }
    .item[data-kind="meeting"],
    .item[data-kind="calendar"] { --category-color: var(--cp-warning); }
    .item[data-kind="memory"] { --category-color: var(--cp-accent); }
    .item:last-child { border-bottom: 0; }
    .item-top { display: flex; gap: 7px; align-items: center; }
    .drag-handle {
      flex: none;
      width: 14px;
      border: 0;
      padding: 0;
      margin-top: 1px;
      background: var(--cp-clear);
      color: var(--cp-text-muted);
      cursor: grab;
      font-size: 13px;
      line-height: 18px;
      text-align: center;
      touch-action: none;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .item-copy { min-width: 0; flex: 1; }
    .item-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-meta {
      display: flex;
      gap: 5px;
      margin-top: 3px;
      color: var(--cp-text-muted);
      font-size: 11px;
    }
    .urgency { font-weight: 700; }
    .urgency[data-level="critical"] { color: var(--cp-danger); }
    .urgency[data-level="high"] { color: var(--cp-warning); }
    .urgency[data-level="medium"] { color: var(--cp-link); }
    .urgency[data-level="low"] { color: var(--cp-text-muted); }
    .item-quick-actions {
      display: flex;
      flex: none;
      align-items: center;
      gap: 4px;
    }
    .quick-action {
      min-width: 27px;
      height: 27px;
      padding: 0 6px;
      border: 1px solid var(--cp-border);
      border-radius: 6px;
      background: var(--cp-surface);
      color: var(--cp-link);
      cursor: pointer;
      font-size: 11px;
    }
    .quick-done {
      color: var(--cp-success);
      font-size: 15px;
      font-weight: 700;
    }
    .quick-star {
      color: var(--cp-text-muted);
      font-size: 16px;
    }
    .quick-star[aria-pressed="true"] {
      border-color: var(--cp-warning);
      color: var(--cp-warning);
    }
    .reminder-controls {
      display: flex;
      flex-basis: 100%;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    .reminder-control {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--cp-text-muted);
      font-size: 11px;
    }
    .reminder-control select,
    .reminder-control input {
      min-height: 26px;
      padding: 2px 5px;
      border: 1px solid var(--cp-border);
      border-radius: 6px;
      outline: 0;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
    }
    .reminder-control select:focus,
    .reminder-control input:focus { border-color: var(--cp-accent); }
    .text-action {
      padding: 0;
      border: 0;
      border-bottom: 1px solid var(--cp-clear);
      background: var(--cp-clear);
      color: var(--cp-link);
      font-size: 11px;
      cursor: pointer;
    }
    .text-action:hover { border-bottom-color: var(--cp-link); }
    .recent-activity {
      border-top: 1px solid var(--cp-border);
      border-bottom: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
    }
    .recent-activity summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 9px 14px;
      color: var(--cp-text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      list-style: none;
    }
    .recent-activity summary::-webkit-details-marker { display: none; }
    .recent-summary-meta {
      margin-left: auto;
      color: var(--cp-text-muted);
      font-size: 11px;
      font-weight: 400;
    }
    .recent-list {
      max-height: 190px;
      overflow-y: auto;
      padding: 0 14px 7px;
    }
    .recent-row {
      padding: 8px 0;
      border-top: 1px solid var(--cp-border);
    }
    .recent-title { font-size: 12px; font-weight: 600; }
    .recent-meta {
      margin-top: 2px;
      color: var(--cp-text-muted);
      font-size: 11px;
      line-height: 1.35;
    }
    .recent-actions { display: flex; gap: 12px; margin-top: 5px; }
    .recent-state { color: var(--cp-text-muted); font-size: 11px; }
    .hover-preview {
      position: absolute;
      left: var(--buddy-left);
      top: calc(var(--buddy-top) + 154px);
      width: 370px;
      display: none;
      border: 1px solid var(--cp-border);
      border-radius: 12px;
      background: var(--cp-panel-strong);
      box-shadow: var(--cp-shadow);
      overflow: hidden;
      z-index: 9;
    }
    .stage[data-anchor-x="right"] .hover-preview {
      right: calc(100% - var(--buddy-left) - 132px);
      left: auto;
    }
    .stage[data-anchor-y="bottom"] .hover-preview {
      top: auto;
      bottom: calc(100% - var(--buddy-top) + 2px);
    }
    .hover-preview.show { display: block; animation: panel-in .16s ease-out; }
    .hover-preview-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--cp-border);
      font-size: 12px;
      font-weight: 650;
    }
    .hover-preview-head label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      color: var(--cp-text-muted);
      font-size: 10px;
      font-weight: 400;
    }
    .hover-preview-head select {
      max-width: 112px;
      min-height: 26px;
      padding: 2px 5px;
      border: 1px solid var(--cp-border);
      border-radius: 6px;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
    }
    .preview-list {
      max-height: calc(100vh - var(--buddy-top) - 208px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .preview-list::-webkit-scrollbar { display: none; }
    .stage[data-anchor-y="bottom"] .preview-list {
      max-height: calc(var(--buddy-top) - 60px);
    }
    .preview-item {
      --urgency-color: var(--cp-text-muted);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--cp-border);
      border-left: 4px solid var(--urgency-color);
    }
    .preview-item[data-urgency="critical"] { --urgency-color: var(--cp-danger); }
    .preview-item[data-urgency="high"] { --urgency-color: var(--cp-warning); }
    .preview-item[data-urgency="medium"] { --urgency-color: var(--cp-link); }
    .preview-item[data-urgency="low"] { --urgency-color: var(--cp-success); }
    .preview-item.starred { background: var(--cp-highlight); }
    .preview-item:last-child { border-bottom: 0; }
    .preview-read {
      min-width: 0;
      padding: 0;
      border: 0;
      background: var(--cp-clear);
      color: var(--cp-text);
      cursor: pointer;
      text-align: left;
    }
    .preview-title {
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-meta { margin-top: 2px; color: var(--urgency-color); font-size: 10px; font-weight: 600; }
    .source-status {
      padding: 7px 14px;
      border-bottom: 1px solid var(--cp-border);
      color: var(--cp-text-muted);
      font-size: 10px;
      line-height: 1.45;
    }
    .map-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      cursor: grab;
      touch-action: none;
    }
    .map-wrap.dragging { cursor: grabbing; }
    .map-wrap svg {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: block;
    }
    .map-canvas {
      transform-origin: 0 0;
      will-change: transform;
    }
    .map-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--cp-border);
      border-radius: 8px;
      background: var(--cp-panel-strong);
      box-shadow: 0 0 2px var(--cp-border);
      z-index: 2;
    }
    .map-grouping {
      height: 28px;
      max-width: 180px;
      border: 0;
      border-right: 1px solid var(--cp-border);
      outline: 0;
      background: var(--cp-clear);
      color: var(--cp-text);
      font-size: 11px;
    }
    .map-control {
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border: 0;
      border-right: 1px solid var(--cp-border);
      background: var(--cp-clear);
      cursor: pointer;
    }
    .map-control:last-child { border-right: 0; }
    .map-help {
      position: absolute;
      left: 12px;
      bottom: 10px;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--cp-panel-strong);
      color: var(--cp-text-muted);
      font-size: 10px;
      pointer-events: none;
    }
    .map-edge { stroke: var(--cp-border-strong); stroke-width: 1.5; opacity: .7; }
    .map-node rect {
      fill: var(--cp-surface);
      stroke: var(--cp-border-strong);
      stroke-width: 1.5;
      rx: 8px;
    }
    .map-node[data-kind="center"] rect { fill: var(--cp-accent-soft); stroke: var(--cp-accent); }
    .map-node[data-kind="repository"] rect { stroke: var(--cp-link); }
    .map-node[data-item-id] { cursor: pointer; }
    .map-node text {
      fill: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
    }
    .memory-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 14px;
    }
    .pixel-chat {
      max-height: 190px;
      overflow-y: auto;
      border-top: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
    }
    .chat-empty {
      padding: 8px 14px;
      color: var(--cp-text-muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .chat-message {
      padding: 8px 14px;
      border-bottom: 1px solid var(--cp-border);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      user-select: text;
    }
    .chat-message[data-role="user"] { color: var(--cp-text-muted); }
    .chat-message[data-role="assistant"] { color: var(--cp-text); }
    .chat-role {
      display: block;
      margin-bottom: 2px;
      color: var(--cp-accent);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .chat-action {
      margin-top: 7px;
      padding: 5px 8px;
      border: 1px solid var(--cp-link);
      border-radius: 7px;
      background: var(--cp-surface);
      color: var(--cp-link);
      cursor: pointer;
      font-size: 11px;
    }
    .chat-thinking { color: var(--cp-text-muted); font-style: italic; }
    .memory-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid var(--cp-border);
    }
    .memory-row input {
      min-width: 0;
      border: 0;
      border-bottom: 1px solid var(--cp-border);
      outline: 0;
      background: var(--cp-clear);
      color: var(--cp-text);
      font-size: 12px;
    }
    .memory-row input:focus { border-bottom-color: var(--cp-accent); }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
    }
    .composer input {
      min-width: 0;
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--cp-border);
      border-radius: 8px;
      outline: 0;
      background: var(--cp-surface);
      color: var(--cp-text);
    }
    .composer input:focus { border-color: var(--cp-accent); }
    .primary {
      padding: 8px 12px;
      border: 1px solid var(--cp-accent);
      border-radius: 8px;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      cursor: pointer;
    }
    .resize-handle {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 20px;
      height: 20px;
      display: none;
      border: 0;
      border-left: 2px solid var(--cp-border-strong);
      border-bottom: 2px solid var(--cp-border-strong);
      background: var(--cp-clear);
      cursor: sw-resize;
      z-index: 10;
    }
    .stage[data-anchor-x="left"] .resize-handle {
      right: 16px;
      left: auto;
      border-right: 2px solid var(--cp-border-strong);
      border-left: 0;
    }
    .stage[data-anchor-y="bottom"] .resize-handle {
      top: 16px;
      bottom: auto;
      border-top: 2px solid var(--cp-border-strong);
      border-bottom: 0;
    }
    .stage[data-anchor-x="left"][data-anchor-y="top"] .resize-handle { cursor: se-resize; }
    .stage[data-anchor-x="right"][data-anchor-y="top"] .resize-handle { cursor: sw-resize; }
    .stage[data-anchor-x="left"][data-anchor-y="bottom"] .resize-handle { cursor: ne-resize; }
    .stage[data-anchor-x="right"][data-anchor-y="bottom"] .resize-handle { cursor: nw-resize; }
    .reward {
      position: absolute;
      right: 22px;
      top: 112px;
      max-width: 260px;
      padding: 9px 12px;
      border: 1px solid var(--cp-success);
      border-radius: 10px;
      background: var(--cp-panel-strong);
      color: var(--cp-success);
      box-shadow: var(--cp-shadow);
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(8px) scale(.96);
      pointer-events: none;
      z-index: 12;
    }
    .stage.celebrating .reward { animation: reward-in 2.8s ease both; }
    @keyframes buddy-float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes buddy-hustle { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
    @keyframes buddy-happy { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
    @keyframes buddy-drag { 0%, 100% { transform: translateY(-4px) rotate(-3deg) scale(.97); } 50% { transform: translateY(-7px) rotate(3deg) scale(.97); } }
    @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
    @keyframes antenna-alert { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.55); } }
    @keyframes antenna-new-item {
      0%, 100% { opacity: .72; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.35); }
    }
    @keyframes antenna-comment {
      0%, 38%, 100% { opacity: 1; transform: scale(1.25); }
      52%, 86% { opacity: .12; transform: scale(.9); }
    }
    @keyframes antenna-critical {
      0%, 42%, 100% { opacity: 1; transform: scale(1); }
      52%, 88% { opacity: .18; transform: scale(.78); }
    }
    @keyframes reward-in {
      0% { opacity: 0; transform: translateY(8px) scale(.96); }
      14%, 78% { opacity: 1; transform: none; }
      100% { opacity: 0; transform: translateY(-7px) scale(.98); }
    }
    @keyframes panel-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <section class="panel" id="panel" aria-label="Dev Buddy">
      <header class="panel-head">
        <div>
          <div class="panel-title" id="panelTitle">Pixel</div>
          <div class="panel-sub" id="panelSub">Keeping the loose ends together</div>
        </div>
        <div class="panel-tools">
          <button class="panel-close" id="closePanel" type="button" aria-label="Close">×</button>
        </div>
      </header>
      <div class="operation-status" id="operationStatus" role="status" aria-live="polite" hidden></div>
      <nav class="view-nav" aria-label="Dev Buddy views">
        <button class="view-link active" type="button" data-view-target="work">Work</button>
        <button class="view-link" type="button" data-view-target="map">Map</button>
        <button class="view-link" type="button" data-view-target="memory">Memory</button>
      </nav>
      <section class="panel-view" id="workView">
        <div class="work-toolbar">
          <div class="daily-progress" id="dailyProgress"></div>
          <label class="sort-control">Sort
            <select id="workSort" aria-label="Sort work list">
              <option value="urgency">Urgency</option>
              <option value="arrival">Arrival time</option>
              <option value="manual">My order</option>
            </select>
          </label>
        </div>
        <div class="work-layout">
          <aside class="work-navigation" aria-label="Work list">
            <div class="source-status" id="sourceStatus"></div>
            <div class="list" id="itemList"></div>
            <details class="recent-activity" id="recentActivity">
              <summary>
                Recent activity
                <span class="recent-summary-meta">Past 24 hours · <span id="recentCount">0</span></span>
              </summary>
              <div class="recent-list" id="recentList"></div>
            </details>
          </aside>
          <section class="work-detail" id="itemDetail" aria-live="polite"></section>
        </div>
        <div class="pixel-chat" id="pixelChat" aria-live="polite"></div>
        <form class="composer" id="composer">
          <input id="newItem" maxlength="4000" placeholder="Ask Pixel to help…" aria-label="Message Pixel">
          <button class="primary" id="chatSend" type="submit">Ask</button>
        </form>
      </section>
      <section class="panel-view" id="mapView" hidden>
        <div class="map-wrap" id="mapWrap">
          <div class="map-controls" aria-label="Map controls">
            <select class="map-grouping" id="mapGrouping" aria-label="Map grouping">
              <option value="context">Work context</option>
              <option value="urgency">Urgency</option>
              <option value="source">Source</option>
              <option value="ai-workstream">AI workstreams</option>
              <option value="ai-effort">AI effort</option>
            </select>
            <button class="map-control" type="button" data-map-action="zoom-in" aria-label="Zoom in">+</button>
            <button class="map-control" type="button" data-map-action="zoom-out" aria-label="Zoom out">−</button>
            <button class="map-control" type="button" data-map-action="fit">Fit</button>
          </div>
          <div class="map-help">Drag to pan · wheel or pinch to zoom · select an item to open it</div>
          <svg id="mapSvg" role="img" aria-label="Relationships among tracked work"><g class="map-canvas" id="mapCanvas"></g></svg>
        </div>
      </section>
      <section class="panel-view" id="memoryView" hidden>
        <div class="source-status">These are durable preferences and context shared with Connect. Edit or forget anything that is no longer true.</div>
        <div class="memory-list" id="memoryList"></div>
        <form class="composer" id="memoryComposer">
          <input id="newMemory" maxlength="400" placeholder="Something Pixel should know…" aria-label="New learned memory">
          <button class="primary" type="submit">Remember</button>
        </form>
      </section>
    </section>
    <aside class="hover-preview" id="hoverPreview" aria-label="Top work items">
      <div class="hover-preview-head">Work
        <label>Sort
          <select id="previewSort" aria-label="Sort hover work list">
            <option value="urgency">Urgency</option>
            <option value="arrival">Arrival time</option>
            <option value="manual">My order</option>
          </select>
        </label>
      </div>
      <div class="preview-list" id="previewList"></div>
    </aside>

    <aside class="bubble" id="bubble" aria-live="polite" data-kind="memory">
      <button class="bubble-dismiss" id="dismissBubble" type="button" aria-label="Dismiss">×</button>
      <div class="bubble-kicker" id="bubbleKicker">Quick heads-up</div>
      <div class="bubble-title" id="bubbleTitle"></div>
      <div class="bubble-detail" id="bubbleDetail"></div>
    </aside>

    <button class="buddy" id="buddy" type="button" aria-label="Open Dev Buddy" data-mood="calm">
      <span class="antenna"></span>
      <span class="head">
        <span class="screen">
          <span class="eye left"></span>
          <span class="eye right"></span>
        </span>
      </span>
      <span class="arm left"></span>
      <span class="arm right"></span>
      <span class="body"><span class="body-count" id="bodyCount">0</span></span>
      <span class="work-bars" id="workBars" aria-hidden="true">
        <span class="work-bar open" id="openBar"></span>
        <span class="work-bar deferred" id="deferredBar"></span>
        <span class="work-bar addressed" id="addressedBar"></span>
      </span>
      <span class="attention-dot" id="attentionDot"></span>
    </button>
    <aside class="reward" id="reward" aria-live="polite">Nice work — one less loose end.</aside>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const invoke = () => window.__TAURI__ && (window.__TAURI__.core?.invoke || window.__TAURI__.invoke);
      let status = null;
      let panelOpen = false;
      let bubbleTimer = null;
      let reminderTimer = null;
      let newWorkTimer = null;
      let operationStatusTimer = null;
      let operationSequence = 0;
      let snoozeWakeTimer = null;
      let snoozeWakeAt = 0;
      let closeTimer = null;
      let peekTimer = null;
      let peekOpen = false;
      let lastFingerprint = '';
      let manipulatingWindow = false;
      let buddyGesture = null;
      let buddyDragSafety = null;
      let controlFocused = false;
      let controlInteractionUntil = 0;
      let draggedId = '';
      let dragPointer = null;
      let suppressItemOpenUntil = 0;
      let currentView = localStorage.getItem('dev-buddy-view') || 'work';
      let workSort = localStorage.getItem('dev-buddy-work-sort') || 'urgency';
      let selectedItemId = localStorage.getItem('dev-buddy-selected-item') || '';
      let startupLaunch = new URLSearchParams(location.search).get('startup') === '1';
      let knownItemIds = null;
      let loadSequence = 0;
      const pendingHiddenIds = new Set();
      const pendingStarStates = new Map();
      let mapTransform = { x: 24, y: 24, scale: 1 };
      let mapExtent = { width: 980, height: 600 };
      let mapPointer = null;
      let mapMoved = false;
      let mapPinch = null;
      const mapPointers = new Map();
      let mapMode = localStorage.getItem('dev-buddy-map-mode') || 'context';
      let mapRelationships = null;
      let mapRelationshipSignature = '';
      let mapGroupingBusy = false;
      let chatBusy = false;
      let windowPlacement = { anchorX: 'left', anchorY: 'top', buddyLeft: 14, buddyTop: 8 };
      let chatHistory = [];
      try {
        const saved = JSON.parse(localStorage.getItem('dev-buddy-chat') || '[]');
        chatHistory = Array.isArray(saved) ? saved.slice(-12) : [];
      } catch {}

      function applyWindowPlacement(placement) {
        if (!placement || typeof placement !== 'object') return;
        windowPlacement = {
          anchorX: placement.anchorX === 'right' ? 'right' : 'left',
          anchorY: placement.anchorY === 'bottom' ? 'bottom' : 'top',
          buddyLeft: Number.isFinite(Number(placement.buddyLeft)) ? Number(placement.buddyLeft) : 14,
          buddyTop: Number.isFinite(Number(placement.buddyTop)) ? Number(placement.buddyTop) : 8,
        };
        $('stage').dataset.anchorX = windowPlacement.anchorX;
        $('stage').dataset.anchorY = windowPlacement.anchorY;
        $('stage').style.setProperty('--buddy-left', `${windowPlacement.buddyLeft}px`);
        $('stage').style.setProperty('--buddy-top', `${windowPlacement.buddyTop}px`);
      }

      async function setMode(mode) {
        const fn = invoke();
        if (!fn) return;
        try {
          const plan = await fn('plan_dev_buddy_mode', {
            mode,
            buddyLeft: windowPlacement.buddyLeft,
            buddyTop: windowPlacement.buddyTop,
          });
          // Move Pixel to his final in-window anchor before the native window
          // changes bounds, so WebView never paints an intermediate location.
          applyWindowPlacement(plan);
          applyWindowPlacement(await fn('set_dev_buddy_mode', {
            mode,
            anchorX: plan.anchorPhysicalX,
            anchorY: plan.anchorPhysicalY,
          }));
        } catch (_) {
          try { applyWindowPlacement(await fn('set_dev_buddy_mode', { mode })); } catch (_) {}
        }
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
        return data;
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
      }

      function itemArrival(item) {
        const timestamp = Date.parse(item?.trackedAt || item?.observedAt || item?.createdAt ||
          item?.updatedAt || item?.dueAt || '');
        return Number.isFinite(timestamp) ? timestamp : 0;
      }

      function sortedWorkItems(items) {
        const sorted = [...(items || [])];
        if (workSort === 'manual') return sorted;
        if (workSort === 'arrival') {
          return sorted.sort((a, b) => itemArrival(b) - itemArrival(a) ||
            String(a.title || '').localeCompare(String(b.title || '')));
        }
        return sorted.sort((a, b) =>
          Number(b.urgency?.score || 0) - Number(a.urgency?.score || 0) ||
          itemArrival(b) - itemArrival(a) ||
          String(a.title || '').localeCompare(String(b.title || '')));
      }

      function formatArrivalTime(item) {
        const timestamp = itemArrival(item);
        if (!timestamp) return 'Unknown time';
        const date = new Date(timestamp);
        const today = new Date();
        const sameDay = date.getFullYear() === today.getFullYear() &&
          date.getMonth() === today.getMonth() && date.getDate() === today.getDate();
        return sameDay
          ? new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(date)
          : new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(date);
      }

      function renderWorkDetail(items) {
        const selected = items.find(item => item.id === selectedItemId) || items[0];
        if (!selected) {
          selectedItemId = '';
          $('itemDetail').innerHTML = '<div class="empty">Nothing needs you right now. Pixel will keep watching.</div>';
          return;
        }
        selectedItemId = selected.id;
        localStorage.setItem('dev-buddy-selected-item', selectedItemId);
        const openable = selected.link || selected.route;
        $('itemDetail').innerHTML = `
          <div class="detail-kicker">${escapeHtml(selected.source || 'Pixel')} · ${escapeHtml(selected.kind || 'work')}</div>
          <h2 class="detail-title">${escapeHtml(selected.title)}</h2>
          <div class="detail-meta">
            <span class="urgency" data-level="${escapeHtml(selected.urgency?.level || 'medium')}">${escapeHtml(selected.urgency?.label || 'Medium')} urgency · score ${escapeHtml(urgencyScore(selected))}</span>
            · ${escapeHtml(formatWorkItemDate(selected))}
          </div>
          <div class="detail-summary">${escapeHtml(selected.attentionBlurb || selected.detail || 'Pixel is tracking this item for you.')}</div>
          ${selected.attentionBlurb && selected.detail ? `<div class="detail-description">${escapeHtml(selected.detail)}</div>` : ''}
          <div class="detail-actions" data-detail-id="${escapeHtml(selected.id)}">
            <button class="detail-primary" type="button" data-action="done">Done</button>
            <button class="text-action" type="button" data-action="star" aria-pressed="${selected.starred ? 'true' : 'false'}">${selected.starred ? '★ Starred' : '☆ Star'}</button>
            ${openable ? '<button class="text-action" type="button" data-action="open">Open source</button>' : ''}
            ${selected.priority !== 'low' ? '<button class="text-action" type="button" data-action="priority-down">Lower priority</button>' : ''}
            <label class="reminder-control">Remind me in
              <select data-reminder-in aria-label="Remind me in">
                <option value="">Select…</option>
                <option value="5">5m</option>
                <option value="15">15m</option>
                <option value="30">30m</option>
                <option value="60">1h</option>
                <option value="120">2h</option>
                <option value="240">4h</option>
                <option value="1440">Tomorrow</option>
              </select>
            </label>
            <label class="reminder-control">Remind me at
              <input type="datetime-local" data-reminder-at value="${defaultReminderAt()}" min="${minimumReminderAt()}" aria-label="Reminder date and time">
            </label>
            <button class="text-action" type="button" data-action="remind-at">Set</button>
          </div>`;
      }

      function renderWorkItems(items) {
        const sorted = sortedWorkItems(items);
        if (!sorted.some(item => item.id === selectedItemId)) selectedItemId = sorted[0]?.id || '';
        $('workSort').value = workSort;
        $('itemList').innerHTML = sorted.length ? sorted.map(item => `
          <article class="item ${item.id === selectedItemId ? 'selected' : ''} ${item.starred ? 'starred' : ''}" data-kind="${escapeHtml(item.kind || 'memory')}" data-id="${escapeHtml(item.id)}" data-signal="${item.fingerprint ? '1' : '0'}" data-openable="${item.link || item.route ? '1' : '0'}" role="button" tabindex="0" aria-selected="${item.id === selectedItemId ? 'true' : 'false'}">
            <div class="item-top">
              ${workSort === 'manual' ? '<button class="drag-handle" type="button" title="Drag to reorder" aria-label="Drag to reorder">↕</button>' : ''}
              <div class="item-copy">
                <div class="item-title">${escapeHtml(item.title)}</div>
                <div class="item-meta">
                  <span class="urgency" data-level="${escapeHtml(item.urgency?.level || 'medium')}">${escapeHtml(item.urgency?.label || 'Medium')} · ${escapeHtml(urgencyScore(item))}</span>
                  <span>·</span>
                  <span>${escapeHtml(formatArrivalTime(item))}</span>
                </div>
              </div>
              <div class="item-quick-actions">
                <button class="quick-action quick-star" type="button" data-action="star" aria-label="${item.starred ? 'Remove star' : 'Star item'}" aria-pressed="${item.starred ? 'true' : 'false'}" title="${item.starred ? 'Remove star' : 'Star item'}">${item.starred ? '★' : '☆'}</button>
                ${item.link || item.route ? '<button class="quick-action" type="button" data-action="open" aria-label="Open source" title="Open source">↗</button>' : ''}
                <button class="quick-action quick-done" type="button" data-action="done" aria-label="Mark done" title="Mark done">✓</button>
              </div>
            </div>
          </article>`).join('') : '<div class="empty">Nothing needs you right now. I’ll keep watching.</div>';
        renderWorkDetail(sorted);
        renderPreview(sorted);
      }

      function renderPreview(items) {
        const sorted = sortedWorkItems(items);
        $('previewSort').value = workSort;
        $('previewList').innerHTML = sorted.length ? sorted.map(item => `
          <div class="preview-item ${item.starred ? 'starred' : ''}" data-preview-id="${escapeHtml(item.id)}" data-urgency="${escapeHtml(item.urgency?.level || 'medium')}">
            <button class="preview-read" type="button" data-preview-action="read">
              <div class="preview-title">${escapeHtml(item.title)}</div>
              <div class="preview-meta">${escapeHtml(item.urgency?.label || 'Medium')} · ${escapeHtml(urgencyScore(item))} · ${escapeHtml(formatArrivalTime(item))}</div>
            </button>
            <button class="quick-action quick-star" type="button" data-preview-action="star" aria-label="${item.starred ? 'Remove star' : 'Star item'}" aria-pressed="${item.starred ? 'true' : 'false'}" title="${item.starred ? 'Remove star' : 'Star item'}">${item.starred ? '★' : '☆'}</button>
            <button class="quick-action quick-done" type="button" data-preview-action="done" aria-label="Mark done" title="Mark done">✓</button>
          </div>`).join('') : '<div class="empty">Nothing needs you right now.</div>';
      }

      function refreshBuddyUrgency(items) {
        const rank = { critical: 4, high: 3, medium: 2, low: 1 };
        const highest = (items || []).reduce((current, item) => {
          const level = item?.urgency?.level;
          return (rank[level] || 0) > (rank[current] || 0) ? level : current;
        }, '');
        $('buddy').dataset.workUrgency = highest || 'none';
        $('bodyCount').title = highest
          ? `Highest work-list urgency: ${highest}`
          : 'No work-list urgency';
      }

      function render() {
        const settings = status?.settings || {};
        const mood = status?.mood || { id: 'calm', label: 'Calm', detail: 'Keeping the loose ends together.' };
        const day = status?.day || {};
        $('panelTitle').textContent = settings.name || 'Pixel';
        $('panelSub').textContent = `${mood.label}${day.hasAgenda ? ` · ${day.label}` : ''}`;
        $('buddy').dataset.mood = mood.id || 'calm';
        $('buddy').setAttribute('aria-label', `Open ${settings.name || 'Pixel'} · ${mood.label}. ${mood.detail || ''}`);
        $('buddy').title = `${mood.label}: ${mood.detail || ''}`;
        $('attentionDot').classList.toggle('on', (status?.counts?.attention || 0) > 0);
        const combined = status?.list || [...(status?.signals || []), ...(status?.items || []).filter(item => !item.snoozed)];
        refreshBuddyUrgency(combined);
        $('buddy').classList.toggle('critical-work', combined.some(item => item.urgency?.level === 'critical'));
        const relationshipSignature = combined.map(item => `${item.id}:${item.urgency?.level || ''}`).join('|');
        if (mapMode !== 'context' && mapRelationshipSignature && relationshipSignature !== mapRelationshipSignature) {
          mapRelationships = null;
          mapRelationshipSignature = '';
        }
        const progress = status?.progress || {
          open: combined.length,
          totalTrackedToday: combined.length,
          addressedToday: 0,
          deferredToday: 0,
          completionPercent: 0,
        };
        refreshProgressIndicators(progress);
        $('buddy').dataset.progress = progress.completionPercent >= 60 ? 'good' : progress.completionPercent >= 25 ? 'mixed' : 'behind';
        const sourceBits = [];
        if (status?.sources?.builds?.enabled) {
          sourceBits.push(status.sources.builds.configured
            ? status.sources.builds.refreshing ? 'Builds refreshing' : 'Builds watching'
            : 'Builds need a Code Flow repository');
        }
        if (status?.sources?.sessions?.enabled) sourceBits.push('Copilot sessions watching');
        if (status?.sources?.commitments?.enabled) {
          const commitments = status.sources.commitments;
          if (!commitments.consent || !commitments.collectionEnabled) sourceBits.push('M365 needs Connect consent');
          else if (commitments.sync?.error) sourceBits.push('M365 sync needs attention');
          else sourceBits.push(commitments.sync?.lastSuccessAt ? `M365 synced ${formatRelative(commitments.sync.lastSuccessAt)}` : 'M365 preparing first sync');
        }
        $('sourceStatus').textContent = sourceBits.join(' · ') || 'No automatic sources enabled';
        $('bodyCount').textContent = combined.length > 99 ? '99+' : String(combined.length);
        $('buddy').setAttribute('aria-label', `Open ${settings.name || 'Pixel'} · ${combined.length} tracked items · ${mood.label}. ${mood.detail || ''}`);
        renderWorkItems(combined);
        const recentActivity = status?.recentActivity || [];
        $('recentCount').textContent = String(recentActivity.length);
        $('recentList').innerHTML = recentActivity.length ? recentActivity.map(item => {
          const actionLabels = {
            completed: 'Marked done',
            dismissed: 'Dismissed',
            deferred: 'Deferred',
            reprioritized: 'Priority lowered',
          };
          const actions = (item.actions || []).map(action => actionLabels[action] || action).join(' · ');
          const controls = [
            item.canPutBack
              ? `<button class="text-action" type="button" data-recent-action="put-back" data-recent-id="${escapeHtml(item.id)}">Put back on list</button>`
              : '',
            item.canRestorePriority
              ? `<button class="text-action" type="button" data-recent-action="restore-priority" data-recent-id="${escapeHtml(item.id)}">Restore normal priority</button>`
              : '',
          ].filter(Boolean).join('');
          return `<div class="recent-row">
            <div class="recent-title">${escapeHtml(item.title)}</div>
            <div class="recent-meta">${escapeHtml(actions)} · ${escapeHtml(formatRelative(item.at))}${item.source ? ` · ${escapeHtml(item.source)}` : ''}</div>
            <div class="recent-actions">${controls || '<span class="recent-state">Currently on the list</span>'}</div>
          </div>`;
        }).join('') : '<div class="empty">No changes in the past 24 hours.</div>';
        $('mapGrouping').value = mapMode;
        renderMap(mapMode === 'context' ? status?.relationships : (mapRelationships || status?.relationships));
        renderMemories(status?.memories || []);
        renderChat();
        setView(currentView, false);
      }

      function formatRelative(value) {
        const elapsed = Date.now() - Date.parse(value || '');
        if (!Number.isFinite(elapsed) || elapsed < 0) return 'recently';
        const minutes = Math.floor(elapsed / 60000);
        if (minutes < 2) return 'just now';
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        return hours < 24 ? `${hours}h ago` : `${Math.floor(hours / 24)}d ago`;
      }

      function urgencyScore(item) {
        const score = Number(item?.urgency?.score);
        return Number.isFinite(score) ? String(score) : '0';
      }

      function formatWorkItemDate(item) {
        const value = item?.trackedAt || item?.observedAt || item?.createdAt ||
          item?.updatedAt || item?.dueAt;
        const timestamp = Date.parse(value || '');
        if (!Number.isFinite(timestamp)) return 'Tracked date unavailable';
        const date = new Intl.DateTimeFormat(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
        }).format(new Date(timestamp));
        const age = item?.trackedFor || formatRelative(value);
        const ageLabel = age === 'just now' ? age : (String(age).endsWith('ago') ? age : `${age} old`);
        return `Tracked ${date} · ${ageLabel}`;
      }

      function localDateTimeValue(value) {
        const date = new Date(value);
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function minimumReminderAt() {
        return localDateTimeValue(Date.now() + 60 * 1000);
      }

      function defaultReminderAt() {
        const date = new Date(Date.now() + 60 * 60 * 1000);
        date.setMinutes(0, 0, 0);
        if (date.getTime() < Date.now() + 60 * 60 * 1000) date.setHours(date.getHours() + 1);
        return localDateTimeValue(date);
      }

      function renderMap(relationships) {
        const nodes = relationships?.nodes || [];
        const edges = relationships?.edges || [];
        if (!nodes.length) {
          $('mapCanvas').innerHTML = '<text x="24" y="42" class="map-empty">Relationships will appear as Pixel learns about your work.</text>';
          return;
        }
        const center = nodes.find(node => node.id === 'pixel');
        const groups = nodes.filter(node => node.kind === 'repository' || node.kind === 'source');
        const positions = new Map();
        const byGroup = new Map();
        for (const edge of edges) {
          if (edge.from === 'pixel') continue;
          if (!byGroup.has(edge.from)) byGroup.set(edge.from, []);
          byGroup.get(edge.from).push(edge.to);
        }
        let cursorY = 34;
        for (const group of groups) {
          const children = byGroup.get(group.id) || [];
          const firstY = cursorY;
          children.forEach((id, index) => {
            positions.set(id, { x: 570, y: cursorY + index * 62, w: 360, h: 46 });
          });
          const height = Math.max(46, children.length * 62 - 16);
          positions.set(group.id, { x: 285, y: firstY + (height - 46) / 2, w: 220, h: 46 });
          cursorY += height + 34;
        }
        const contentHeight = Math.max(560, cursorY + 20);
        if (center) positions.set(center.id, { x: 34, y: contentHeight / 2 - 23, w: 150, h: 46 });
        mapExtent = { width: 970, height: contentHeight };
        const lines = edges.map(edge => {
          const from = positions.get(edge.from);
          const to = positions.get(edge.to);
          return from && to ? `<line class="map-edge" x1="${from.x + from.w}" y1="${from.y + from.h / 2}" x2="${to.x}" y2="${to.y + to.h / 2}"></line>` : '';
        }).join('');
        const boxes = nodes.map(node => {
          const pos = positions.get(node.id);
          if (!pos) return '';
          const maxLength = node.itemId ? 49 : 29;
          const label = String(node.label || '').length > maxLength ? String(node.label).slice(0, maxLength - 1) + '…' : node.label;
          return `<g class="map-node" data-kind="${escapeHtml(node.kind)}" ${node.itemId ? `data-item-id="${escapeHtml(node.itemId)}"` : ''}>
            <title>${escapeHtml(node.label)}</title>
            <rect x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}"></rect>
            <text x="${pos.x + 11}" y="${pos.y + 28}">${escapeHtml(label)}</text>
          </g>`;
        }).join('');
        $('mapSvg').setAttribute('viewBox', `0 0 ${Math.max(600, $('mapWrap').clientWidth)} ${Math.max(400, $('mapWrap').clientHeight)}`);
        $('mapCanvas').innerHTML = lines + boxes;
        applyMapTransform();
      }

      function applyMapTransform() {
        $('mapCanvas').setAttribute('transform', `translate(${mapTransform.x} ${mapTransform.y}) scale(${mapTransform.scale})`);
      }

      function fitMap() {
        const width = Math.max(320, $('mapWrap').clientWidth);
        const height = Math.max(280, $('mapWrap').clientHeight);
        mapTransform.scale = Math.max(.35, Math.min(1.25, (width - 48) / mapExtent.width, (height - 48) / mapExtent.height));
        mapTransform.x = Math.max(24, (width - mapExtent.width * mapTransform.scale) / 2);
        mapTransform.y = Math.max(24, (height - mapExtent.height * mapTransform.scale) / 2);
        applyMapTransform();
      }

      function zoomMap(factor, clientX, clientY) {
        const rect = $('mapWrap').getBoundingClientRect();
        const pointX = (clientX ?? rect.left + rect.width / 2) - rect.left;
        const pointY = (clientY ?? rect.top + rect.height / 2) - rect.top;
        const previous = mapTransform.scale;
        const next = Math.max(.35, Math.min(2.5, previous * factor));
        mapTransform.x = pointX - (pointX - mapTransform.x) * (next / previous);
        mapTransform.y = pointY - (pointY - mapTransform.y) * (next / previous);
        mapTransform.scale = next;
        applyMapTransform();
      }

      function renderMemories(memories) {
        $('memoryList').innerHTML = memories.length ? memories.map(memory => `
          <div class="memory-row" data-memory-id="${escapeHtml(memory.id)}">
            <input value="${escapeHtml(memory.text)}" maxlength="400" aria-label="Learned memory">
            <button class="text-action" type="button" data-memory-action="save">Save</button>
            <button class="text-action" type="button" data-memory-action="forget">Forget</button>
          </div>`).join('') : '<div class="empty">Pixel has no learned preferences yet.</div>';
      }

      function saveChat() {
        try { localStorage.setItem('dev-buddy-chat', JSON.stringify(chatHistory.slice(-12))); } catch {}
      }

      function renderChat() {
        const entries = chatHistory.slice(-8);
        $('pixelChat').innerHTML = entries.length ? entries.map((entry, index) => `
          <div class="chat-message ${entry.pending ? 'chat-thinking' : ''}" data-role="${escapeHtml(entry.role)}">
            <span class="chat-role">${entry.role === 'user' ? 'You' : 'Pixel'}</span>
            ${escapeHtml(entry.content)}
            ${entry.action && ['open', 'confirm-work-item'].includes(entry.action.type) ? `<button class="chat-action" type="button" data-chat-action="${index}">${escapeHtml(entry.action.label || 'Continue')}</button>` : ''}
          </div>`).join('') : '<div class="chat-empty">Ask me to find and open a PR or build, help prioritize, draft an email, create a work item, or remember something for you.</div>';
        $('pixelChat').scrollTop = $('pixelChat').scrollHeight;
        $('chatSend').disabled = chatBusy;
        $('chatSend').textContent = chatBusy ? 'Thinking…' : 'Ask';
      }

      async function loadMapGrouping(mode) {
        mapMode = ['context', 'urgency', 'source', 'ai-workstream', 'ai-effort'].includes(mode) ? mode : 'context';
        localStorage.setItem('dev-buddy-map-mode', mapMode);
        $('mapGrouping').value = mapMode;
        if (mapMode === 'context') {
          mapRelationships = null;
          renderMap(status?.relationships);
          setTimeout(fitMap, 30);
          return;
        }
        if (mapGroupingBusy) return;
        mapGroupingBusy = true;
        $('mapGrouping').disabled = true;
        $('mapCanvas').innerHTML = `<text x="24" y="42" class="map-empty">${mapMode.startsWith('ai-') ? 'Pixel is organizing this work…' : 'Reorganizing map…'}</text>`;
        try {
          const result = await request('/api/dev-buddy/map-groupings', {
            method: 'POST',
            body: JSON.stringify({ mode: mapMode }),
          });
          mapRelationships = result.relationships;
          mapRelationshipSignature = (status?.list || []).map(item => `${item.id}:${item.urgency?.level || ''}`).join('|');
          renderMap(mapRelationships);
          setTimeout(fitMap, 30);
        } catch (error) {
          $('mapCanvas').innerHTML = `<text x="24" y="42" class="map-empty">${escapeHtml(error.message || 'Pixel could not organize the map.')}</text>`;
        } finally {
          mapGroupingBusy = false;
          $('mapGrouping').disabled = false;
        }
      }

      async function setView(view, resize = true) {
        currentView = ['work', 'map', 'memory'].includes(view) ? view : 'work';
        localStorage.setItem('dev-buddy-view', currentView);
        $('workView').hidden = currentView !== 'work';
        $('mapView').hidden = currentView !== 'map';
        $('memoryView').hidden = currentView !== 'memory';
        for (const button of document.querySelectorAll('[data-view-target]')) {
          button.classList.toggle('active', button.dataset.viewTarget === currentView);
        }
        if (resize && panelOpen) {
          await setMode('workspace');
          if (currentView === 'map') {
            if (mapMode !== 'context' && !mapRelationships) loadMapGrouping(mapMode);
            else setTimeout(fitMap, 80);
          }
        }
      }

      async function load(refresh = false) {
        const sequence = ++loadSequence;
        try {
          let nextStatus = await request('/api/dev-buddy/status' + (refresh ? '?refresh=1' : ''));
          if (sequence !== loadSequence) return;
          const returnedIds = new Set((nextStatus.list || []).map(item => item.id));
          for (const id of pendingHiddenIds) {
            if (!returnedIds.has(id)) pendingHiddenIds.delete(id);
          }
          const hidePending = entries => (entries || []).filter(item => !pendingHiddenIds.has(item.id));
          const returnedItems = [
            ...(nextStatus.list || []),
            ...(nextStatus.signals || []),
            ...(nextStatus.items || []),
          ];
          for (const [id, starred] of pendingStarStates) {
            const returned = returnedItems.find(item => item.id === id);
            if (returned && returned.starred === starred) pendingStarStates.delete(id);
          }
          const preservePendingStars = entries => (entries || []).map(item =>
            pendingStarStates.has(item.id)
              ? { ...item, starred: pendingStarStates.get(item.id) }
              : item);
          nextStatus = {
            ...nextStatus,
            list: preservePendingStars(hidePending(nextStatus.list)),
            signals: preservePendingStars(hidePending(nextStatus.signals)),
            items: preservePendingStars(hidePending(nextStatus.items)),
          };
          status = nextStatus;
          for (const item of (status.items || [])) {
            if (item.snoozedUntil) scheduleSnoozeWake(item.snoozedUntil);
          }
          const shouldHide = status.settings &&
            (status.settings.enabled === false || (startupLaunch && status.settings.launchAtStartup === false));
          startupLaunch = false;
          if (shouldHide) {
            const fn = invoke();
            if (fn) await fn('hide_dev_buddy');
            return;
          }
          const nextIds = new Set((status.list || []).map(item => item.id));
          const added = knownItemIds
            ? (status.list || []).filter(item => !knownItemIds.has(item.id))
            : [];
          knownItemIds = nextIds;
          render();
          if (panelOpen && currentView === 'map' && mapMode !== 'context' && !mapRelationships) {
            loadMapGrouping(mapMode);
          }
          if (added.length) flashNewWork(added[0]);
          scheduleReminder();
        } catch (error) {
          if (sequence !== loadSequence) return;
          $('panelSub').textContent = 'Reconnecting to TheOffice.AI…';
        }
      }

      function hideBubble() {
        clearTimeout(bubbleTimer);
        $('buddy').classList.remove('commenting');
        $('bubble').classList.remove('show');
        if (!panelOpen && !peekOpen) {
          setTimeout(() => {
            if (!panelOpen && !peekOpen) setMode('idle');
          }, 350);
        }
      }

      async function showBubble(item, force = false) {
        if (!item || panelOpen || peekOpen || (!force && !status?.settings?.remindersEnabled)) return;
        lastFingerprint = item.fingerprint || item.id || '';
        $('bubble').dataset.kind = item.kind || 'memory';
        $('bubbleKicker').textContent = item.priority === 'high' ? 'Needs your attention' : 'Quick heads-up';
        $('bubbleTitle').textContent = item.title || 'A small reminder';
        $('bubbleDetail').textContent = item.semanticComment || item.attentionBlurb || item.detail || '';
        $('buddy').classList.add('commenting');
        await new Promise(resolve => setTimeout(resolve, 500));
        if (panelOpen) {
          $('buddy').classList.remove('commenting');
          return;
        }
        await setMode('bubble');
        $('bubble').classList.add('show');
        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(hideBubble, 9000);
      }

      function scheduleReminder() {
        clearTimeout(reminderTimer);
        if (!status?.settings?.remindersEnabled) return;
        const minutes = Math.max(5, Number(status.settings.reminderIntervalMinutes) || 30);
        reminderTimer = setTimeout(() => {
          showBubble(status?.suggestedReminder);
          scheduleReminder();
        }, minutes * 60 * 1000);
      }

      function scheduleSnoozeWake(value) {
        const wakeAt = Date.parse(value || '');
        if (!Number.isFinite(wakeAt) || wakeAt <= Date.now()) return;
        if (snoozeWakeAt && snoozeWakeAt <= wakeAt) return;
        clearTimeout(snoozeWakeTimer);
        snoozeWakeAt = wakeAt;
        snoozeWakeTimer = setTimeout(() => {
          snoozeWakeAt = 0;
          load();
        }, Math.min(2147483647, wakeAt - Date.now() + 250));
      }

      async function openPanel(focusComposer = false) {
        clearTimeout(closeTimer);
        panelOpen = true;
        peekOpen = false;
        $('hoverPreview').classList.remove('show');
        hideBubble();
        await setMode('workspace');
        $('panel').classList.add('open');
        $('stage').classList.add('panel-open');
        if (currentView === 'map') setTimeout(fitMap, 80);
        if (focusComposer) setTimeout(() => $('newItem').focus(), 80);
      }

      async function closePanel() {
        clearTimeout(closeTimer);
        panelOpen = false;
        $('panel').classList.remove('open');
        $('stage').classList.remove('panel-open');
        await setMode('idle');
      }

      async function showPeek() {
        if (panelOpen || manipulatingWindow || buddyGesture) return;
        clearTimeout(peekTimer);
        hideBubble();
        peekOpen = true;
        renderPreview(status?.list || []);
        await setMode('peek');
        if (peekOpen && !panelOpen) $('hoverPreview').classList.add('show');
      }

      function schedulePeek() {
        if (panelOpen || manipulatingWindow) return;
        clearTimeout(closeTimer);
        clearTimeout(peekTimer);
        peekTimer = setTimeout(showPeek, 260);
      }

      async function hidePeek() {
        clearTimeout(peekTimer);
        if (!peekOpen) return;
        peekOpen = false;
        $('hoverPreview').classList.remove('show');
        if (!panelOpen) await setMode('idle');
      }

      async function beginWindowAction(command) {
        const fn = invoke();
        if (!fn) return;
        clearTimeout(closeTimer);
        manipulatingWindow = true;
        try {
          await fn(command, {
            buddyLeft: windowPlacement.buddyLeft,
            buddyTop: windowPlacement.buddyTop,
          });
        } catch (_) {}
        setTimeout(() => { manipulatingWindow = false; }, 500);
      }

      function flashNewWork(item) {
        clearTimeout(newWorkTimer);
        $('buddy').classList.add('new-work');
        newWorkTimer = setTimeout(() => $('buddy').classList.remove('new-work'), 30000);
        showBubble({
          ...item,
          detail: item.detail || 'A new item was added to your work list.',
        }, true);
      }

      function celebrate(title) {
        $('reward').textContent = title ? `Nice work — ${title} is done.` : 'Nice work — one less loose end.';
        $('stage').classList.remove('celebrating');
        void $('stage').offsetWidth;
        $('stage').classList.add('celebrating');
        setTimeout(() => $('stage').classList.remove('celebrating'), 3000);
      }

      function openItemMessages(item) {
        const type = `${item?.kind || ''} ${item?.source || ''}`.toLowerCase();
        if (type.includes('email')) {
          return {
            opening: 'Opening the source email in Outlook…',
            done: 'I sent the email to Outlook.',
            error: 'I couldn’t open that email.',
          };
        }
        if (type.includes('teams')) {
          return {
            opening: 'Opening the source message in Teams…',
            done: 'I sent the message to Teams.',
            error: 'I couldn’t open that Teams message.',
          };
        }
        if (item?.kind === 'pull-request' || /\b(?:pull request|pr)\b/.test(type)) {
          return {
            opening: 'Opening the pull request…',
            done: 'I opened the pull request.',
            error: 'I couldn’t open that pull request.',
          };
        }
        if (item?.route) {
          return {
            opening: 'Opening this in TheOffice.AI…',
            done: 'I opened it in TheOffice.AI.',
            error: 'I couldn’t open that view.',
          };
        }
        return {
          opening: 'Opening the source…',
          done: 'I opened the source.',
          error: 'I couldn’t open that source.',
        };
      }

      function showOperationStatus(message, state = 'working', duration = 0) {
        clearTimeout(operationStatusTimer);
        const element = $('operationStatus');
        element.textContent = message;
        element.dataset.state = state;
        element.hidden = false;
        $('buddy').classList.toggle('working', state === 'working');
        if (duration > 0) {
          operationStatusTimer = setTimeout(() => {
            element.hidden = true;
            $('buddy').classList.remove('working');
          }, duration);
        }
      }

      async function openItem(item) {
        const operation = ++operationSequence;
        const messages = openItemMessages(item);
        const startedAt = Date.now();
        showOperationStatus(messages.opening);
        try {
          if (item.link) {
            await request('/api/open-external', { method: 'POST', body: JSON.stringify({ url: item.link }) });
          } else {
            const fn = invoke();
            if (!fn || !item.route) throw new Error('No navigation target is available.');
            await fn('open_main_window', { target: item.route });
          }
          const remaining = 400 - (Date.now() - startedAt);
          if (remaining > 0) await new Promise(resolve => setTimeout(resolve, remaining));
          if (operation === operationSequence) showOperationStatus(messages.done, 'done', 1800);
        } catch (_) {
          if (operation === operationSequence) showOperationStatus(messages.error, 'error', 3500);
        }
      }

      function togglePanel() {
        if (panelOpen) {
          closePanel();
        } else {
          openPanel();
        }
      }
      function finishBuddyDrag() {
        clearTimeout(buddyDragSafety);
        $('buddy').classList.remove('dragging');
        setTimeout(() => { manipulatingWindow = false; }, 180);
      }
      $('buddy').addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        const fn = invoke();
        if (!fn) return;
        event.preventDefault();
        clearTimeout(peekTimer);
        clearTimeout(closeTimer);
        buddyGesture = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          dragging: false,
        };
        try { $('buddy').setPointerCapture(event.pointerId); } catch (_) {}
      });
      $('buddy').addEventListener('pointermove', event => {
        const gesture = buddyGesture;
        if (!gesture || gesture.id !== event.pointerId || gesture.dragging) return;
        if (Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) < 6) return;
        gesture.dragging = true;
        manipulatingWindow = true;
        $('buddy').classList.add('dragging');
        clearTimeout(buddyDragSafety);
        buddyDragSafety = setTimeout(finishBuddyDrag, 10000);
        const fn = invoke();
        if (!fn) return finishBuddyDrag();
        fn('start_dev_buddy_drag', {
            buddyLeft: windowPlacement.buddyLeft,
            buddyTop: windowPlacement.buddyTop,
          })
          .catch(finishBuddyDrag);
      });
      $('buddy').addEventListener('pointerup', event => {
        const gesture = buddyGesture;
        if (!gesture || gesture.id !== event.pointerId) return;
        buddyGesture = null;
        try { $('buddy').releasePointerCapture(event.pointerId); } catch (_) {}
        if (gesture.dragging) {
          setTimeout(finishBuddyDrag, 180);
        } else {
          togglePanel();
        }
