<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Meeting Recap</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161d; --panel2:#0e1218; --line:#232a34;
    --ink:#e8eef6; --muted:#93a1b3; --accent:#5aa9ff; --accent2:#7ee0c9;
    --good:#57d38c; --warn:#ffcf5a; --bad:#ff7a7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  body{height:100vh}
  .wrap{height:100vh;overflow:hidden;padding:0;background:
    radial-gradient(circle at 50% 18%,rgba(90,169,255,.08),transparent 34%),var(--bg)}
  #recap{height:100vh;min-height:0;overflow:hidden;flex-direction:column}
  .stage-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:#0a0d11;box-shadow:0 24px 70px rgba(0,0,0,.4);flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100%;height:100%;object-fit:contain;background:#0a0d11}
  .masthead{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:10px;
    padding:0 12px;background:linear-gradient(180deg,rgba(8,10,14,.85),rgba(8,10,14,0));font-size:11.5px;color:#cfd8e6;z-index:3}
  .masthead .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
  .masthead .shot{margin-left:auto;color:#9fb0c6;font-variant-numeric:tabular-nums}
  .controls{display:flex;align-items:center;gap:10px;margin:8px 4px 0;flex:none;flex-wrap:nowrap;
    overflow-x:auto;overflow-y:hidden}
  button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);padding:8px 13px;font-size:13px;font-weight:600;transition:.15s}
  button.primary-control{border-color:rgba(126,224,201,.5);background:rgba(126,224,201,.09);color:#dffbf5}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .narrator-choice{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);font-size:11px}
  .narrator-choice select{max-width:190px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
    color:var(--ink);padding:7px 25px 7px 9px;font:12px "Segoe UI",system-ui,sans-serif}
  .narrator-choice select:disabled{opacity:.5}
  .prog{flex:1;min-width:160px;height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .prog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .beat-label{color:var(--muted);font-size:12px;min-width:130px}
  .note{color:var(--muted);font-size:12px;margin:6px 4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .sources{height:36px;line-height:17px;margin:6px 4px 0;color:var(--muted);font-size:12px;overflow:hidden;flex:none}
  .sources a{color:var(--accent2);text-decoration:none;border-bottom:1px solid rgba(126,224,201,.28)}
  .sources a:hover{border-bottom-color:var(--accent2)}
  .loading{display:grid;place-items:center;min-height:100vh;padding:28px;color:var(--muted);font-size:13px}
  .loading-card{width:min(420px,100%);text-align:center}
  .loading-mark{position:relative;width:54px;height:54px;margin:0 auto 20px}
  .loading-mark::before,.loading-mark::after{content:"";position:absolute;inset:0;border-radius:50%}
  .loading-mark::before{border:1px solid rgba(126,224,201,.25)}
  .loading-mark::after{border:2px solid transparent;border-top-color:var(--accent);
    border-right-color:var(--accent2);animation:load-spin 1.1s linear infinite}
  .loading-mark i{position:absolute;inset:18px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 18px rgba(126,224,201,.55);animation:load-pulse 1.5s ease-in-out infinite}
  .loading-kicker{color:var(--accent2);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .loading-title{margin-top:7px;color:var(--ink);font-size:18px;font-weight:650}
  .loading-detail{min-height:42px;margin-top:7px;color:var(--muted);font-size:13px}
  .loading-track{height:3px;margin:18px auto 0;overflow:hidden;background:#171d26;border-radius:3px}
  .loading-track i{display:block;width:38%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
    animation:load-track 1.5s ease-in-out infinite}
  .loading-retry{display:none;margin:18px auto 0;background:transparent;color:var(--accent2);border-color:#2d3a47}
  .loading.is-error .loading-mark::after{animation:none;border-color:var(--bad)}
  .loading.is-error .loading-mark i{background:var(--bad);box-shadow:0 0 18px rgba(255,122,122,.4)}
  .loading.is-error .loading-track{display:none}
  @keyframes load-spin{to{transform:rotate(360deg)}}
  @keyframes load-pulse{50%{transform:scale(.65);opacity:.55}}
  @keyframes load-track{0%{transform:translateX(-110%)}100%{transform:translateX(365%)}}
  @media (prefers-reduced-motion:reduce){
    .loading-mark::after,.loading-mark i,.loading-track i{animation-duration:3s}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading">
    <div class="loading-card">
      <div class="loading-mark" aria-hidden="true"><i></i></div>
      <div class="loading-kicker">Meetings.AI</div>
      <div class="loading-title" id="loadingTitle">Opening recap player</div>
      <div class="loading-detail" id="loadingDetail">Connecting to the cached meeting summary…</div>
      <div class="loading-track" aria-hidden="true"><i></i></div>
      <button type="button" class="loading-retry" id="loadingRetry">Retry connection</button>
    </div>
  </div>
  <div id="recap" style="display:none">
    <div class="stage-wrap">
      <div class="masthead">
        <span class="dot"></span>
        <span id="mTitle">Recap</span>
        <span class="shot" id="mShot">WIDE</span>
      </div>
      <canvas id="cv" width="960" height="560"></canvas>
    </div>
    <div class="controls">
      <button id="replayBtn">↻ Replay</button>
      <button id="prevBtn">◀ Prev</button>
      <button id="nextBtn">Next ▶</button>
      <button id="autoBtn" class="primary-control" title="Pause or resume narration, original audio, and the newscast timeline">⏸ Pause newscast</button>
      <button id="narrationBtn" title="Synthetic AI newscaster voice — not original meeting audio">AI narration: On</button>
      <label class="narrator-choice">Voice
        <select id="narratorProvider" title="Choose Azure neural narration or the operating-system voice">
          <option value="azure">Azure neural</option>
          <option value="system">System voice</option>
        </select>
      </label>
      <label class="narrator-choice" id="narratorVoiceWrap">Narrator <select id="narratorVoice"></select></label>
      <label class="narrator-choice" id="narratorStyleWrap">Style <select id="narratorStyle"></select></label>
      <button id="audioBtn" style="display:none">▶ Original clip</button>
      <div class="beat-label" id="beatLabel">—</div>
      <div class="prog"><i id="progBar"></i></div>
    </div>
    <div class="sources" id="sourceLinks"></div>
    <div class="note" id="sourceDisclosure"><b>Evidence-backed recap with AI newscaster narration.</b> Narration is synthetic and distinct from original meeting audio. Click an evidence card to open its source.</div>
  </div>
</div>

<script>
/* ============================================================================
   Meeting Recap player — data-driven "newscast" recap.
   Standalone stage; the parent app posts { story, people, photos } via
   postMessage. Renders gender-aware animated busts by default; real photos
   (data URIs keyed by person key) are used when provided.
============================================================================ */

let PEOPLE = {};
let PHOTOS = {};
const IMG = {};
function loadPhotos(){ for(const k in PHOTOS){ const im=new Image(); im.src=PHOTOS[k]; IMG[k]=im; } }
let EVIDENCE = [];
let EVIDENCE_BY_ID = {};
const EVIDENCE_IMG = {};
function loadEvidenceImages(){
  for(const item of EVIDENCE){
    const add=(key,url)=>{
      if(!url) return;
      const im=new Image();
      im.referrerPolicy='no-referrer';
      im.src=url;
      EVIDENCE_IMG[key]=im;
    };
    add(item.id,item.imageUrl);
    (item.visuals||[]).forEach((visual,index)=>add(`${item.id}:v${index}`,visual.imageUrl));
  }
}

/* ---- Emotion detection (honest lexicon/heuristic, not ML) ---------------- */
const EMO_LEX = [
  ['concerned', ['worry','worried','concern','risk','afraid','problem','issue','alarming','overstate']],
  ['assertive', ['need to','we should','must','have to','disagree','commit','settle','push']],
  ['optimistic',['great','good','win','progress','improve','better','automate','continue']],
  ['analytical',['because','data','latency','inventory','numbers','count','model','reporting','usage']],
];
const EMO_NEUTRAL='measured';
const EMO_META={
  concerned:{label:'Concerned', color:'#ffcf5a'},
  assertive:{label:'Assertive', color:'#ff9f6b'},
  optimistic:{label:'Optimistic',color:'#57d38c'},
  analytical:{label:'Analytical',color:'#7ee0c9'},
  measured:{label:'Measured',  color:'#93a1b3'},
};
function detectEmotion(text){
  const t=(text||'').toLowerCase();
  for(const [emo,keys] of EMO_LEX){ for(const k of keys){ if(t.includes(k)) return emo; } }
  return EMO_NEUTRAL;
}

/* ============================ Canvas + render ============================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

let STORY=null, BEATS=[], beatIx=0, beatStart=0, playing=false, autoplay=true, awaitingNext=false, raf=0, pausedElapsed=0;
let ACTIVE_AUDIO=null;
let narrationEnabled=true, ACTIVE_UTTERANCE=null, NARRATION_AUDIO=null, NARRATION_ABORT=null, NARRATION_GENERATION=0;
let NARRATION_TIMER=0, NARRATION_QUEUE=[], NARRATION_DONE=true, NARRATION_STARTED_AT=0;
let NARRATION_CONFIG={provider:'system',voice:'',style:'',configured:false,voices:[]};
let CLICK_TARGETS=[];

/* layout rectangles */
const HS_RECT ={x:44, y:150, w:352, h:372};
const SL_RECT ={x:420,y:150, w:496, h:372};
const FULL_RECT={x:120,y:132, w:720, h:392};

/* ---- text utilities: wrap + auto-fit (NO truncation) --------------------- */
function wrap(text, maxW){
  const words=(text||'').split(/\s+/), lines=[]; let cur='';
  for(const w of words){
    const tryLine=cur?cur+' '+w:w;
    if(ctx.measureText(tryLine).width>maxW && cur){ lines.push(cur); cur=w; }
    else cur=tryLine;
  }
  if(cur) lines.push(cur);
  return lines;
}
function fitText(text, maxW, maxH, opt){
  opt=opt||{}; const max=opt.max||16, min=opt.min||10, wt=opt.weight||'', lhR=opt.lh||1.34, fam=opt.family||'"Segoe UI",sans-serif';
  let last=null;
  for(let fs=max; fs>=min; fs--){
    ctx.font=`${wt} ${fs}px ${fam}`.trim();
    const lines=wrap(text,maxW), lh=Math.round(fs*lhR);
    last={lines,fs,lh,font:ctx.font};
    if(lines.length*lh<=maxH) return last;
  }
  return last;
}
function drawFitted(fit, x, y, color, align){
  ctx.font=fit.font; ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  let yy=y+fit.fs;
  for(const ln of fit.lines){ ctx.fillText(ln, x, yy); yy+=fit.lh; }
  return yy;
}
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---- conference room ----------------------------------------------------- */
function drawRoom(dim){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141b26'); g.addColorStop(1,'#0b0f16');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0e1622';
  for(let i=0;i<5;i++){ const x=80+i*168; rr(x,70,132,150,8); ctx.fill(); }
  ctx.strokeStyle='rgba(126,224,201,.16)'; ctx.lineWidth=1.5;
  for(let i=0;i<5;i++){ const x=80+i*168; rr(x,70,132,150,8); ctx.stroke(); }
  for(let i=0;i<5;i++){ const x=80+i*168; const gg=ctx.createLinearGradient(0,70,0,220);
    gg.addColorStop(0,'rgba(90,169,255,.10)'); gg.addColorStop(1,'rgba(90,169,255,0)');
    ctx.fillStyle=gg; ctx.fillRect(x,70,132,150); }
  ctx.fillStyle='#1a2431'; rr(150,430,660,90,40); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.stroke();
  if(dim){ ctx.fillStyle=`rgba(6,9,13,${dim})`; ctx.fillRect(0,0,W,H); }
}

/* ---- fallback bust (gender-aware) — used only if a photo is missing ------ */
function drawBust(x,y,s,person,emo){
  const skin='#e8c9a8', c=person.color||'#5aa9ff';
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=c; rr(-s*0.62,s*0.52,s*1.24,s*0.9,s*0.26); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.10)'; rr(-s*0.16,s*0.52,s*0.32,s*0.9,s*0.12); ctx.fill();
  ctx.fillStyle=skin; rr(-s*0.14,s*0.30,s*0.28,s*0.3,s*0.1); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,0,s*0.42,s*0.5,0,0,7); ctx.fill();
  ctx.fillStyle='#3a2c22';
  if(person.gender==='f'){
    ctx.beginPath(); ctx.ellipse(0,-s*0.06,s*0.52,s*0.5,0,Math.PI,2*Math.PI); ctx.fill();
    rr(-s*0.52,-s*0.06,s*0.16,s*0.7,s*0.08); ctx.fill();
    rr(s*0.36,-s*0.06,s*0.16,s*0.7,s*0.08); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(0,-s*0.16,s*0.44,s*0.3,0,Math.PI,2*Math.PI); ctx.fill();
  }
  ctx.fillStyle='#20303f';
  ctx.beginPath(); ctx.ellipse(-s*0.16,-s*0.02,s*0.05,s*0.07,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( s*0.16,-s*0.02,s*0.05,s*0.07,0,0,7); ctx.fill();
  ctx.strokeStyle='#3a2c22'; ctx.lineWidth=s*0.05; ctx.lineCap='round';
  const bt=emo==='concerned'?-s*0.02:emo==='assertive'?s*0.04:0;
  ctx.beginPath(); ctx.moveTo(-s*0.24,-s*0.14+bt); ctx.lineTo(-s*0.06,-s*0.16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( s*0.06,-s*0.16); ctx.lineTo( s*0.24,-s*0.14+bt); ctx.stroke();
  ctx.strokeStyle='#7a4a45'; ctx.lineWidth=s*0.05;
  ctx.beginPath();
  if(emo==='optimistic') ctx.arc(0,s*0.12,s*0.14,0.15*Math.PI,0.85*Math.PI);
  else if(emo==='concerned') ctx.arc(0,s*0.24,s*0.14,1.15*Math.PI,1.85*Math.PI);
  else { ctx.moveTo(-s*0.12,s*0.16); ctx.lineTo(s*0.12,s*0.16); }
  ctx.stroke();
  ctx.restore();
}

/* ---- headshot panel (real photo, else bust) ------------------------------ */
function drawCover(img,x,y,w,h){
  const ir=img.naturalWidth/img.naturalHeight, rrto=w/h; let dw,dh;
  if(ir>rrto){ dh=h; dw=h*ir; } else { dw=w; dh=w/ir; }
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}
function drawHeadshotPanel(r, person, emo){
  ctx.save();
  rr(r.x,r.y,r.w,r.h,14); ctx.clip();
  const img=IMG[person.key];
  if(img && img.complete && img.naturalWidth){
    drawCover(img,r.x,r.y,r.w,r.h);
  } else {
    const g=ctx.createLinearGradient(0,r.y,0,r.y+r.h); g.addColorStop(0,'#16202c'); g.addColorStop(1,'#0d141d');
    ctx.fillStyle=g; ctx.fillRect(r.x,r.y,r.w,r.h);
    drawBust(r.x+r.w/2, r.y+r.h*0.44, r.h*0.30, person, emo);
  }
  const gg=ctx.createLinearGradient(0,r.y+r.h-120,0,r.y+r.h);
  gg.addColorStop(0,'rgba(6,9,13,0)'); gg.addColorStop(1,'rgba(6,9,13,.92)');
  ctx.fillStyle=gg; ctx.fillRect(r.x,r.y+r.h-120,r.w,120);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1; rr(r.x,r.y,r.w,r.h,14); ctx.stroke();
  ctx.fillStyle=person.color||'#5aa9ff'; rr(r.x+16,r.y+r.h-62,40,4,2); ctx.fill();
  ctx.textAlign='left';
  ctx.font='700 21px "Segoe UI",sans-serif'; ctx.fillStyle='#f2f7fc';
  ctx.fillText(person.name, r.x+16, r.y+r.h-32);
  ctx.font='13px "Segoe UI",sans-serif'; ctx.fillStyle='#c6d2e2';
  ctx.fillText(person.role||'', r.x+16, r.y+r.h-14);
  ctx.fillStyle='rgba(8,11,15,.7)'; rr(r.x+12,r.y+12,78,22,6); ctx.fill();
  ctx.fillStyle='#7ee0c9'; ctx.beginPath(); ctx.arc(r.x+24,r.y+23,4,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 11px "Segoe UI",sans-serif'; ctx.fillText('QUOTE', r.x+34, r.y+27);
  const em=EMO_META[emo]||EMO_META[EMO_NEUTRAL];
  const bw=ctx.measureText('Text: '+em.label).width+40;
  ctx.fillStyle='rgba(8,11,15,.7)'; rr(r.x+r.w-bw-12,r.y+12,bw,22,6); ctx.fill();
  ctx.fillStyle=em.color; ctx.beginPath(); ctx.arc(r.x+r.w-bw+2,r.y+23,4,0,7); ctx.fill();
  ctx.fillStyle='#e8eef6'; ctx.font='600 11px "Segoe UI",sans-serif';
  ctx.fillText('Text: '+em.label, r.x+r.w-bw+14, r.y+27);
}

/* ---- on-screen card (heading + narration + supporting visual) ------------ */
function drawCard(r, seg){
  ctx.fillStyle='#0f1620'; rr(r.x,r.y,r.w,r.h,14); ctx.fill();
  ctx.strokeStyle='rgba(126,224,201,.18)'; ctx.lineWidth=1; rr(r.x,r.y,r.w,r.h,14); ctx.stroke();
  const pad=22; let y=r.y+pad; const iw=r.w-pad*2, ix=r.x+pad;
  ctx.fillStyle='#7ee0c9'; rr(ix,y,44,4,2); ctx.fill(); y+=16;
  const hf=fitText(seg.heading, iw, 60, {max:22,min:16,weight:'700',lh:1.2});
  y=drawFitted(hf, ix, y, '#f2f7fc')+8;
  if(seg.narration){
    const nf=fitText(seg.narration, iw, 118, {max:15,min:12,lh:1.42});
    y=drawFitted(nf, ix, y, '#cdd8e6')+10;
  }
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(ix,y); ctx.lineTo(ix+iw,y); ctx.stroke(); y+=14;
  const rx=ix, ry=y, rw=iw, rh=(r.y+r.h-pad)-y;
  const linked=evidenceForSegment(seg);
  if(linked.length) drawEvidenceBoard(linked, {x:rx,y:ry,w:rw,h:rh}, 2);
  else drawScreen(seg.screen, rx, ry, rw, rh, seg);
}

function evidenceTypeLabel(type){
  return String(type||'source').replace(/-/g,' ').toUpperCase();
}
function drawEvidenceBoard(items, r, maxItems){
  items=(items||[]).slice(0,maxItems||6);
  if(!items.length) return;
  const cols=items.length===1?1:2, gap=12, rows=Math.ceil(items.length/cols);
  const cw=(r.w-gap*(cols-1))/cols, ch=(r.h-gap*(rows-1))/rows;
  items.forEach((item,index)=>{
    const col=index%cols,row=Math.floor(index/cols),x=r.x+col*(cw+gap),y=r.y+row*(ch+gap);
    if(item.url) CLICK_TARGETS.push({x,y,w:cw,h:ch,url:item.url,title:item.title||'Open source'});
    ctx.fillStyle='rgba(255,255,255,.035)'; rr(x,y,cw,ch,10); ctx.fill();
    ctx.strokeStyle='rgba(126,224,201,.16)'; rr(x,y,cw,ch,10); ctx.stroke();
    const image=EVIDENCE_IMG[item.id];
    let tx=x+14, tw=cw-28;
    if(image&&image.complete&&image.naturalWidth&&ch>90){
      const iw=Math.min(92,cw*.34),ih=ch-20;
      ctx.save(); rr(x+10,y+10,iw,ih,7); ctx.clip(); drawCover(image,x+10,y+10,iw,ih); ctx.restore();
      tx=x+iw+22; tw=cw-iw-34;
    }
    ctx.font='700 10px "Segoe UI",sans-serif'; ctx.fillStyle='#7ee0c9';
    ctx.fillText(evidenceTypeLabel(item.type),tx,y+20);
    if(item.url){
      ctx.textAlign='right'; ctx.font='700 13px "Segoe UI Symbol","Segoe UI",sans-serif'; ctx.fillStyle='#7ee0c9';
      ctx.fillText('↗',x+cw-13,y+21); ctx.textAlign='left';
    }
    const title=fitText(item.title||'Supporting evidence',tw,42,{max:13,min:11,weight:'700',lh:1.2});
    let yy=drawFitted(title,tx,y+25,'#eef4fb')+4;
    const meta=[item.source,item.author,item.timestamp].filter(Boolean).join(' · ');
    if(meta){ const mf=fitText(meta,tw,28,{max:10.5,min:9.5,lh:1.15}); yy=drawFitted(mf,tx,yy,'#8aa0b6')+3; }
    const highlights=Array.isArray(item.highlights)?item.highlights.filter(Boolean):[];

function drawEvidenceChart(visual,r){
  const labels=(visual.labels||[]).slice(0,8),series=(visual.series||[]).filter(x=>x&&x.values&&x.values.length).slice(0,4);
  if(!labels.length||!series.length) return false;
  const values=series.flatMap(x=>x.values.slice(0,labels.length)).filter(Number.isFinite);
  if(!values.length) return false;
  const max=Math.max(...values,0),min=Math.min(...values,0),range=(max-min)||1;
  const colors=['#7ee0c9','#5aa9ff','#ffb27a','#c58cff'];
  const left=r.x+42,right=r.x+r.w-12,top=r.y+16,bottom=r.y+r.h-42;
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(left,top); ctx.lineTo(left,bottom); ctx.lineTo(right,bottom); ctx.stroke();
  ctx.font='9px "Segoe UI",sans-serif'; ctx.fillStyle='#8aa0b6'; ctx.textAlign='right';
  ctx.fillText(String(max)+(visual.unit?` ${visual.unit}`:''),left-7,top+4);
  ctx.fillText(String(min),left-7,bottom+3);
  const groupW=(right-left)/labels.length,barGap=2,barW=Math.max(3,(groupW-8)/series.length);
  labels.forEach((label,index)=>{
    series.forEach((entry,seriesIndex)=>{
      const value=entry.values[index];
      if(!Number.isFinite(value)) return;
      const zeroY=bottom-((0-min)/range)*(bottom-top);
      const valueY=bottom-((value-min)/range)*(bottom-top);
      const x=left+index*groupW+4+seriesIndex*(barW+barGap);
      ctx.fillStyle=colors[seriesIndex%colors.length];
      ctx.fillRect(x,Math.min(zeroY,valueY),barW,Math.max(2,Math.abs(zeroY-valueY)));
    });
    ctx.save(); ctx.translate(left+index*groupW+groupW/2,bottom+8); ctx.rotate(-Math.PI/7);
    ctx.font='9px "Segoe UI",sans-serif'; ctx.fillStyle='#aebed0'; ctx.textAlign='right';
    ctx.fillText(label.slice(0,18),0,0); ctx.restore();
  });
  ctx.textAlign='left';
  if(series.length>1){
    let lx=left;
    series.forEach((entry,index)=>{
      ctx.fillStyle=colors[index%colors.length]; ctx.fillRect(lx,top-12,8,8);
      ctx.font='9px "Segoe UI",sans-serif'; ctx.fillStyle='#aebed0';
      ctx.fillText((entry.name||`Series ${index+1}`).slice(0,18),lx+12,top-4);
      lx+=Math.min(128,ctx.measureText((entry.name||'Series')+'').width+28);
    });
  }
  return true;
}

function layoutBullets(items, x, y, w, h, italic){
  items=items||[];
  const bx=x+18, bw=w-18;
  for(let fs=15; fs>=11; fs--){
    ctx.font=`${italic?'italic ':''}${fs}px "Segoe UI",sans-serif`;
    const lh=Math.round(fs*1.4); let total=0; const blocks=[];
    for(const it of items){ const lines=wrap(it,bw); blocks.push(lines); total+=lines.length*lh+8; }
    if(total<=h || fs===11){

      for(let i=0;i<blocks.length;i++){

        let ly=yy;
        for(const ln of blocks[i]){ ly+=fs; ctx.fillText(ln, bx, ly); ly+=lh-fs; }
        yy=ly+8;
      }
      return;
    }
  }
}

    for(const p of points){ const lines=wrap(p,iw-12); blocks.push(lines); total+=lines.length*lh+6; }

/* ============================ beats ====================================== */
function buildBeats(story){
  const B=[];
  B.push({type:'title', gate:true, dur:2600});
  B.push({type:'overview', gate:true, dur:3600});
  if(story.evidence && story.evidence.length) B.push({type:'evidence', gate:true, dur:4800});
  const sourceBeats=[];
  orderedEvidence(story.evidence||[])
    .filter(evidenceHasDeepExtract)
    .sort((a,b)=>Number(!!(b.visuals&&b.visuals.length))-Number(!!(a.visuals&&a.visuals.length))||evidencePriority(a)-evidencePriority(b))
    .forEach(item=>{
      const count=Math.max((item.citations||[]).length,(item.visuals||[]).length,1);
      for(let index=0;index<Math.min(2,count);index++){
        sourceBeats.push({type:'source',item,citationIndex:index,visualIndex:index,gate:true,dur:5600});
      }
    });
  B.push(...sourceBeats.slice(0,6));
  (story.segments||[]).forEach((seg)=>{
    if(!seg.narration && !seg.quote && !seg.screen) return;
    B.push({type:'segment', seg, gate:true, dur:5200});
  });
  if(story.decisions && story.decisions.length) B.push({type:'decisions', gate:true, dur:4200});
  if(story.chatter && story.chatter.items && story.chatter.items.length) B.push({type:'chatter', gate:true, dur:5200});
  if(story.actions && story.actions.length)     B.push({type:'actions', gate:true, dur:4200});
  return B;
}

function beatShotLabel(b){
  if(b.type==='title') return 'OPEN';
  if(b.type==='overview') return 'ANCHOR';
  if(b.type==='evidence') return 'EVIDENCE';
  if(b.type==='source') return 'SOURCE';
  if(b.type==='segment') return 'TWO-SHOT';
  if(b.type==='decisions') return 'RECAP';
  if(b.type==='chatter') return 'CHATTER';
  if(b.type==='actions') return 'ACTIONS';
  return '';
}

function evidencePriority(item){
  if(!item) return 9;
  if(['recording','slide','image','document','work-item','pull-request','commit','repository'].includes(item.type)) return 0;
  if(item.type==='email') return 1;
  if(item.type==='teams' && !/teams\.microsoft\.com\/l\/meeting\/details/i.test(item.url||'')) return 1;
  if(item.type==='teams') return 2;
  if(item.type==='transcript') return 3;
  return 2;
}
function evidenceForSegment(seg){
  return (seg&&seg.evidenceIds||[])
    .map(id=>EVIDENCE_BY_ID[id])
    .filter(Boolean)
    .sort((a,b)=>evidencePriority(a)-evidencePriority(b));
}
function orderedEvidence(items){
  return [...(items||[])].sort((a,b)=>evidencePriority(a)-evidencePriority(b));
}
function evidenceForBeat(beat){
  if(!beat) return [];
  if(beat.type==='evidence') return orderedEvidence(EVIDENCE).slice(0,6);
  if(beat.type==='source') return beat.item?[beat.item]:[];
  if(beat.type==='segment') return evidenceForSegment(beat.seg);
  return [];
}
function clipForBeat(beat){
  if(!beat||beat.type!=='segment'||!beat.seg.audioClipId) return null;
  return (((STORY||{}).media||{}).audioClips||[]).find(x=>x.id===beat.seg.audioClipId)||null;
}
function updateBeatSources(){
  const beat=BEATS[beatIx],items=evidenceForBeat(beat),host=document.getElementById('sourceLinks');
  host.replaceChildren();

    host.append(document.createTextNode('Sources: '));
    items.forEach((item,index)=>{
      if(index) host.append(document.createTextNode(' · '));
      if(item.url){
        const a=document.createElement('a'); a.href=item.url; a.target='_blank'; a.rel='noopener';
        a.textContent=item.title||item.source||'Open source'; host.append(a);
      }else host.append(document.createTextNode(item.title||item.source||'Supporting evidence'));
    });
  }
  const clip=clipForBeat(beat),button=document.getElementById('audioBtn');
  button.style.display=clip?'inline-flex':'none';
  button.textContent=clip?'▶ '+(clip.label||'Original clip'):'▶ Original clip';
}
function stopAudio(){

}
function stopNarration(){

}

function beatNarration(beat){
  if(!beat||!STORY) return '';
  if(beat._narration) return beat._narration;
  let text='';
  if(beat.type==='title'){
    text=`Welcome to your Meetings A I newscast for ${STORY.title||'this meeting'}. We will connect the moments that changed the conversation, the evidence behind them, and what moves next.`;
  }else if(beat.type==='overview'){
    text=STORY.editorialThroughline||`Here is the editorial arc: the discussion moved from context into tradeoffs, then narrowed toward decisions and ownership. Watch for where the evidence changes what the team can confidently do next.`;
  }else if(beat.type==='evidence'){
    const types=[...new Set(orderedEvidence(EVIDENCE).map(x=>evidenceTypeLabel(x.type).toLowerCase()))];
    text=STORY.evidenceSynthesis||`This edit cross-checks ${EVIDENCE.length} retrieved sources across ${types.slice(0,4).join(', ')||'the meeting record'}. That mix helps separate a passing comment from a conclusion supported by the surrounding work. Every card remains clickable for the original context.`;
  }else if(beat.type==='source'){
    const item=beat.item||{};
    const citation=(item.citations||[])[Math.max(0,Number(beat.citationIndex)||0)]||(item.citations||[])[0];
    const visual=(item.visuals||[])[Math.max(0,Number(beat.visualIndex)||0)]||(item.visuals||[])[0];
    const where=(citation&&citation.locator)||(visual&&visual.locator)||'the retrieved source';
    const proof=item.relevance||(citation&&citation.context)||(item.highlights||[])[0]||item.summary;
    text=`Now we open ${item.title||'a supporting source'} at ${where}. ${proof||'This is the underlying material that supports the meeting discussion rather than just another link in a source list.'}`;
    if(visual) text+=` The ${visual.kind||'visual'} puts the supporting pattern on screen so you can compare the meeting's conclusion with the source itself.`;
  }else if(beat.type==='segment'){
    const seg=beat.seg||{};
    text=`Now the story turns to ${seg.heading||'the next key moment'}. ${seg.narration||'This is where the conversation shifts from information-sharing toward a consequence the team has to manage.'}`;
    if(seg.whyItMatters) text+=` The practical signal: ${seg.whyItMatters}`;
  }else if(beat.type==='decisions'){
    const decisions=(STORY.decisions||[]).slice(0,4),questions=(STORY.questions||[]).slice(0,2);
    text=`The conversation converted into ${decisions.length} concrete ${decisions.length===1?'decision':'decisions'}, while ${questions.length} ${questions.length===1?'question remains':'questions remain'} unresolved. The important distinction is between settled direction and risk that still needs an owner.`;
  }else if(beat.type==='chatter'){
    const count=(STORY.chatter&&STORY.chatter.items||[]).length;
    text=`The side channel adds ${count} useful pieces of context that the spoken discussion alone would miss. Treat these as connective evidence: they show where participants supplied links, clarified intent, or moved follow-up work forward in parallel.`;
  }else if(beat.type==='actions'){
    const actions=(STORY.actions||[]),owners=[...new Set(actions.map(a=>a.owner).filter(Boolean))];
    text=STORY.closingSynthesis||`The meeting now depends on ${actions.length} owned ${actions.length===1?'follow-up':'follow-ups'} across ${owners.length||1} ${owners.length===1?'owner':'owners'}. The handoff is the real test: progress will come from closing the unresolved risk, not from repeating the discussion.`;
  }
  beat._narration=text.replace(/\s+/g,' ').trim();
  return beat._narration;
}
function preferredNarratorVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices=window.speechSynthesis.getVoices()||[];
  const english=voices.filter(v=>/^en(-|_)/i.test(v.lang));
  return english.find(v=>/Aria.*Natural|Ava.*Natural|Jenny.*Natural/i.test(v.name))
    || english.find(v=>/Aria|Ava|Jenny|Samantha|Zira/i.test(v.name))
    || english.find(v=>!/David|Mark|Guy|George/i.test(v.name))
    || null;
}
function narrationChunks(text){
  const sentences=String(text||'').match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];
  const chunks=[]; let current='';
  for(const sentence of sentences){
    const next=(current+' '+sentence.trim()).trim();
    if(current&&next.length>240){ chunks.push(current); current=sentence.trim(); }
    else current=next;
  }
  if(current) chunks.push(current);
  return chunks;
}
function speakNarrationChunk(generation){
  if(generation!==NARRATION_GENERATION) return;
  if(!narrationEnabled||!NARRATION_QUEUE.length){
    ACTIVE_UTTERANCE=null; NARRATION_DONE=true;
    const button=document.getElementById('narrationBtn'); if(button) button.textContent='AI narration: On';
    return;
  }
  const utterance=new SpeechSynthesisUtterance(NARRATION_QUEUE.shift());
  utterance.rate=1.14; utterance.pitch=1.12; utterance.volume=0.98;
  const voice=preferredNarratorVoice(); if(voice) utterance.voice=voice;
  const button=document.getElementById('narrationBtn');
  utterance.onstart=()=>{ if(button) button.textContent='AI narration: Speaking'; };
  utterance.onend=()=>{ if(ACTIVE_UTTERANCE===utterance){ ACTIVE_UTTERANCE=null; speakNarrationChunk(generation); } };
  utterance.onerror=()=>{ if(ACTIVE_UTTERANCE===utterance){ ACTIVE_UTTERANCE=null; NARRATION_QUEUE=[]; NARRATION_DONE=true; if(button) button.textContent='AI narration: On'; } };
  ACTIVE_UTTERANCE=utterance;
  window.speechSynthesis.speak(utterance);
}
function speakSystemNarration(text,generation){
  if(!('speechSynthesis' in window)){ NARRATION_DONE=true; return; }
  NARRATION_QUEUE=narrationChunks(text);
  speakNarrationChunk(generation);
}
async function speakAzureNarration(text,generation){
  const button=document.getElementById('narrationBtn');
  button.textContent='AI narration: Preparing neural voice';
  const ac=new AbortController(); NARRATION_ABORT=ac;
  try{
    const response=await fetch('/api/meetings/narration/synthesize',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text}),signal:ac.signal
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(result.error||'Azure neural narration failed');
    if(generation!==NARRATION_GENERATION) return;
    NARRATION_ABORT=null;
    const audio=new Audio(result.url);
    audio.preload='auto';
    audio.onplay=()=>{ if(generation===NARRATION_GENERATION) button.textContent='AI narration: Speaking'; };
    audio.onended=()=>{ if(generation===NARRATION_GENERATION){ NARRATION_AUDIO=null; NARRATION_DONE=true; button.textContent='AI narration: On'; } };
    audio.onerror=()=>{ if(generation===NARRATION_GENERATION){ NARRATION_AUDIO=null; NARRATION_DONE=true; button.textContent='Neural narration unavailable'; } };
    NARRATION_AUDIO=audio;
    await audio.play();
  }catch(e){
    if(e&&e.name==='AbortError') return;
    if(generation!==NARRATION_GENERATION) return;
    NARRATION_ABORT=null;
    button.textContent='AI narration: System fallback';
    speakSystemNarration(text,generation);
  }
}
function speakBeat(beat){
  if(!narrationEnabled) return;
  const text=beatNarration(beat);
  if(!text) return;
  stopNarration();
  const generation=NARRATION_GENERATION;
  NARRATION_DONE=false;
  NARRATION_STARTED_AT=performance.now();
  if(NARRATION_CONFIG.provider==='azure'&&NARRATION_CONFIG.configured) speakAzureNarration(text,generation);
  else speakSystemNarration(text,generation);
}
function beatDuration(beat){
  const base=(beat&&beat.dur)||3000;
  if(!narrationEnabled) return base;
  const words=(beatNarration(beat).match(/\S+/g)||[]).length;
  return Math.max(base,Math.min(45000,1000+(words/2.7)*1000));
}
function tick(now){
  if(!playing) return;
  const b=BEATS[beatIx]; const t=now-beatStart; const dur=beatDuration(b);
  ctx.clearRect(0,0,W,H);

  renderBeat(b, Math.min(t,dur));
  const waitingForNarrator=narrationEnabled&&!NARRATION_DONE&&(now-NARRATION_STARTED_AT)<90000;
  const frac=waitingForNarrator?Math.min(.98,t/dur):Math.min(1,t/Math.max(1,(b&&b.dur)||3000));
  document.getElementById('progBar').style.width=(((beatIx+frac)/BEATS.length)*100)+'%';
  document.getElementById('mShot').textContent=beatShotLabel(b);
  document.getElementById('beatLabel').textContent=`Beat ${beatIx+1} / ${BEATS.length}`+(awaitingNext?' · ready':'');
  if(t>=((b&&b.dur)||3000) && !waitingForNarrator && !awaitingNext){
    if(beatIx>=BEATS.length-1){ awaitingNext=true; }

    else { awaitingNext=true; }
  }
  if(awaitingNext && b.gate!==false){
    ctx.save(); ctx.globalAlpha=0.6+0.4*Math.sin(now/300);
    ctx.fillStyle='#0b0e13cc'; rr(W-208,H-40,196,28,8); ctx.fill();
    ctx.fillStyle='#cdd8e6'; ctx.font='12px "Segoe UI",sans-serif'; ctx.textAlign='center';
    ctx.fillText(beatIx>=BEATS.length-1?'End · ↻ Replay':'Click / → / Space to continue', W-110, H-22);

  }

}
function gotoBeat(i){
  stopAudio();
  stopNarration();
  beatIx=Math.max(0,Math.min(BEATS.length-1,i));
  beatStart=performance.now();
  pausedElapsed=0;
  awaitingNext=false;
  updateBeatSources();
  if(narrationEnabled&&playing) NARRATION_TIMER=setTimeout(()=>{ NARRATION_TIMER=0; if(BEATS[beatIx]) speakBeat(BEATS[beatIx]); },40);
  if(!playing){
    ctx.clearRect(0,0,W,H); CLICK_TARGETS=[]; renderBeat(BEATS[beatIx],0);
    document.getElementById('mShot').textContent=beatShotLabel(BEATS[beatIx]);

}
function advance(){ if(beatIx>=BEATS.length-1){ return; } gotoBeat(beatIx+1); }
function goBack(){ gotoBeat(beatIx-1); }

    ? '<b>Evidence-backed recap with AI newscaster narration and authentic meeting audio.</b> Narration is synthetic; original clips are labeled separately. Click any evidence card to open its source.'
    : EVIDENCE.length
      ? `<b>Evidence-backed transcript recap with AI newscaster narration · no playable meeting audio was retrieved.</b> Includes ${Number((STORY.newscast||{}).citationCount)||0} exact citations and ${Number((STORY.newscast||{}).visualCount)||0} source visuals. Narration is synthetic. Click any linked evidence card to open its source.`
      : '<b>Transcript-only recap with AI newscaster narration · no supporting media was retrieved.</b> Narration is synthetic; nothing is fabricated.';

function startRecap(story, people, photos){
  setLoadingStatus('Building recap scenes','Laying out speakers, key moments, decisions, and action items…',false);
  document.getElementById('loadingRetry').style.display='none';
  requestAnimationFrame(()=>requestAnimationFrame(async()=>{
    try{ await finishRecap(story, people, photos); }
    catch(err){
      setLoadingStatus('Could not render this recap','Return to details and try generating the recap again.',true);
      document.getElementById('loadingRetry').style.display='block';
    }
  }));
}

document.getElementById('replayBtn').onclick=()=>{ if(!STORY) return; playing=true; pausedElapsed=0; document.getElementById('autoBtn').textContent='⏸ Pause newscast'; gotoBeat(0); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); };
document.getElementById('nextBtn').onclick=advance;
document.getElementById('prevBtn').onclick=goBack;
document.getElementById('autoBtn').onclick=()=>{
  const button=document.getElementById('autoBtn');
  if(playing){
    pausedElapsed=Math.max(0,performance.now()-beatStart);
    playing=false; cancelAnimationFrame(raf);
    if(NARRATION_TIMER){ clearTimeout(NARRATION_TIMER); NARRATION_TIMER=0; }
    if(NARRATION_AUDIO) try{ NARRATION_AUDIO.pause(); }catch(e){}
    else if('speechSynthesis' in window) try{ window.speechSynthesis.pause(); }catch(e){}
    if(ACTIVE_AUDIO) try{ ACTIVE_AUDIO.pause(); }catch(e){}
    button.textContent='▶ Resume newscast';
    if(ACTIVE_UTTERANCE||NARRATION_AUDIO) document.getElementById('narrationBtn').textContent='AI narration: Paused';
    document.getElementById('beatLabel').textContent=`Beat ${beatIx+1} / ${BEATS.length} · paused`;
  }else{
    playing=true; beatStart=performance.now()-pausedElapsed;
    if(NARRATION_AUDIO) try{ NARRATION_AUDIO.play().catch(()=>{}); }catch(e){}
    else if('speechSynthesis' in window) try{ window.speechSynthesis.resume(); }catch(e){}
    if(ACTIVE_UTTERANCE||NARRATION_AUDIO) document.getElementById('narrationBtn').textContent='AI narration: Speaking';
    if(narrationEnabled&&!ACTIVE_UTTERANCE&&!NARRATION_AUDIO&&BEATS[beatIx]) speakBeat(BEATS[beatIx]);
    if(ACTIVE_AUDIO) try{ ACTIVE_AUDIO.play().catch(()=>{}); }catch(e){}
    button.textContent='⏸ Pause newscast';
    cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
  }
};
document.getElementById('narrationBtn').onclick=()=>{
  narrationEnabled=!narrationEnabled;
  stopNarration();
  document.getElementById('narrationBtn').textContent='AI narration: '+(narrationEnabled?'On':'Off');
  if(narrationEnabled&&BEATS[beatIx]) speakBeat(BEATS[beatIx]);
};
document.getElementById('narratorProvider').onchange=async()=>{
  try{
    await saveNarrationConfig();
    narrationEnabled=(NARRATION_CONFIG.provider==='azure'&&NARRATION_CONFIG.configured)||('speechSynthesis' in window);
    stopNarration();
    if(narrationEnabled&&BEATS[beatIx]) speakBeat(BEATS[beatIx]);
  }catch(e){ updateNarratorControls(); }
};
document.getElementById('narratorVoice').onchange=async()=>{
  NARRATION_CONFIG.voice=document.getElementById('narratorVoice').value;
  const selected=(NARRATION_CONFIG.voices||[]).find(v=>v.id===NARRATION_CONFIG.voice);
  NARRATION_CONFIG.style=(selected&&selected.styles&&selected.styles[0])||'general';
  updateNarratorControls();
  try{ await saveNarrationConfig(); stopNarration(); if(narrationEnabled&&BEATS[beatIx]) speakBeat(BEATS[beatIx]); }catch(e){ await loadNarrationConfig(); }
};
document.getElementById('narratorStyle').onchange=async()=>{
  NARRATION_CONFIG.style=document.getElementById('narratorStyle').value;
  try{ await saveNarrationConfig(); stopNarration(); if(narrationEnabled&&BEATS[beatIx]) speakBeat(BEATS[beatIx]); }catch(e){ await loadNarrationConfig(); }
};
document.getElementById('audioBtn').onclick=()=>{
  const clip=clipForBeat(BEATS[beatIx]);
  if(!clip||!clip.url) return;
  stopNarration();
  stopAudio();
  ACTIVE_AUDIO=new Audio(clip.url);
  if(Number(clip.start)>0) ACTIVE_AUDIO.currentTime=Number(clip.start);
  ACTIVE_AUDIO.play().catch(()=>{ document.getElementById('audioBtn').textContent='Audio could not play'; });
  if(Number(clip.end)>Number(clip.start)){
    ACTIVE_AUDIO.ontimeupdate=()=>{ if(ACTIVE_AUDIO&&ACTIVE_AUDIO.currentTime>=Number(clip.end)) stopAudio(); };
  }
};
function canvasPoint(event){
  const rect=cv.getBoundingClientRect();
  const scale=Math.min(rect.width/W,rect.height/H);
  const left=rect.left+(rect.width-W*scale)/2,top=rect.top+(rect.height-H*scale)/2;
  return {x:(event.clientX-left)/scale,y:(event.clientY-top)/scale};
}
function evidenceHit(event){
  const point=canvasPoint(event);
  return CLICK_TARGETS.find(hit=>point.x>=hit.x&&point.x<=hit.x+hit.w&&point.y>=hit.y&&point.y<=hit.y+hit.h)||null;
}
cv.addEventListener('pointermove',event=>{ cv.style.cursor=evidenceHit(event)?'pointer':'default'; });
cv.addEventListener('pointerleave',()=>{ cv.style.cursor='default'; });
cv.addEventListener('click',event=>{
  const hit=evidenceHit(event);
  if(hit){ window.open(hit.url,'_blank','noopener'); return; }
  if(awaitingNext && beatIx<BEATS.length-1) advance();
});
document.addEventListener('keydown',e=>{
  if(!STORY) return;
  if(e.key===' '){ e.preventDefault(); document.getElementById('autoBtn').click(); }
  if(e.key==='ArrowRight'){ e.preventDefault(); if(beatIx<BEATS.length-1) advance(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); goBack(); }
});

/* postMessage handshake: announce ready, parent responds with the story. */
window.addEventListener('message',(ev)=>{
  const d=ev.data||{};
  if(d.type==='mrv:load' && d.story){
    clearInterval(readyTimer);
    startRecap(d.story, d.people, d.photos);
  }
});
let readyAttempts=0;
let readyTimer=null;
function announceReady(){
  if(STORY) return;
  readyAttempts++;
  if(readyAttempts===2) setLoadingStatus('Requesting recap data','The player is ready. Waiting for the cached summary and scene data…',false);
  if(readyAttempts===5) setLoadingStatus('Still connecting','Retrying the recap handoff. You can stay on this page.',false);
  if(readyAttempts===8) showLoadingError();
  try{ (window.parent||window).postMessage({type:'mrv:ready'}, '*'); }catch(e){}
}
document.getElementById('loadingRetry').onclick=()=>{
  readyAttempts=1;
  document.getElementById('loadingRetry').style.display='none';
  setLoadingStatus('Requesting recap data','Retrying the cached recap handoff…',false);
  announceReady();
};
announceReady();
readyTimer=setInterval(announceReady,1200);
</script>
</body>
