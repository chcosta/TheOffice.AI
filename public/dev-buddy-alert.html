<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
      --cp-clear: transparent;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
      --cp-clear: transparent;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--cp-clear);
      pointer-events: none;
    }
    body { --alert-color: var(--cp-accent); }
    body[data-kind="pull-request"] { --alert-color: var(--cp-link); }
    body[data-kind="agent-run"] { --alert-color: var(--cp-success); }
    body[data-kind="build"] { --alert-color: var(--cp-success); }
    body[data-kind="session"] { --alert-color: var(--cp-text-soft); }
    body[data-kind="agenda"] { --alert-color: var(--cp-warning); }
    body[data-kind="teams"] { --alert-color: var(--cp-link); }
    body[data-kind="meeting"],
    body[data-kind="calendar"] { --alert-color: var(--cp-warning); }
    body[data-kind="email"] { --alert-color: var(--cp-accent); }
    body[data-kind="memory"] { --alert-color: var(--cp-accent); }
    .line {
      position: absolute;
      left: 0;
      height: 3px;
      border-radius: 3px;
      background: var(--alert-color);
      opacity: 0;
      transform: translateX(-110%);
      animation: sweep 2.8s cubic-bezier(.22,.7,.2,1) forwards;
    }
    .line:nth-child(1) { top: 7px; width: 34vw; animation-delay: 0s; }
    .line:nth-child(2) { top: 18px; width: 20vw; height: 2px; animation-delay: .12s; }
    .line:nth-child(3) { top: 31px; width: 46vw; height: 4px; animation-delay: .04s; }
    .line:nth-child(4) { top: 47px; width: 27vw; height: 2px; animation-delay: .2s; }
    .line:nth-child(5) { top: 59px; width: 38vw; animation-delay: .28s; }
    @keyframes sweep {
      0% { opacity: 0; transform: translateX(-110%); }
      15% { opacity: .9; }
      72% { opacity: .72; }
      100% { opacity: 0; transform: translateX(calc(100vw + 110%)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .line { animation-duration: 1.2s; }
    }
  </style>
</head>
<body>
  <span class="line"></span>
  <span class="line"></span>
  <span class="line"></span>
  <span class="line"></span>
  <span class="line"></span>
  <script>
    (() => {
      let hideTimer = null;
      window.runBuddyAlert = kind => {
        document.body.dataset.kind = kind || 'memory';
        const lines = [...document.querySelectorAll('.line')];
        for (const line of lines) line.style.animation = 'none';
        document.body.offsetWidth;
        for (const line of lines) line.style.animation = '';
        clearTimeout(hideTimer);
        hideTimer = setTimeout(async () => {
          const invoke = window.__TAURI__ && (window.__TAURI__.core?.invoke || window.__TAURI__.invoke);
          if (invoke) {
            try { await invoke('hide_dev_buddy_alert'); } catch (_) {}
          }
        }, 3400);
      };
      const params = new URLSearchParams(location.search);
      document.body.dataset.kind = params.get('kind') || 'memory';
      setTimeout(async () => {
        const invoke = window.__TAURI__ && (window.__TAURI__.core?.invoke || window.__TAURI__.invoke);
        if (invoke) {
          try { await invoke('hide_dev_buddy_alert'); } catch (_) {}
        }
      }, 50);
    })();
  </script>
</body>
</html>
